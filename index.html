<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#35251b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hearthmoor">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<title>Hearthmoor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed 3D village; parchment HUD strip on top, parchment action card at the bottom,
   and a leather-bound book that opens over everything for ledger and management. Single deliberate look. */
:root {
  color-scheme: light;
  --ink: #2a1f16;
  --ink-soft: #5d4a36;
  --parch: #ead8b2;
  --parch-2: #dcc493;
  --leather: #35251b;
  --seal: #8c2e21;
  --moss: #4a6634;
  --gold: #a87d22;
  --line: rgba(42, 31, 22, .22);
  --f-display: "IM Fell English", "Iowan Old Style", Georgia, serif;
  --f-body: "Alegreya Sans", "Gill Sans", "Trebuchet MS", system-ui, sans-serif;
}
[hidden] { display: none !important; }
html, body { height: 100%; background: #1d2420; color: var(--ink); overflow: hidden; overscroll-behavior: none; }
body { font-family: var(--f-body); font-size: 15px; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
#world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--seal); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* HUD */
.hud { position: fixed; top: 0; left: 0; right: 0; z-index: 5; pointer-events: none;
  padding-top: calc(env(safe-area-inset-top, 0px) + 8px);
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.strip { pointer-events: auto; display: flex; align-items: center; gap: 10px; background: linear-gradient(#efdfbd, var(--parch));
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px 6px 12px; box-shadow: 0 3px 12px rgba(0,0,0,.35); max-width: 720px; margin: 0 auto; }
.clock { font-family: var(--f-display); font-size: 18px; white-space: nowrap; }
.clock small { font-family: var(--f-body); font-size: 12px; color: var(--ink-soft); margin-left: 4px; }
.coins { margin-left: auto; font-weight: 700; font-size: 17px; color: var(--gold); white-space: nowrap; }
.coins::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #f0cf6a, #9c7414); margin-right: 5px; vertical-align: -1px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
.book-btn { border: 0; background: var(--leather); color: var(--parch); border-radius: 4px; padding: 8px 12px; font-family: var(--f-display); font-size: 16px; min-height: 40px; }
.subhud { pointer-events: none; display: flex; flex-wrap: wrap; gap: 6px; max-width: 720px; margin: 6px auto 0; }
.chip { background: rgba(32, 26, 20, .72); color: #f1e3c2; border-radius: 999px; padding: 4px 10px; font-size: 13px; white-space: nowrap; }
.chip b { color: #f5cf73; font-weight: 700; }
.goal { pointer-events: auto; max-width: 720px; margin: 6px auto 0; font-size: 13px; color: #f1e3c2; background: rgba(32,26,20,.72); border-radius: 6px; padding: 5px 10px; }
.goal em { font-family: var(--f-display); font-style: italic; color: #f5cf73; font-size: 14px; }

/* side controls */
.side { position: fixed; z-index: 5; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 240px; display: flex; flex-direction: column; gap: 8px; }
.side button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--parch); box-shadow: 0 2px 8px rgba(0,0,0,.35); font-size: 18px; font-weight: 700; }
.side button[aria-pressed="true"] { background: var(--leather); color: var(--parch); }

/* toasts */
.toasts { position: fixed; z-index: 6; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 112px); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.toast { max-width: 420px; background: var(--parch); border-left: 4px solid var(--ink-soft); border-radius: 4px; padding: 6px 10px; font-size: 14px; box-shadow: 0 3px 10px rgba(0,0,0,.35); animation: tin .25s ease-out; }
.toast.coin { border-color: var(--gold); } .toast.bad { border-color: var(--seal); } .toast.good { border-color: var(--moss); } .toast.story { border-color: var(--leather); font-family: var(--f-display); font-size: 15px; }
.toast.out { opacity: 0; transform: translateY(-6px); transition: .4s; }
@keyframes tin { from { opacity: 0; transform: translateY(-8px); } }
.night { position: fixed; z-index: 4; left: 50%; top: 50%; transform: translate(-50%, -50%); font-family: var(--f-display); font-style: italic; font-size: 22px; color: #e9d9b0; text-shadow: 0 2px 8px #000; pointer-events: none; }

/* action card */
.panel { position: fixed; z-index: 5; left: 0; right: 0; bottom: 0;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.card { pointer-events: auto; max-width: 720px; margin: 0 auto; background: linear-gradient(var(--parch), #e3cea4); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 -2px 18px rgba(0,0,0,.4); padding: 10px 12px 12px; }
.card h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 22px; line-height: 1.1; text-wrap: balance; }
.card .sub { color: var(--ink-soft); font-size: 14px; margin-top: 2px; }
.card .why { font-size: 14px; margin-top: 6px; padding: 6px 8px; background: rgba(255,255,255,.35); border-radius: 4px; }
.card .why b { font-weight: 700; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--parch); border-radius: 5px; padding: 8px 12px; min-height: 42px; font-weight: 500; font-size: 15px; }
.btn.alt { background: transparent; color: var(--ink); }
.btn.warn { background: var(--seal); border-color: var(--seal); }
.btn:disabled { opacity: .45; cursor: default; }
.places { display: flex; gap: 6px; margin-top: 8px; overflow-x: auto; scrollbar-width: none; }
.places::-webkit-scrollbar { display: none; }
.place { flex: none; border: 1px dashed var(--ink-soft); background: transparent; border-radius: 999px; padding: 6px 11px; font-size: 13px; color: var(--ink-soft); min-height: 34px; }
.bar { height: 8px; background: rgba(42,31,22,.15); border-radius: 4px; margin-top: 8px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--gold); border-radius: 4px; }
.mood i { background: var(--moss); } .mood.low i { background: var(--seal); }

/* book */
.book { position: fixed; inset: 0; z-index: 20; background: rgba(12, 9, 7, .72); display: flex; align-items: stretch; justify-content: center;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) max(8px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 10px) max(8px, env(safe-area-inset-left, 0px)); }
.cover { width: 100%; max-width: 720px; background: var(--leather); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,.6), inset 0 0 0 2px #4c3626; min-height: 0; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding: 0 2px; }
.tab { flex: none; border: 0; background: #5a4130; color: #e8d6b0; padding: 8px 10px 10px; border-radius: 6px 6px 0 0; font-family: var(--f-display); font-size: 15px; min-height: 40px; }
.tab[aria-selected="true"] { background: var(--parch); color: var(--ink); }
.close { margin-left: auto; flex: none; border: 0; background: transparent; color: #e8d6b0; font-size: 26px; line-height: 1; padding: 4px 10px; min-height: 40px; min-width: 40px; }
.page { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; background: radial-gradient(ellipse at 50% 0%, #f2e4c6, var(--parch) 60%, var(--parch-2)); border-radius: 0 6px 6px 6px; padding: 16px 18px 24px; user-select: text; -webkit-user-select: text; }
.page.turn { animation: turn .35s ease-out; transform-origin: left center; }
@keyframes turn { from { opacity: .2; transform: perspective(900px) rotateY(-14deg); } }
.page h3 { font-family: var(--f-display); font-weight: 400; font-size: 26px; margin: 0 0 4px; text-wrap: balance; }
.page h4 { font-family: var(--f-display); font-weight: 400; font-size: 19px; margin: 18px 0 6px; border-bottom: 1px solid var(--line); padding-bottom: 3px; }
.page p { line-height: 1.5; margin: 6px 0; max-width: 62ch; }
.lead { color: var(--ink-soft); font-style: italic; font-family: var(--f-display); font-size: 16px; }
.paused { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
table.acct { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 15px; }
table.acct td { padding: 3px 0; border-bottom: 1px dotted var(--line); }
table.acct td:last-child { text-align: right; }
table.acct tr.tot td { border-bottom: 0; border-top: 1.5px solid var(--ink); font-weight: 700; }
.day { margin-top: 14px; padding: 10px 12px; background: rgba(255,255,255,.28); border: 1px solid var(--line); border-radius: 6px; }
.dayhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.dayhead strong { font-family: var(--f-display); font-weight: 400; font-size: 20px; }
.seal { display: inline-flex; align-items: center; justify-content: center; min-width: 58px; height: 30px; padding: 0 9px; border-radius: 15px; color: #f6e8c8; font-weight: 700; font-size: 14px; background: var(--moss); box-shadow: inset 0 0 0 2px rgba(0,0,0,.15); }
.seal.neg { background: var(--seal); }
.notes { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.notes li { padding-left: 14px; position: relative; line-height: 1.45; }
.notes li::before { content: "\2766"; position: absolute; left: -2px; top: 0; color: var(--seal); font-size: 11px; }
.notes .btn { margin-top: 5px; min-height: 36px; padding: 5px 10px; font-size: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.box { background: rgba(255,255,255,.28); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; min-width: 0; }
.box h5 { margin: 0 0 4px; font-family: var(--f-display); font-weight: 400; font-size: 20px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 14px; font-variant-numeric: tabular-nums; }
.kv dt { color: var(--ink-soft); } .kv dd { margin: 0; text-align: right; }
.stepper { display: inline-flex; align-items: center; gap: 6px; }
.stepper button { width: 40px; height: 40px; border-radius: 5px; border: 1px solid var(--ink); background: transparent; font-size: 20px; }
.stepper output { min-width: 56px; text-align: center; font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--seal); height: 32px; }
.goals { list-style: none; padding: 0; margin: 8px 0; display: grid; gap: 8px; }
.goals li { display: flex; gap: 10px; align-items: flex-start; line-height: 1.4; }
.goals .tick { flex: none; width: 22px; height: 22px; border: 1.5px solid var(--ink); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; }
.goals .done .tick { background: var(--moss); border-color: var(--moss); color: #f3e6c8; }
.goals .done span:last-child { color: var(--ink-soft); text-decoration: line-through; text-decoration-color: rgba(42,31,22,.4); }
.goals .now span:last-child { font-weight: 700; }
textarea { width: 100%; min-height: 90px; font: 12px/1.3 ui-monospace, Menlo, monospace; background: #f6ecd6; border: 1px solid var(--line); border-radius: 4px; padding: 8px; color: var(--ink); }
.confirm { margin-top: 8px; padding: 8px 10px; border: 1px solid var(--seal); border-radius: 6px; background: rgba(140,46,33,.08); }
@media (prefers-reduced-motion: reduce) { .page.turn, .toast { animation: none; } }
@media (min-width: 700px) { .card h2 { font-size: 24px; } }
@media (orientation: landscape) and (max-height: 520px) {
  .card { max-width: 440px; margin-left: 0; padding: 8px 10px 10px; }
  .card h2 { font-size: 19px; } .card .sub { font-size: 13px; }
  .btn { min-height: 38px; padding: 6px 10px; font-size: 14px; }
  .goal { display: none; }
}
</style>
</head>
<body>


<canvas id="world" aria-label="The village of Hearthmoor"></canvas>
<header class="hud" id="hud">
  <div class="strip">
    <div class="clock num" id="clock">Day 1 · 06:00</div>
    <div class="coins num" id="coins">10c</div>
    <button class="book-btn" id="bookBtn" type="button">Ledger</button>
  </div>
  <div class="subhud" id="subhud"></div>
  <div class="goal" id="goal"></div>
</header>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="night" id="night" hidden>Night passes&hellip;</div>
<div class="side">
  <button type="button" id="zin" aria-label="Zoom in">+</button>
  <button type="button" id="zout" aria-label="Zoom out">&minus;</button>
  <button type="button" id="center" aria-label="Center on you">&#9678;</button>
  <button type="button" id="fast" aria-label="Double speed" aria-pressed="false">&#187;</button>
</div>
<section class="panel"><div class="card" id="card"><div id="cardInfo"></div><div id="cardActs"></div></div></section>
<div class="book" id="book" hidden>
  <div class="cover">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="page" id="page"></div>
  </div>
</div>

<script src="vendor/three.min.js"></script>
<script>
/* Hearthmoor simulation core.
   Pure game logic: no rendering, no DOM, no Math.random. The whole game state is
   plain JSON, so it can be saved, restored and tested headless. */
(function (root) {
  'use strict';

  const VERSION = 1;
  const DAY = 1440;
  const CARRY = 20;
  const SERVE_MIN = 3;
  const PATIENCE = 45;

  const P = {
    serve: { x: 0, z: 0.4 }, queue0: { x: 0, z: 2.6 }, oven: { x: -2.3, z: -0.8 },
    store: { x: 2.4, z: -0.6 }, bench: { x: 3.9, z: 2.4 },
    market: { x: 11.3, z: 11.1 }, well: { x: 6, z: -2.6 }, plaza: { x: 5, z: 6 },
    road: { x: 33, z: 3.5 }, home: { x: -8.4, z: 6.7 }, workerHome: { x: -8.6, z: -15.6 }
  };

  const LOCS = {
    bakery: { x: 0, z: 0, r: 4.6, name: 'Your Bakery' },
    field: { x: 17, z: -9, r: 6.5, name: 'Wheat Field' },
    forest: { x: -19, z: -11, r: 7, name: 'Pine Woods' },
    market: { x: 13, z: 13, r: 3.8, name: 'Trading Post' },
    home: { x: -10, z: 8, r: 3, name: 'Your Hut' },
    well: { x: 6, z: -4, r: 2, name: 'Village Well' }
  };

  const HOMES = [{ x: -17, z: 2 }, { x: -4, z: 17 }, { x: 4, z: 19 }, { x: 23, z: -1 }, { x: -1, z: -18 }, { x: 9, z: -17 }];
  const VILLAGERS = [
    { name: 'Aldric', job: 'field' }, { name: 'Maren', job: 'field' }, { name: 'Tobin', job: 'forest' },
    { name: 'Edda', job: 'forest' }, { name: 'Wynn', job: 'market' }, { name: 'Old Sela', job: 'well' }
  ];
  const TRAVELERS = ['A pilgrim', 'A tinker', 'A drover', 'A peddler', 'A soldier', 'A minstrel', 'A shepherd', 'A friar'];
  const APPLICANTS = ['Hilda', 'Bram', 'Osric', 'Linnet', 'Cade', 'Freya', 'Rolf', 'Agnes', 'Piers', 'Wenna'];

  const TIERS = [
    { name: 'Bread Stand', batch: 4, bakeMin: 60, cap: 12, travelers: 4, wtpBonus: 0, upkeep: 1 },
    { name: 'Timber Bakery', batch: 6, bakeMin: 50, cap: 24, travelers: 6, wtpBonus: 0.5, upkeep: 3, cost: { coin: 60, wood: 12 } },
    { name: 'Stone Bakery', batch: 8, bakeMin: 40, cap: 40, travelers: 10, wtpBonus: 1, upkeep: 6, cost: { coin: 180, wood: 25 } }
  ];
  const RECIPE = { grain: 2, wood: 1 };
  const BUY = { grain: 2, wood: 2 };
  const SELL = { grain: 1, wood: 1 };
  const GATHER = { grain: { min: 30, n: 2, loc: 'field' }, wood: { min: 40, n: 2, loc: 'forest' } };

  const GOALS = [
    { id: 'gather', text: 'Gather grain at the Wheat Field and wood in the Pine Woods', done: s => s.goals.gotGrain && s.goals.gotWood },
    { id: 'store', text: 'Store them at your bread stand', done: s => s.goals.stored },
    { id: 'bake', text: 'Bake your first batch at the oven', done: s => s.goals.baked },
    { id: 'sell', text: 'Sell 10 loaves', done: s => s.lifetime.sold >= 10 },
    { id: 'hire', text: 'Hire your first worker (open the book, Staff page)', done: s => s.goals.hired },
    { id: 'timber', text: 'Upgrade to a Timber Bakery (60c and 12 wood)', done: s => s.tier >= 1 },
    { id: 'stone', text: 'Upgrade to a Stone Bakery (180c and 25 wood)', done: s => s.tier >= 2 }
  ];

  /* ---------- helpers ---------- */
  function rand(s) {
    s.rng = (s.rng + 0x6D2B79F5) | 0;
    let t = s.rng;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function normal(s, mean, sd) {
    const u = Math.max(1e-9, rand(s)), v = rand(s);
    return mean + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  }
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const dist = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);
  const tier = s => TIERS[s.tier];
  const minuteOfDay = t => ((t % DAY) + DAY) % DAY;
  const hourOf = s => minuteOfDay(s.t) / 60;
  function clock(t) {
    const m = Math.floor(minuteOfDay(t));
    return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
  }
  function hm(min) {
    const m = Math.round(min);
    return Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm';
  }
  function moveTo(a, tx, tz, step) {
    const dx = tx - a.x, dz = tz - a.z, d = Math.hypot(dx, dz);
    if (d <= step || d < 0.05) { a.x = tx; a.z = tz; a.moving = false; return true; }
    a.x += dx / d * step; a.z += dz / d * step; a.face = Math.atan2(dx, dz); a.moving = true;
    return false;
  }
  function event(s, text, kind) {
    s.events.push({ t: s.t, text, kind: kind || 'info' });
    if (s.events.length > 40) s.events.splice(0, s.events.length - 40);
  }
  const carried = s => s.player.inv.grain + s.player.inv.wood;
  const agentById = (s, id) => s.agents.find(a => a.id === id);
  const queueSlot = i => ({ x: P.queue0.x, z: P.queue0.z + i * 1.0 });

  function freshStats(s) {
    return {
      day: s.day, price: s.price, sold: 0, revenue: 0, served: 0, tooExpensive: 0, soldOut: 0, noService: 0,
      noServiceWhy: {}, supplies: 0, wages: 0, upkeep: 0, upkeepUnpaid: 0, otherIncome: 0,
      ovenIdleAt: null, shelfFullAt: null, batches: 0, batchesBy: { player: 0, worker: 0 },
      servedBy: { player: 0, worker: 0 }, playerMin: 0, workerMin: 0
    };
  }

  /* ---------- new game ---------- */
  function newGame(seed) {
    const s = {
      v: VERSION, t: 6 * 60, day: 1, rng: (seed | 0) || 12345, coins: 10, price: 5, tier: 0,
      player: { x: P.home.x, z: P.home.z, face: 0, dest: null, action: null, inv: { grain: 0, wood: 0 } },
      bakery: { grain: 0, wood: 0, bread: 0, oven: { loaded: false, progress: 0, need: 0 }, serveProgress: 0, queue: [] },
      worker: null, policy: { supplyRuns: false },
      agents: [], nextId: 1, schedule: [], applicants: [], ledger: [], events: [],
      goals: { gotGrain: false, gotWood: false, stored: false, baked: false, hired: false },
      lifetime: { sold: 0, revenue: 0, days: 0 }, stats: null
    };
    VILLAGERS.forEach((v, i) => {
      const home = HOMES[i];
      s.agents.push({
        id: s.nextId++, kind: 'villager', name: v.name, job: v.job, home, x: home.x, z: home.z + 1.5, face: 0,
        spot: jobSpot(s, v.job), mode: 'routine', phase: null, doing: 'Waking up', icon: null, iconUntil: 0, palette: i
      });
    });
    openDay(s);
    event(s, 'Day 1. You have 10 coins and an empty bread stand. The Wheat Field and Pine Woods are free to gather from.', 'story');
    return s;
  }

  function jobSpot(s, job) {
    const j = () => (rand(s) - 0.5);
    if (job === 'field') return { x: LOCS.field.x + j() * 8, z: LOCS.field.z + j() * 6 };
    if (job === 'forest') return { x: LOCS.forest.x + 3 + j() * 5, z: LOCS.forest.z + 2 + j() * 5 };
    if (job === 'market') return { x: LOCS.market.x + 1.6, z: LOCS.market.z - 0.6 };
    return { x: P.well.x + 1.2, z: P.well.z + 0.6 };
  }

  /* ---------- day cycle ---------- */
  function openDay(s) {
    s.day = Math.floor((s.t - 360) / DAY) + 1;
    s.stats = freshStats(s);
    const base = s.t - minuteOfDay(s.t);
    const sched = [];
    s.agents.filter(a => a.kind === 'villager').forEach(a => {
      if (rand(s) < 0.85) sched.push({ at: base + (8 + rand(s) * 10) * 60, id: a.id });
    });
    const n = Math.max(0, tier(s).travelers + Math.floor(rand(s) * 3) - 1);
    for (let i = 0; i < n; i++) sched.push({ at: base + (8 + rand(s) * 10) * 60, id: null });
    sched.sort((a, b) => a.at - b.at);
    s.schedule = sched;
    if (!s.worker) makeApplicants(s);
    if (s.day > 1) event(s, 'Day ' + s.day + ' begins.', 'story');
  }

  function makeApplicants(s) {
    s.applicants = [];
    for (let i = 0; i < 2; i++) {
      const skill = Math.round((0.7 + rand(s) * 0.6) * 100) / 100;
      const ask = Math.round(3 + skill * 6);
      let name;
      do { name = APPLICANTS[Math.floor(rand(s) * APPLICANTS.length)]; } while (s.applicants.some(a => a.name === name));
      s.applicants.push({ name, skill, ask });
    }
  }

  function skillLabel(skill) { return skill < 0.85 ? 'Slow but cheap' : skill < 1.1 ? 'Steady' : 'Quick hands'; }

  function closeDay(s) {
    const st = s.stats, T = tier(s);
    const w = s.worker;
    if (w) {
      const paid = Math.min(s.coins, w.wage);
      s.coins -= paid; st.wages += paid;
      const full = paid >= w.wage;
      if (!full) { w.mood -= 25; w.unpaid = (w.unpaid || 0) + 1; }
      else { w.unpaid = 0; w.mood += w.wage >= w.ask ? 6 + Math.min(6, (w.wage - w.ask) * 2) : -(w.ask - w.wage) * 7; }
      w.mood = clamp(w.mood, 0, 100);
      st.workerPaid = full;
    }
    const up = Math.min(s.coins, T.upkeep);
    s.coins -= up; st.upkeep = up; st.upkeepUnpaid = T.upkeep - up;
    const entry = Object.assign({}, st, {
      tierName: T.name, workerName: w ? w.name : null, workerMood: w ? Math.round(w.mood) : null,
      workerWage: w ? w.wage : null, workerAsk: w ? w.ask : null, coinsEnd: s.coins
    });
    entry.income = st.revenue + st.otherIncome;
    entry.costs = st.supplies + st.wages + st.upkeep;
    entry.profit = entry.income - entry.costs;
    entry.notes = explain(s, entry);
    s.ledger.push(entry);
    if (s.ledger.length > 14) s.ledger.shift();
    s.lifetime.days++;
    event(s, 'Books closed for Day ' + entry.day + ': ' + (entry.profit >= 0 ? 'profit ' : 'loss ') + Math.abs(entry.profit) + 'c. Open the book to see why.', entry.profit >= 0 ? 'good' : 'bad');

    if (w) {
      if (w.mood < 15) {
        if (w.warned) {
          event(s, w.name + ' has quit. Pay was too low or late.', 'bad');
          entry.notes.push({ text: w.name + ' quit after a second miserable day. Workers expect at least their asking wage, paid on time.' });
          s.worker = null; makeApplicants(s);
        } else {
          w.warned = true;
          event(s, w.name + ' is miserable and may quit tomorrow.', 'bad');
        }
      } else w.warned = false;
    }
    // bakery closes: customers still waiting go home
    s.bakery.queue.slice().forEach(id => { const a = agentById(s, id); if (a) leaveShop(s, a, null); });
    s.bakery.queue = [];
  }

  /* ---------- the ledger's explanations ---------- */
  const WHY = {
    nobodyAtCounter: 'nobody was at the counter',
    youBaking: 'you were busy at the oven',
    youAway: 'you were away from the stand',
    workerBaking: 'your worker was at the oven',
    workerErrand: 'your worker was out buying supplies',
    workerLunch: 'your worker was on lunch break'
  };
  function explain(s, e) {
    const notes = [];
    const T = TIERS[s.tier];
    const lo = Math.round(5 + T.wtpBonus), hi = Math.round(7 + T.wtpBonus);
    if (e.soldOut > 0) {
      let t = e.soldOut + (e.soldOut === 1 ? ' customer' : ' customers') + ' left because the shelves were empty.';
      if (e.ovenIdleAt) t += ' The oven stood idle from ' + e.ovenIdleAt + ' because storage had no grain or wood.';
      else t += ' Bake earlier in the day so a batch is ready when people arrive.';
      const n = { text: t };
      if (e.ovenIdleAt && s.worker && !s.policy.supplyRuns) n.fix = { label: 'Let ' + s.worker.name + ' buy supplies', cmd: ['policy', 'supplyRuns', true] };
      notes.push(n);
    }
    if (e.tooExpensive > 0) {
      const n = { text: e.tooExpensive + (e.tooExpensive === 1 ? ' customer' : ' customers') + ' walked away at ' + e.price + 'c a loaf. Most people here will pay ' + lo + '–' + hi + 'c.' };
      if (e.price > hi) n.fix = { label: 'Set price to ' + (lo + 1) + 'c', cmd: ['setPrice', lo + 1] };
      notes.push(n);
    }
    if (e.noService > 0) {
      const causes = Object.keys(e.noServiceWhy).sort((a, b) => e.noServiceWhy[b] - e.noServiceWhy[a]).map(k => WHY[k] || k);
      const n = { text: e.noService + (e.noService === 1 ? ' customer' : ' customers') + ' gave up waiting because ' + causes.join(', or ') + '.' };
      if (!s.worker) n.fix = { label: 'Hire help', cmd: ['page', 'staff'] };
      notes.push(n);
    }
    if (e.shelfFullAt && e.sold > 0) notes.push({ text: 'The shelf was full at ' + e.shelfFullAt + ', so no more bread could be baked. A bigger bakery holds more.' });
    if (e.price <= 2) notes.push({ text: 'At ' + e.price + 'c a loaf you barely cover bought supplies (about ' + (5 / T.batch).toFixed(1) + 'c a loaf).' });
    if (e.profit < 0) {
      notes.push({ text: 'You lost ' + (-e.profit) + 'c. Costs were ' + e.costs + 'c (supplies ' + e.supplies + 'c, wages ' + e.wages + 'c, upkeep ' + e.upkeep + 'c) against ' + e.income + 'c coming in.' });
    }
    if (e.upkeepUnpaid > 0) notes.push({ text: 'You could not cover ' + e.upkeepUnpaid + 'c of upkeep. Nothing was taken from you, but earn some coin before tomorrow.' });
    if (s.worker && e.workerName) {
      const w = s.worker;
      if (e.workerPaid === false) notes.push({ text: w.name + ' was not paid in full and is upset. Keep at least ' + w.wage + 'c by closing time.' });
      else if (w.wage < w.ask) notes.push({ text: w.name + ' asked for ' + w.ask + 'c a day but gets ' + w.wage + 'c. Mood is falling (' + Math.round(w.mood) + '/100).', fix: { label: 'Pay ' + w.ask + 'c a day', cmd: ['setWage', w.ask] } });
      if (w.mood < 30) notes.push({ text: w.name + ' is unhappy and works about 30% slower.' });
    }
    if (e.sold === 0 && e.batches === 0 && !s.goals.baked) {
      notes.push({ text: 'Nothing was baked yet. Gather grain and wood, store them at the stand, then bake at the oven.' });
    }
    if (!notes.length && e.profit > 0) notes.push({ text: 'A good day. Every customer who wanted bread at your price got some.' });
    return notes;
  }

  /* ---------- customers and villagers ---------- */
  function spawnScheduled(s) {
    while (s.schedule.length && s.schedule[0].at <= s.t) {
      const e = s.schedule.shift();
      const T = tier(s);
      let a;
      if (e.id == null) {
        a = {
          id: s.nextId++, kind: 'traveler', name: TRAVELERS[Math.floor(rand(s) * TRAVELERS.length)],
          x: P.road.x, z: P.road.z + (rand(s) - 0.5) * 3, face: -Math.PI / 2, mode: 'shop', phase: 'toShop',
          doing: 'Looking for bread', icon: null, iconUntil: 0, palette: 6 + Math.floor(rand(s) * 4)
        };
        a.wtp = clamp(normal(s, 6.5 + T.wtpBonus, 1.4), 2, 13);
        s.agents.push(a);
      } else {
        a = agentById(s, e.id);
        if (!a || a.mode === 'shop') continue;
        a.mode = 'shop'; a.phase = 'toShop'; a.doing = 'Going to buy bread';
        a.wtp = clamp(normal(s, 6 + T.wtpBonus, 1.4), 2, 13);
      }
      a.qty = rand(s) < 0.35 ? 2 : 1;
    }
  }

  function ovenWillProduce(s) {
    const b = s.bakery;
    return b.oven.loaded || (b.grain >= RECIPE.grain && b.wood >= RECIPE.wood);
  }

  function noServiceCause(s) {
    const w = s.worker;
    if (w && w.task === 'bake') return 'workerBaking';
    if (w && w.task === 'supply') return 'workerErrand';
    if (w && w.task === 'lunch') return 'workerLunch';
    const p = s.player;
    if (p.action && p.action.type === 'bake') return 'youBaking';
    if (dist(p, LOCS.bakery) > LOCS.bakery.r) return 'youAway';
    return 'nobodyAtCounter';
  }

  function leaveShop(s, a, reason) {
    const st = s.stats;
    if (reason === 'tooExpensive') { st.tooExpensive++; a.icon = 'angry'; }
    else if (reason === 'soldOut') { st.soldOut++; a.icon = 'angry'; }
    else if (reason === 'noService') {
      st.noService++; a.icon = 'angry';
      const k = noServiceCause(s); st.noServiceWhy[k] = (st.noServiceWhy[k] || 0) + 1;
    } else if (reason === 'served') a.icon = 'happy';
    else a.icon = null;
    a.iconUntil = s.t + 50;
    const qi = s.bakery.queue.indexOf(a.id);
    if (qi >= 0) s.bakery.queue.splice(qi, 1);
    if (a.kind === 'traveler') { a.mode = 'shop'; a.phase = 'leave'; a.doing = 'Leaving the village'; }
    else { a.mode = 'routine'; a.phase = null; }
    a.lastReason = reason;
  }

  function updateShopper(s, a, dt) {
    const speed = 1.0 * dt, b = s.bakery;
    if (a.phase === 'toShop') {
      const slot = queueSlot(b.queue.length);
      a.doing = 'Going to buy bread';
      if (moveTo(a, slot.x, slot.z, speed)) {
        if (s.price > a.wtp) {
          leaveShop(s, a, 'tooExpensive');
          if (s.stats.tooExpensive <= 2) event(s, a.name + ' thought ' + s.price + 'c a loaf was too much.', 'bad');
        } else if (b.bread <= 0 && !ovenWillProduce(s)) {
          leaveShop(s, a, 'soldOut');
          event(s, a.name + ' found empty shelves and left.', 'bad');
        } else {
          b.queue.push(a.id); a.phase = 'queue'; a.patience = PATIENCE; a.icon = 'wait';
        }
      }
    } else if (a.phase === 'queue') {
      const idx = b.queue.indexOf(a.id);
      if (idx < 0) { a.phase = 'toShop'; return; }
      const slot = queueSlot(idx);
      moveTo(a, slot.x, slot.z, speed);
      a.patience -= dt;
      a.doing = 'Waiting in line (' + Math.max(0, Math.round(a.patience)) + ' min of patience left)';
      if (a.patience <= 0) {
        const reason = b.bread <= 0 ? 'soldOut' : 'noService';
        leaveShop(s, a, reason);
        event(s, a.name + (reason === 'soldOut' ? ' gave up: no bread.' : ' gave up waiting: ' + (WHY[noServiceCause(s)] || 'nobody served them') + '.'), 'bad');
      }
    } else if (a.phase === 'leave') {
      if (moveTo(a, P.road.x, P.road.z, speed * 1.2)) a.gone = true;
    }
  }

  function villagerRoutine(s, a, dt) {
    const h = hourOf(s);
    let tgt, doing, working = false;
    if (h < 6 || h >= 21) { tgt = a.home; doing = 'Asleep'; }
    else if (h < 7) { tgt = a.spot; doing = 'Walking to work'; }
    else if (h < 12 || (h >= 13 && h < 17)) { tgt = a.spot; doing = jobDoing(a.job); working = true; }
    else if (h < 13) { tgt = { x: P.well.x + ((a.id % 3) - 1) * 1.2, z: P.well.z - 1.2 }; doing = 'Lunch by the well'; }
    else { tgt = { x: P.plaza.x + ((a.id % 4) - 1.5) * 1.3, z: P.plaza.z + ((a.id % 2) ? 1 : -1) }; doing = 'Chatting in the square'; }
    const arrived = moveTo(a, tgt.x, tgt.z, 0.9 * dt);
    a.doing = arrived ? doing : (doing === 'Asleep' ? 'Heading home' : doing.startsWith('Walking') ? doing : 'On the way: ' + doing.toLowerCase());
    a.working = arrived && working;
    a.indoors = arrived && doing === 'Asleep';
  }
  function jobDoing(job) {
    return { field: 'Reaping wheat', forest: 'Felling pines', market: 'Trading at the post', well: 'Drawing water' }[job] || 'Working';
  }

  function updateAgents(s, dt) {
    for (const a of s.agents) {
      if (a.icon && s.t > a.iconUntil && a.icon !== 'wait') a.icon = null;
      a.indoors = false;
      if (a.mode === 'shop') updateShopper(s, a, dt);
      else villagerRoutine(s, a, dt);
    }
    if (s.agents.some(a => a.gone)) s.agents = s.agents.filter(a => !a.gone);
  }

  /* ---------- the oven and the counter ---------- */
  function ovenStep(s, dt, speed, who) {
    const b = s.bakery, o = b.oven, T = tier(s);
    if (!o.loaded) {
      if (b.bread + T.batch > T.cap) { if (!s.stats.shelfFullAt) s.stats.shelfFullAt = clock(s.t); return 'full'; }
      if (b.grain < RECIPE.grain || b.wood < RECIPE.wood) { if (!s.stats.ovenIdleAt) s.stats.ovenIdleAt = clock(s.t); return 'empty'; }
      b.grain -= RECIPE.grain; b.wood -= RECIPE.wood;
      o.loaded = true; o.progress = 0; o.need = T.bakeMin;
    }
    o.progress += dt * speed;
    if (o.progress >= o.need) {
      o.loaded = false; o.progress = 0;
      b.bread += T.batch;
      s.stats.batches++; s.stats.batchesBy[who]++;
      s.goals.baked = true;
      event(s, (who === 'player' ? 'You' : s.worker.name) + ' baked ' + T.batch + ' loaves.', 'good');
      return 'done';
    }
    return 'baking';
  }

  function playerAttending(s) {
    const p = s.player;
    return !p.dest && !p.action && dist(p, P.serve) < 0.8;
  }
  function workerAttending(s) {
    const w = s.worker;
    return !!w && (w.task === 'serve' || w.task === 'tend') && dist(w, P.serve) < 0.8;
  }
  function workerSpeed(w) { return w.skill * (w.mood < 30 ? 0.7 : 1); }

  function updateCounter(s, dt) {
    const b = s.bakery;
    const pa = playerAttending(s), wa = workerAttending(s);
    if (pa) s.stats.playerMin += dt;
    if (!b.queue.length) { b.serveProgress = 0; return; }
    const front = agentById(s, b.queue[0]);
    if (!front) { b.queue.shift(); return; }
    if (front.phase !== 'queue' || dist(front, P.queue0) > 0.6 || b.bread <= 0) return;
    const speed = Math.max(pa ? 1 : 0, wa ? workerSpeed(s.worker) : 0);
    if (speed <= 0) return;
    b.serveProgress += dt * speed;
    if (b.serveProgress >= SERVE_MIN) {
      const qty = Math.min(front.qty, b.bread);
      const coin = qty * s.price;
      b.bread -= qty; s.coins += coin;
      s.stats.sold += qty; s.stats.revenue += coin; s.stats.served++;
      s.stats.servedBy[pa ? 'player' : 'worker']++;
      s.lifetime.sold += qty; s.lifetime.revenue += coin;
      b.serveProgress = 0;
      leaveShop(s, front, 'served');
      event(s, front.name + ' bought ' + qty + (qty === 1 ? ' loaf' : ' loaves') + ' for ' + coin + 'c.', 'coin');
    }
  }

  /* ---------- the player ---------- */
  function updatePlayer(s, dt) {
    const p = s.player;
    if (p.dest) {
      if (moveTo(p, p.dest.x, p.dest.z, 1.5 * dt)) {
        const then = p.dest.then; p.dest = null;
        if (then) beginAction(s, then);
      }
      return;
    }
    p.moving = false;
    const a = p.action;
    if (!a) return;
    if (a.type === 'bake') {
      s.stats.playerMin += dt;
      const r = ovenStep(s, dt, 1, 'player');
      if (r !== 'baking') {
        p.action = null;
        if (r === 'empty') event(s, 'Storage needs ' + RECIPE.grain + ' grain and ' + RECIPE.wood + ' wood to bake.', 'bad');
        if (r === 'full') event(s, 'The shelf is full. Sell some bread first.', 'bad');
        if (r === 'done' && s.bakery.queue.length) walkTo(s, P.serve);
      }
      return;
    }
    if (a.type === 'gather') {
      a.left -= dt;
      if (a.left <= 0) {
        const g = GATHER[a.good];
        const n = Math.min(g.n, CARRY - carried(s));
        p.inv[a.good] += n;
        if (a.good === 'grain') s.goals.gotGrain = true; else s.goals.gotWood = true;
        if (carried(s) >= CARRY) { p.action = null; event(s, 'Your arms are full (' + CARRY + ' items). Store or sell what you carry.', 'info'); }
        else a.left = g.min;
      }
    }
  }

  function walkTo(s, pt, then) {
    s.player.action = null;
    s.player.dest = { x: pt.x, z: pt.z, then: then || null };
  }

  function beginAction(s, then) {
    const p = s.player;
    if (then.type === 'gather') {
      if (carried(s) >= CARRY) { event(s, 'Your arms are full. Store or sell what you carry first.', 'bad'); return; }
      p.action = { type: 'gather', good: then.good, left: GATHER[then.good].min };
    } else if (then.type === 'bake') {
      p.action = { type: 'bake' };
      p.face = Math.PI;
    } else if (then.type === 'store') {
      storeGoods(s);
    } else if (then.type === 'storeThenBake') {
      storeGoods(s);
      walkTo(s, P.oven, { type: 'bake' });
    }
  }

  function storeGoods(s) {
    const p = s.player, b = s.bakery, T = tier(s);
    let moved = 0;
    for (const g of ['grain', 'wood']) {
      const room = T.cap - b[g];
      const n = Math.max(0, Math.min(room, p.inv[g]));
      b[g] += n; p.inv[g] -= n; moved += n;
    }
    if (moved) { s.goals.stored = true; event(s, 'Stored ' + moved + ' items at the bakery.', 'info'); }
    else if (p.inv.grain + p.inv.wood > 0) event(s, 'Bakery storage is full (' + T.cap + ' of each).', 'bad');
    else event(s, 'You are not carrying any grain or wood.', 'info');
  }

  /* ---------- the worker ---------- */
  function updateWorker(s, dt) {
    const w = s.worker;
    if (!w) return;
    const h = hourOf(s), b = s.bakery, T = tier(s);
    w.indoors = false;
    if (w.task === 'supply' && h >= 6 && h < 20) { supplyRun(s, w, dt); s.stats.workerMin += dt; return; }
    if (h < 6 || h >= 20) {
      w.task = 'sleep';
      if (moveTo(w, w.home.x, w.home.z, 1.1 * dt)) { w.indoors = true; w.why = 'Asleep at home'; } else w.why = 'Walking home';
      return;
    }
    if (h < 7) { w.task = 'commute'; moveTo(w, P.serve.x, P.serve.z, 1.1 * dt); w.why = 'Walking to work for 07:00'; return; }
    if (h >= 19) { w.task = 'home'; moveTo(w, w.home.x, w.home.z, 1.1 * dt); w.why = 'Shift over at 19:00, heading home'; return; }
    if (h >= 12 && h < 12.5) { w.task = 'lunch'; moveTo(w, P.bench.x, P.bench.z, 1.1 * dt); w.why = 'Lunch break until 12:30'; return; }

    s.stats.workerMin += dt;
    const sp = workerSpeed(w);
    const low = !b.oven.loaded && (b.grain < RECIPE.grain || b.wood < RECIPE.wood);
    const target = Math.min(T.cap - T.batch, T.batch * 2);
    const missingCost = Math.max(0, RECIPE.grain - b.grain) * BUY.grain + Math.max(0, RECIPE.wood - b.wood) * BUY.wood;
    if (s.policy.supplyRuns && low && s.coins >= missingCost && h < 18 && !(w.supWait > s.t)) {
      w.task = 'supply'; w.sup = { phase: 'go' };
      w.why = 'Storage is out of grain or wood, so ' + w.name + ' is buying more at the Trading Post';
      supplyRun(s, w, dt); return;
    }
    if (b.queue.length && b.bread > 0) {
      w.task = 'serve'; moveTo(w, P.serve.x, P.serve.z, 1.1 * dt);
      w.why = 'Serving ' + b.queue.length + (b.queue.length === 1 ? ' waiting customer' : ' waiting customers');
      return;
    }
    if (b.oven.loaded || (!low && b.bread < target)) {
      w.task = 'bake';
      if (moveTo(w, P.oven.x, P.oven.z, 1.1 * dt)) {
        w.face = Math.PI;
        const r = ovenStep(s, dt, sp, 'worker');
        w.why = r === 'baking' ? 'Baking: ' + Math.round(b.oven.progress / b.oven.need * 100) + '% done, shelf has ' + b.bread + ' (aims for ' + target + ')' : 'Checking the oven';
      } else w.why = 'Going to the oven: shelf has only ' + b.bread + ' loaves';
      return;
    }
    w.task = 'tend'; moveTo(w, P.serve.x, P.serve.z, 1.1 * dt);
    if (low) {
      if (!s.stats.ovenIdleAt && b.bread < target) s.stats.ovenIdleAt = clock(s.t);
      w.why = s.policy.supplyRuns ? 'Waiting: no grain or wood, and not enough coin to buy more' : 'Waiting at the counter: no grain or wood in storage';
    } else w.why = 'Minding the counter: shelf is stocked (' + b.bread + ' loaves)';
  }

  function supplyRun(s, w, dt) {
    const b = s.bakery, T = tier(s);
    if (w.sup.phase === 'go') {
      w.why = 'Walking to the Trading Post for supplies';
      if (moveTo(w, P.market.x - 0.8, P.market.z, 1.1 * dt)) {
        // buy only what is missing, up to three batches' worth, within coin and storage limits
        let g = b.grain >= RECIPE.grain * 3 ? 0 : Math.min(RECIPE.grain * 3 - b.grain, T.cap - b.grain);
        let wd = b.wood >= RECIPE.wood * 3 ? 0 : Math.min(RECIPE.wood * 3 - b.wood, T.cap - b.wood);
        while (g * BUY.grain + wd * BUY.wood > s.coins && (g > 0 || wd > 0)) {
          if (g >= wd * 2 && g > 0) g--; else wd--;
        }
        if (g + wd <= 0) { w.task = null; w.sup = null; w.supWait = s.t + 90; w.why = 'Could not afford supplies'; return; }

function placeChar(g, a, t, opts) {
  const u = g.userData;
  g.position.x = a.x; g.position.z = a.z;
  const target = a.face || 0;
  let d = target - g.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d)); g.rotation.y += d * 0.25;
  const ph = t * 10 + u.phase;
  if (opts.moving) { u.body.position.y = 0.36 + Math.abs(Math.sin(ph)) * 0.06; u.head.position.y = 0.92 + Math.abs(Math.sin(ph)) * 0.06; u.hl.position.z = Math.sin(ph) * 0.18; u.hr.position.z = -Math.sin(ph) * 0.18; u.hl.position.y = u.hr.position.y = 0.42; }
  else if (opts.working) { const w = Math.sin(t * 7 + u.phase); u.body.position.y = 0.36; u.head.position.y = 0.92 + Math.max(0, w) * 0.04; u.hl.position.set(-0.28, 0.5 + Math.max(0, w) * 0.25, 0.22); u.hr.position.set(0.28, 0.5 + Math.max(0, -w) * 0.25, 0.22); }

function syncChars(s, t) {
  const p = s.player;

  placeChar(playerMesh, p, t, { moving: p.moving && !!p.dest, working: !!p.action, pack: carry ? 0.7 + carry / 30 : 0, selected: UI.sel === 'player' });
  if (s.worker) {
    if (!workerMesh || workerName !== s.worker.name) { if (workerMesh) dropChar(workerMesh); workerMesh = makeChar({ tunic: '#b8a079', skin: SKIN[s.worker.name.length % SKIN.length], hat: 'chef', pick: 'worker' }); workerName = s.worker.name; }
    const w = s.worker;
    placeChar(workerMesh, w, t, { moving: w.moving, working: w.task === 'bake' && !w.moving, pack: w.carry ? 1 : 0, hidden: w.indoors, selected: UI.sel === 'worker' });
  } else if (workerMesh) { dropChar(workerMesh); workerMesh = null; workerName = null; if (UI.sel === 'worker') UI.sel = null; }
  const seen = new Set();
  for (const a of s.agents) {
    seen.add(a.id);
    let g = agentMeshes.get(a.id);
    if (!g) {
      const role = a.kind === 'traveler' ? { hat: 'hood', capColor: '#5b4936' } : (ROLE[a.job] || {});
      g = makeChar(Object.assign({ tunic: TUNIC[a.palette % TUNIC.length], skin: SKIN[a.id % SKIN.length], pick: a.id }, role));

  }
  for (const [id, g] of agentMeshes) if (!seen.has(id)) { dropChar(g); agentMeshes.delete(id); if (UI.sel === id) UI.sel = null; }
}

function syncBakery(s, t, dt) {
  const T = s.tier, b = s.bakery;
  B.tiers.forEach((g, i) => g.visible = i === T);
  const shown = Math.min(12, Math.ceil(b.bread * 12 / Math.max(12, Sim.TIERS[T].cap)));
  B.loaves.forEach((m, i) => m.visible = i < (b.bread > 0 ? Math.max(1, shown) : 0));
  const sacks = Math.ceil(b.grain / 2), logs = Math.ceil(b.wood * 9 / Sim.TIERS[T].cap);
  B.sacks.forEach((m, i) => m.visible = i < Math.min(8, sacks));
  B.logs.forEach((m, i) => m.visible = i < Math.min(9, b.wood > 0 ? Math.max(1, logs) : 0));
  const baking = b.oven.loaded;
  ovenGlow.intensity = baking ? 1.6 + Math.sin(t * 13) * 0.25 + Math.sin(t * 5.3) * 0.2 : 0;
  mouthMat.emissiveIntensity = baking ? 0.9 + Math.sin(t * 9) * 0.15 : 0;
  // roof fades when you look into the building
  const near = Math.hypot(focus.x, focus.z) < 9;
  B.roofs.forEach(r => { r.material.opacity += ((near ? 0.12 : 1) - r.material.opacity) * Math.min(1, dt * 6); r.material.depthWrite = r.material.opacity > 0.9; });
  const chim = T === 0 ? { x: -2.3, y: 1.4, z: -1.75 } : T === 1 ? { x: -2.3, y: 4.4, z: -2.4 } : { x: -2.3, y: 4.9, z: -2.7 };
  smoke.forEach(m => {
    m.userData.life += dt * 0.35;
    if (m.userData.life > 1) { m.userData.life -= 1; m.userData.on = baking; }
    const l = m.userData.life;
    if (!m.userData.on) { m.visible = false; return; }
    m.visible = true;
    m.position.set(chim.x + Math.sin(l * 6 + t) * 0.3 + l * 1.2, chim.y + l * 3.2, chim.z + l * 0.6);
    m.scale.setScalar(0.5 + l * 1.4); m.material.opacity = 0.5 * (1 - l);
  });
}

function syncLight(s) {
  const h = Sim.hourOf(s);
  let k; // 1 = full day, 0 = night
  if (h < 5) k = 0; else if (h < 7) k = (h - 5) / 2; else if (h < 18) k = 1; else if (h < 21) k = 1 - (h - 18) / 3; else k = 0;
  const dusk = Math.max(0, 1 - Math.abs(h - 19) / 1.6) + Math.max(0, 1 - Math.abs(h - 6) / 1.2) * 0.6;
  tmpC.copy(SKY.night).lerp(SKY.day, k).lerp(SKY.dusk, Math.min(0.55, dusk * 0.55));
  scene.fog.color.copy(tmpC); renderer.setClearColor(tmpC);
  hemi.intensity = 0.25 + k * 0.6;
  sun.intensity = 0.1 + k * 0.85;
  sun.color.set(dusk > 0.3 ? '#ffb36b' : '#ffe2b0');
  const ang = ((h - 6) / 15) * Math.PI;
  sun.position.set(Math.cos(ang) * -30, 10 + Math.sin(Math.max(0.1, ang)) * 25, 14);
  windowMat.emissiveIntensity = Math.max(0, 1 - k * 1.4) * 1.1;
  scene.fog.near = 26 - (1 - k) * 8; scene.fog.far = 70 - (1 - k) * 22;
}

      html += `<div class="box"><h5>${esc(a.name)}</h5><dl class="kv"><dt>Skill</dt><dd>${Sim.skillLabel(a.skill)} (${Math.round(a.skill * 100)}% speed)</dd><dt>Asks for</dt><dd>${a.ask}c a day</dd></dl>
        <div class="stepper" style="margin-top:8px"><button type="button" data-c='${JSON.stringify(['ui', 'wage', [i, wage - 1]])}' aria-label="Lower offer">&minus;</button><output class="num">${wage}c</output><button type="button" data-c='${JSON.stringify(['ui', 'wage', [i, wage + 1]])}' aria-label="Raise offer">+</button></div>
        <div class="acts">${B_(`Hire ${esc(a.name)} at ${wage}c a day`, ['hire', i, wage])}</div></div>`;
    });
    html += `</div><p>Once hired, your worker bakes and serves on their own. That frees you to gather wood for upgrades or trade at the Trading Post. You will still need to keep grain and wood in storage, or tell them to buy it on the Bakery page.</p>`;
  }
  return html;
}
function pageGoals(s) {
  const firstOpen = Sim.GOALS.findIndex(g => !g.done(s));
  return `<h3>From Scrounger to Master Baker</h3><p class="lead">The first chapter of Hearthmoor.</p><ul class="goals">${Sim.GOALS.map((g, i) => `<li class="${g.done(s) ? 'done' : i === firstOpen ? 'now' : ''}"><span class="tick">${g.done(s) ? '&#10003;' : i + 1}</span><span>${esc(g.text)}</span></li>`).join('')}</ul>
  <h4>How the village works</h4><p>Days run from 06:00 to 21:00, about four minutes of real time. Nights pass quickly. Villagers keep their own routines: work in the fields and woods, lunch at the well at noon, an evening in the square, and bed. Most buy bread once a day. Travelers stop by from the east road, and a better bakery draws more of them.</p>
  <p>The books close at 21:00, when wages and upkeep are paid. You can never go into debt: if coin runs short, what can't be paid is skipped and explained in the ledger.</p>
  <p>Lifetime: ${s.lifetime.sold} loaves sold for ${s.lifetime.revenue}c over ${s.lifetime.days} days.</p>`;
}
function pageSave(s) {
  const ago = lastSave ? Math.round((Date.now() - lastSave) / 1000) : null;
  return `<h3>Saving</h3><p class="lead">Your game saves itself every 10 seconds, whenever you leave the page, and when you close this book.</p>
  <p>${saveOk ? (ago != null ? `Last saved ${ago} seconds ago. The save before that is kept as a backup.` : 'Not saved yet.') : 'This browser is not letting the game save. Export a copy below to keep your progress.'}</p>
  <div class="acts">${B_('Save now', ['ui', 'save'])}</div>
  <h4>Keep a copy</h4><p>Saves live in this browser only. Clearing site data erases them, so export a copy now and then.</p>
  <div class="acts">${B_('Show save code', ['ui', 'export'], 'alt')}${UI.exportText ? B_('Copy code', ['ui', 'copy'], 'alt') : ''}</div>
  ${UI.exportText ? `<textarea id="exportBox" readonly aria-label="Save code">${esc(UI.exportText)}</textarea>` : ''}
  <h4>Load a copy</h4><textarea id="importBox" placeholder="Paste a save code here" aria-label="Paste save code"></textarea>
  <div class="acts">${B_('Load this save', ['ui', 'import'], 'alt')}</div>${UI.importMsg ? `<p>${esc(UI.importMsg)}</p>` : ''}
  <h4>Start over</h4>${UI.confirm === 'new' ? `<div class="confirm">Start a new game? Your current village will be replaced. Export it first if you want to keep it. <div class="acts">${B_('Yes, start over', ['ui', 'newgame'], 'warn')}${B_('Cancel', ['ui', 'confirm', null], 'alt')}</div></div>` : `<div class="acts">${B_('New game&hellip;', ['ui', 'confirm', 'new'], 'alt')}</div>`}`;
}
function uiCmd(k, v) {
  if (k === 'deselect') { UI.sel = null; renderCard(true); return; }
  if (k === 'tab') { UI.tab = v; UI.confirm = null; renderBook(true); return; }
  if (k === 'close') { closeBook(); return; }
  if (k === 'confirm') { UI.confirm = v; renderBook(); return; }
  if (k === 'wage') { UI['wage' + v[0]] = clamp(v[1], 1, 30); renderBook(); return; }
  if (k === 'save') { saveNow(); toast(saveOk ? 'Saved.' : 'Could not save in this browser. Export a copy instead.', saveOk ? 'good' : 'bad'); renderBook(); return; }
  if (k === 'export') { UI.exportText = encodeSave(G); renderBook(); return; }
  if (k === 'copy') {
    const box = $('exportBox');
    const fallback = () => { if (box) { box.focus(); box.select(); } toast('Code selected. Copy it with your keyboard or the share menu.', 'info'); };
    try { navigator.clipboard.writeText(UI.exportText).then(() => toast('Save code copied.', 'good'), fallback); } catch (e) { fallback(); }
    return;
  }
  if (k === 'import') {
    const t = ($('importBox') || {}).value || '';
    try { G = decodeSave(t); UI.importMsg = 'Loaded. Welcome back to Day ' + G.day + '.'; resetView(); saveNow(); }
    catch (e) { UI.importMsg = 'That code did not load: ' + e.message + '. Check that you pasted all of it.'; }
    renderBook(); return;
  }
  if (k === 'newgame') { G = Sim.newGame((Date.now() % 2147483647) | 0); UI.confirm = null; resetView(); saveNow(); closeBook(); return; }
}
function resetView() { UI.sel = null; UI.loc = null; focus.set(G.player.x, 0, G.player.z); G.events.length = 0; lastEventT = -1; for (const [id, g] of agentMeshes) dropChar(g); agentMeshes.clear(); }
document.addEventListener('input', e => {
  if (e.target.id === 'price') { Sim.cmd(G, 'setPrice', +e.target.value); const T = Sim.TIERS[G.tier]; $('pv').textContent = G.price + 'c'; $('pw').textContent = `About ${shareWilling(G.price, 6 + T.wtpBonus)}% of villagers and ${shareWilling(G.price, 6.5 + T.wtpBonus)}% of travelers will pay this.`; }
});
document.addEventListener('change', e => { if (e.target.id === 'pol') act(['policy', 'supplyRuns', e.target.checked]); });
$('bookBtn').onclick = () => openBook();
$('goal').onclick = () => openBook('goals');
$('zin').onclick = () => zoom = clamp(zoom * 0.85, 0.55, 1.7);
$('zout').onclick = () => zoom = clamp(zoom * 1.18, 0.55, 1.7);
$('center').onclick = () => { panHold = 0; };
$('fast').onclick = () => { UI.speed = UI.speed === 1 ? 2 : 1; $('fast').setAttribute('aria-pressed', UI.speed === 2); };
$('book').addEventListener('click', e => { if (e.target.id === 'book') closeBook(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && UI.book) closeBook(); });

/* ----- save triggers ----- */
setInterval(() => { if (!document.hidden) saveNow(); }, 10000);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });
window.addEventListener('pagehide', saveNow);
window.addEventListener('beforeunload', saveNow);

/* ----- main loop ----- */
let lastEventT = -1, last = performance.now(), cardTimer = 0;
function drainEvents() {
  const ev = G.events;
  if (!ev.length) return;
  const fresh = ev.slice();
  if (fresh.length) {
    const coins = fresh.filter(e => e.kind === 'coin');
    const rest = fresh.filter(e => e.kind !== 'coin');
    rest.slice(-2).forEach(e => toast(e.text, e.kind));
    if (coins.length) toast(coins.length === 1 ? coins[0].text : `${coins.length} sales just now.`, 'coin');
  }
  ev.length = 0;
}
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  const t = now / 1000;
  if (!UI.book && !document.hidden) Sim.advance(G, dt * Sim.rate(G) * UI.speed);
  drainEvents();
  syncChars(G, t); syncBakery(G, t, dt); syncLight(G); syncCamera(G, dt);
  cardTimer -= dt;
  if (cardTimer <= 0) { cardTimer = 0.2; hud(G); if (!UI.book) renderCard(false); }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
function start() {
  resize(); focus.set(G.player.x, 0, G.player.z);
  lastEventT = -1;
  hud(G); renderCard(true);
  if (!(G.lifetime.days === 0 && G.t < 6 * 60 + 5)) { G.events.length = 0; toast('Welcome back. Day ' + G.day + ', ' + Sim.clock(G.t) + '.', 'story'); }
  requestAnimationFrame(t => { last = t; frame(t); });
}

if (hot && hot.ready) hot.ready(boot); else boot(hot && hot.data ? hot.data : {});
})();
</script>

</body>
</html>
