<title>Hearthmoor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed 3D village; parchment HUD strip on top, parchment action card at the bottom,
   a leather-bound book for management, a pause menu, and a title screen that opens like a book cover.
   One deliberate look in both light and dark hosts. */
:root {
  color-scheme: light;
  --ink: #2a1f16;
  --ink-soft: #5d4a36;
  --parch: #ead8b2;
  --parch-2: #dcc493;
  --leather: #35251b;
  --leather-2: #4c3626;
  --seal: #8c2e21;
  --moss: #4a6634;
  --gold: #a87d22;
  --gilt: #e2b552;
  --line: rgba(42, 31, 22, .22);
  --f-display: "IM Fell English", "Iowan Old Style", Georgia, serif;
  --f-caps: "IM Fell English SC", "IM Fell English", Georgia, serif;
  --f-body: "Alegreya Sans", "Gill Sans", "Trebuchet MS", system-ui, sans-serif;
}
[hidden] { display: none !important; }
html, body { height: 100%; background: #1d2420; color: var(--ink); overflow: hidden; overscroll-behavior: none; }
body { font-family: var(--f-body); font-size: 15px; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
#world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--seal); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* HUD */
.hud { position: fixed; top: 0; left: 0; right: 0; z-index: 5; pointer-events: none;
  padding-top: calc(env(safe-area-inset-top, 0px) + 8px);
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.strip { pointer-events: auto; display: flex; align-items: center; gap: 8px; background: linear-gradient(#efdfbd, var(--parch));
  border: 1px solid var(--line); border-radius: 6px; padding: 5px 6px; box-shadow: 0 3px 12px rgba(0,0,0,.35); max-width: 720px; margin: 0 auto; }
.icon-btn { border: 0; background: transparent; width: 40px; height: 40px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.icon-btn span, .icon-btn span::before, .icon-btn span::after { display: block; width: 18px; height: 2px; background: var(--ink); border-radius: 1px; position: relative; }
.icon-btn span::before, .icon-btn span::after { content: ""; position: absolute; left: 0; }
.icon-btn span::before { top: -6px; } .icon-btn span::after { top: 6px; }
.clock { font-family: var(--f-display); font-size: 18px; white-space: nowrap; }
.coins { margin-left: auto; font-weight: 700; font-size: 17px; color: var(--gold); white-space: nowrap; }
.coins::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #f0cf6a, #9c7414); margin-right: 5px; vertical-align: -1px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
.book-btn { border: 0; background: var(--leather); color: var(--parch); border-radius: 4px; padding: 8px 12px; font-family: var(--f-display); font-size: 16px; min-height: 40px; }
.subhud { pointer-events: none; display: flex; flex-wrap: wrap; gap: 6px; max-width: 720px; margin: 6px auto 0; }
.chip { background: rgba(32, 26, 20, .74); color: #f1e3c2; border-radius: 999px; padding: 4px 10px; font-size: 13px; white-space: nowrap; }
.chip b { color: #f5cf73; font-weight: 700; }
.chip.on { background: rgba(74, 102, 52, .9); }
.goal { pointer-events: auto; max-width: 720px; margin: 6px auto 0; font-size: 13px; color: #f1e3c2; background: rgba(32,26,20,.74); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.goal em { font-family: var(--f-display); font-style: italic; color: #f5cf73; font-size: 14px; }

.side { position: fixed; z-index: 5; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 240px; display: flex; flex-direction: column; gap: 8px; }
.side button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--parch); box-shadow: 0 2px 8px rgba(0,0,0,.35); font-size: 18px; font-weight: 700; }
.side button[aria-pressed="true"] { background: var(--leather); color: var(--parch); }

.toasts { position: fixed; z-index: 6; left: 0; right: 0; top: 130px; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.toast { max-width: 420px; background: var(--parch); border-left: 4px solid var(--ink-soft); border-radius: 4px; padding: 6px 10px; font-size: 14px; box-shadow: 0 3px 10px rgba(0,0,0,.35); animation: tin .25s ease-out; }
.toast.coin { border-color: var(--gold); } .toast.bad { border-color: var(--seal); } .toast.good { border-color: var(--moss); } .toast.story { border-color: var(--leather); font-family: var(--f-display); font-size: 15px; }
.toast.out { opacity: 0; transform: translateY(-6px); transition: .4s; }
@keyframes tin { from { opacity: 0; transform: translateY(-8px); } }
.night { position: fixed; z-index: 4; left: 50%; top: 50%; transform: translate(-50%, -50%); font-family: var(--f-display); font-style: italic; font-size: 22px; color: #e9d9b0; text-shadow: 0 2px 8px #000; pointer-events: none; }

/* action card */
.panel { position: fixed; z-index: 5; left: 0; right: 0; bottom: 0;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.card { pointer-events: auto; max-width: 720px; margin: 0 auto; background: linear-gradient(var(--parch), #e3cea4); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 -2px 18px rgba(0,0,0,.4); padding: 10px 12px 12px; max-height: 46vh; overflow-y: auto; }
.card h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 22px; line-height: 1.1; text-wrap: balance; }
.card .sub { color: var(--ink-soft); font-size: 14px; margin-top: 2px; }
.card .why { font-size: 14px; margin-top: 6px; padding: 6px 8px; background: rgba(255,255,255,.35); border-radius: 4px; }
.card .why b { font-weight: 700; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--parch); border-radius: 5px; padding: 8px 12px; min-height: 42px; font-weight: 500; font-size: 15px; }
.btn.alt { background: transparent; color: var(--ink); }
.btn.warn { background: var(--seal); border-color: var(--seal); }
.btn:disabled { opacity: .45; cursor: default; }
.btn small { display: block; font-size: 12px; opacity: .8; font-weight: 400; }
.places { display: flex; gap: 6px; margin-top: 8px; overflow-x: auto; scrollbar-width: none; }
.places::-webkit-scrollbar { display: none; }
.place { flex: none; border: 1px dashed var(--ink-soft); background: transparent; border-radius: 999px; padding: 6px 11px; font-size: 13px; color: var(--ink-soft); min-height: 34px; }
.bar { height: 8px; background: rgba(42,31,22,.15); border-radius: 4px; margin-top: 8px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--gold); border-radius: 4px; }
.mood i { background: var(--moss); } .mood.low i { background: var(--seal); }

/* book and pause sheets */
.sheet { position: fixed; inset: 0; z-index: 20; background: rgba(12, 9, 7, .72); display: flex; align-items: stretch; justify-content: center;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) max(8px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 10px) max(8px, env(safe-area-inset-left, 0px)); }
.cover { width: 100%; max-width: 720px; background: var(--leather); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,.6), inset 0 0 0 2px var(--leather-2); min-height: 0; }
.bookhead { display: flex; align-items: flex-end; min-width: 0; }
.bookhead .tabs { flex: 1; min-width: 0; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding: 0 2px; align-items: flex-end; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 0; background: #5a4130; color: #e8d6b0; padding: 8px 9px 10px; border-radius: 6px 6px 0 0; font-family: var(--f-display); font-size: 15px; min-height: 40px; }
.tab[aria-selected="true"] { background: var(--parch); color: var(--ink); }
.close { margin-left: auto; flex: none; border: 0; background: transparent; color: #e8d6b0; font-size: 26px; line-height: 1; padding: 4px 10px; min-height: 40px; min-width: 40px; }
.page { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; background: radial-gradient(ellipse at 50% 0%, #f2e4c6, var(--parch) 60%, var(--parch-2)); border-radius: 0 6px 6px 6px; padding: 16px 18px 24px; user-select: text; -webkit-user-select: text; }
.page.round { border-radius: 6px; }
.page.turn { animation: turn .35s ease-out; transform-origin: left center; }
@keyframes turn { from { opacity: .2; transform: perspective(900px) rotateY(-14deg); } }
.page h3 { font-family: var(--f-display); font-weight: 400; font-size: 26px; margin: 0 0 4px; text-wrap: balance; }
.page h4 { font-family: var(--f-display); font-weight: 400; font-size: 19px; margin: 18px 0 6px; border-bottom: 1px solid var(--line); padding-bottom: 3px; }
.page p { line-height: 1.5; margin: 6px 0; max-width: 62ch; }
.lead { color: var(--ink-soft); font-style: italic; font-family: var(--f-display); font-size: 16px; }
.paused { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
table.acct { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 15px; }
table.acct td { padding: 3px 0; border-bottom: 1px dotted var(--line); }
table.acct td:last-child { text-align: right; padding-left: 10px; white-space: nowrap; }
table.acct tr.tot td { border-bottom: 0; border-top: 1.5px solid var(--ink); font-weight: 700; }
table.acct tr.sh td { color: var(--ink-soft); font-size: 14px; }
.day { margin-top: 14px; padding: 10px 12px; background: rgba(255,255,255,.28); border: 1px solid var(--line); border-radius: 6px; }
.dayhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.dayhead strong { font-family: var(--f-display); font-weight: 400; font-size: 20px; }
.seal { display: inline-flex; align-items: center; justify-content: center; min-width: 58px; height: 30px; padding: 0 9px; border-radius: 15px; color: #f6e8c8; font-weight: 700; font-size: 14px; background: var(--moss); box-shadow: inset 0 0 0 2px rgba(0,0,0,.15); white-space: nowrap; }
.seal.neg { background: var(--seal); }
.notes { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.notes li { padding-left: 14px; position: relative; line-height: 1.45; }
.notes li::before { content: "\2766"; position: absolute; left: -2px; top: 0; color: var(--seal); font-size: 11px; }
.notes .btn { margin-top: 5px; min-height: 36px; padding: 5px 10px; font-size: 14px; }
.shopnote { font-family: var(--f-display); font-size: 16px; margin: 10px 0 2px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
.box { background: rgba(255,255,255,.28); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; min-width: 0; margin-top: 10px; }
.grid2 .box { margin-top: 0; }
.box h5 { margin: 0 0 4px; font-family: var(--f-display); font-weight: 400; font-size: 20px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 14px; font-variant-numeric: tabular-nums; margin: 0; }
.kv dt { color: var(--ink-soft); } .kv dd { margin: 0; text-align: right; }
.kv .later { color: rgba(42,31,22,.42); }
.stepper { display: inline-flex; align-items: center; gap: 6px; }
.stepper button { width: 40px; height: 40px; border-radius: 5px; border: 1px solid var(--ink); background: transparent; font-size: 20px; }
.stepper output { min-width: 56px; text-align: center; font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--seal); height: 32px; }
.goals { list-style: none; padding: 0; margin: 8px 0; display: grid; gap: 8px; }
.goals li { display: flex; gap: 10px; align-items: flex-start; line-height: 1.4; }
.goals .tick { flex: none; width: 22px; height: 22px; border: 1.5px solid var(--ink); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; }
.goals .done .tick { background: var(--moss); border-color: var(--moss); color: #f3e6c8; }
.goals .done span:last-child { color: var(--ink-soft); text-decoration: line-through; text-decoration-color: rgba(42,31,22,.4); }
.goals .now span:last-child { font-weight: 700; }
textarea, input[type=text] { width: 100%; font: 14px/1.3 var(--f-body); background: #f6ecd6; border: 1px solid var(--line); border-radius: 4px; padding: 8px; color: var(--ink); }
textarea { min-height: 90px; font: 12px/1.3 ui-monospace, Menlo, monospace; }
.confirm { margin-top: 8px; padding: 8px 10px; border: 1px solid var(--seal); border-radius: 6px; background: rgba(140,46,33,.08); }
.trades { width: 100%; border-collapse: collapse; font-size: 14px; }
.trades td, .trades th { text-align: left; padding: 5px 4px; border-bottom: 1px dotted var(--line); vertical-align: top; }
.trades th { font-weight: 500; color: var(--ink-soft); font-size: 13px; }
.pill { display: inline-block; border-radius: 999px; padding: 1px 8px; font-size: 12px; background: rgba(42,31,22,.1); white-space: nowrap; }
.pill.yes { background: var(--moss); color: #f3e6c8; }
.seg { display: inline-flex; border: 1px solid var(--ink); border-radius: 6px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 8px 12px; min-height: 40px; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--parch); }
.setting { margin: 14px 0; }
.setting > span { display: block; font-weight: 700; margin-bottom: 6px; }
.setting p { margin: 4px 0 0; color: var(--ink-soft); font-size: 14px; }

/* pause menu */
.menu-list { display: grid; gap: 8px; margin-top: 12px; }
.menu-list .btn { text-align: left; font-family: var(--f-display); font-size: 19px; font-weight: 400; padding: 10px 14px; min-height: 52px; }
.menu-list .btn small { font-family: var(--f-body); }
.back { border: 0; background: transparent; color: var(--ink-soft); padding: 6px 0; min-height: 36px; font-size: 14px; }
.statgroup { margin-top: 14px; }
.statgroup h4 { margin-top: 0; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }

/* title screen */
.title { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; overflow-y: auto;
  background: radial-gradient(ellipse at 50% 40%, rgba(20,14,10,.15), rgba(10,7,5,.78) 75%);
  padding: calc(env(safe-area-inset-top, 0px) + 16px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px)); }
.tome { width: 100%; max-width: 420px; background: var(--leather); border-radius: 6px 12px 12px 6px; padding: 12px 12px 12px 18px; position: relative;
  box-shadow: 0 18px 50px rgba(0,0,0,.7), inset 0 0 0 2px var(--leather-2), inset 8px 0 0 #2a1d15; margin: auto; }
.tome-page { background: radial-gradient(ellipse at 50% 0%, #f4e7cb, var(--parch) 55%, var(--parch-2)); border-radius: 3px 8px 8px 3px; padding: 22px 20px 18px; position: relative; }
.tome-page::before { content: ""; position: absolute; inset: 8px; border: 1px solid rgba(140,46,33,.35); border-radius: 2px 6px 6px 2px; pointer-events: none; }
.crest { display: block; width: 64px; height: 64px; margin: 0 auto 6px; }
.tname { font-family: var(--f-caps); font-size: clamp(40px, 12vw, 54px); line-height: 1; text-align: center; margin: 0; color: var(--ink); letter-spacing: .01em; }
.tsub { text-align: center; font-family: var(--f-display); font-style: italic; color: var(--ink-soft); margin: 6px 0 16px; font-size: 16px; }
.rule { height: 10px; margin: 0 auto 14px; width: 70%; background: radial-gradient(circle, var(--seal) 0 3px, transparent 3.5px) center/14px 10px no-repeat, linear-gradient(var(--line), var(--line)) center/100% 1px no-repeat; }
.tmenu { display: grid; gap: 8px; position: relative; }
.tbtn { border: 1px solid var(--ink); background: transparent; color: var(--ink); border-radius: 4px; padding: 10px 14px; min-height: 50px; text-align: left; font-family: var(--f-display); font-size: 20px; }
.tbtn.primary { background: var(--ink); color: var(--parch); }
.tbtn small { display: block; font-family: var(--f-body); font-size: 13px; opacity: .8; margin-top: 2px; }
.tbtn:disabled { opacity: .4; }
.tfoot { text-align: center; font-family: var(--f-caps); color: var(--ink-soft); font-size: 13px; margin-top: 16px; letter-spacing: .05em; }
.slot { display: flex; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: rgba(255,255,255,.3); }
.slot div { flex: 1; min-width: 0; }
.slot b { font-family: var(--f-display); font-weight: 400; font-size: 18px; display: block; }
.slot span { font-size: 13px; color: var(--ink-soft); }
.slot .btn { min-height: 40px; padding: 6px 10px; }
.spread { display: grid; gap: 14px; position: relative; }
.leaf { min-width: 0; position: relative; }
.warnline { color: var(--seal); font-size: 14px; }
.tome h3 { font-family: var(--f-display); font-weight: 400; font-size: 24px; margin: 0 0 8px; position: relative; }
.tome label { display: block; font-weight: 700; margin: 10px 0 4px; position: relative; }
.tome p { line-height: 1.45; margin: 6px 0; position: relative; }

@media (prefers-reduced-motion: reduce) { .page.turn, .toast { animation: none; } }
/* landscape phones: the title opens like a book, and menus spread into two columns so nothing scrolls */
@media (orientation: landscape) and (max-height: 600px) {
  .title { padding-top: calc(env(safe-area-inset-top, 0px) + 8px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 8px); }
  .tome { max-width: 800px; padding: 8px 8px 8px 12px; }
  .tome-page { padding: 14px 20px; }
  .spread { grid-template-columns: 1fr 1fr; gap: 36px; align-items: center; }
  .spread::after { content: ""; position: absolute; top: -6px; bottom: -6px; left: 50%; width: 1px; background: linear-gradient(transparent, rgba(42,31,22,.35), transparent); }
  .crest { width: 52px; height: 52px; margin-bottom: 4px; }
  .tname { font-size: 46px; }
  .tsub { margin: 4px 0 10px; }
  .tfoot { margin-top: 8px; }
  .tmenu { gap: 6px; }
  .tbtn { min-height: 44px; padding: 7px 12px; font-size: 18px; }
  .tbtn small { font-size: 12px; }
  .slotbtn { min-height: 40px; padding: 5px 12px; }
  .tome h3 { font-size: 22px; margin-bottom: 4px; }
  .tome label { margin: 6px 0 3px; }
  .tome p { margin: 4px 0; font-size: 14px; }
  .tome textarea { min-height: 70px; }
  .slot { padding: 6px 8px; }
  .menu-list { grid-template-columns: 1fr 1fr; }
  .menu-list .btn { min-height: 46px; padding: 7px 12px; font-size: 17px; }
  .page h3 { font-size: 22px; } .page { padding: 12px 16px 18px; }
}
@media (orientation: landscape) and (max-height: 340px) { #pausePage .paused { display: none; } #pausePage .lead { margin: 2px 0; } .menu-list { margin-top: 8px; } .menu-list .btn { min-height: 42px; padding: 5px 12px; } }
@media (min-width: 700px) { .card h2 { font-size: 24px; } }
@media (orientation: landscape) and (max-height: 520px) {
  .card { max-width: 440px; margin-left: 0; padding: 8px 10px 10px; max-height: 62vh; }
  .card h2 { font-size: 19px; } .card .sub { font-size: 13px; }
  .btn { min-height: 38px; padding: 6px 10px; font-size: 14px; }
  .goal { display: none; }
}
</style>

<canvas id="world" aria-label="The village of Hearthmoor"></canvas>
<header class="hud" id="hud" hidden>
  <div class="strip">
    <button class="icon-btn" id="menuBtn" type="button" aria-label="Pause and open the menu"><span></span></button>
    <div class="clock num" id="clock">Day 1 · 06:00</div>
    <div class="coins num" id="coins">5c</div>
    <button class="book-btn" id="bookBtn" type="button">Ledger</button>
  </div>
  <div class="subhud" id="subhud"></div>
  <div class="goal" id="goal"></div>
</header>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="night" id="night" hidden>Night passes&hellip;</div>
<div class="side" id="side" hidden>
  <button type="button" id="zin" aria-label="Zoom in">+</button>
  <button type="button" id="zout" aria-label="Zoom out">&minus;</button>
  <button type="button" id="center" aria-label="Center on you">&#9678;</button>
  <button type="button" id="fast" aria-label="Double speed" aria-pressed="false">&#187;</button>
</div>
<section class="panel" id="panel" hidden><div class="card" id="card"><div id="cardInfo"></div><div id="cardActs"></div></div></section>
<div class="sheet" id="book" hidden>
  <div class="cover">
    <div class="bookhead"><div class="tabs" role="tablist" id="tabs"></div><button type="button" class="close" data-c='["ui","close"]' aria-label="Close the book">&times;</button></div>

function shiftText(e) { return String(e.shift[0]).padStart(2, '0') + ':00–' + String(e.shift[1]).padStart(2, '0') + ':00'; }

function hallCard(s, walking) {
  const v = s.village, R = Sim.REALM;

function renderCard(force) {

document.addEventListener('click', e => {

function hud(s) {
  $('clock').textContent = `Day ${s.day} · ${Sim.clock(s.t)}`;
  $('coins').textContent = s.coins + 'c';
  const inv = s.player.inv, chips = [];
  const carry = Sim.GOODS.filter(g => inv[g]).map(g => `<b>${inv[g]}</b> ${g}`);
  chips.push(carry.length ? 'Carrying ' + carry.join(' · ') : 'Hands empty');
  if (s.job) { const e = Sim.empById(s.job.emp), on = Sim.inShift(s); chips.push(`<span class="chip num ${on ? 'on' : ''}">${on ? 'On shift' : 'Job'}: ${esc(e.name)} ${shiftText(e)}</span>`); }
  if (s.village.step > 0) chips.push(`Standing <b>${s.village.standing}</b>${s.village.council ? ' · Councillor' : ''}`);
  s.shops.forEach(x => chips.push(`${TR[x.trade].name}: <b>${x.goods}</b> ${TR[x.trade].product}${x.worker ? ' · ' + esc(x.worker.name) : ''}`));
  const html = chips.map(c => c.startsWith('<span') ? c : `<span class="chip num">${c}</span>`).join('');
  if ($('subhud').innerHTML !== html) $('subhud').innerHTML = html;
  const g = s.village.step >= Sim.STEPS.length ? null : (s.village.step > 0 ? Sim.GOALS.find(x => x.ch === 2 && !x.done(s)) : null) || Sim.GOALS.find(x => !x.done(s));
  const gt = g ? `<em>Next:</em> ${esc(g.text)}` : '<em>Chapter Two complete.</em> The lord knows your name. More in the next chapter.';
  if ($('goal').innerHTML !== gt) $('goal').innerHTML = gt;
  const h = Sim.hourOf(s);
  $('night').hidden = !(h >= 21 || h < 5.5) || !!UI.overlay;
  $('toasts').style.top = Math.round($('hud').getBoundingClientRect().bottom + 6) + 'px';
  const side = $('side'), cr = $('card').getBoundingClientRect();
  UI.sideCard = cr.right <= window.innerWidth - 64 ? cr.right / window.innerWidth : 0;
  side.style.bottom = UI.sideCard ? 'calc(env(safe-area-inset-bottom, 0px) + 12px)' : Math.round(window.innerHeight - cr.top + 10) + 'px';
  const room = UI.sideCard ? window.innerHeight : cr.top - $('hud').getBoundingClientRect().bottom - 20;
  $('zin').hidden = $('zout').hidden = room < 4 * 52;
  $('center').hidden = room < 2 * 52;
}

const money = n => (n < 0 ? '−' : '') + Math.abs(n) + 'c';
function notesHTML(notes) { return `<ul class="notes">${notes.map(n => `<li>${esc(n.text)}${n.fix ? `<br>${B_(esc(n.fix.label), n.fix.cmd, 'alt')}` : ''}</li>`).join('')}</ul>`; }
function lostLine(e) {

function pageLedger(s) {

  });
  const so = shopRows.reduce((a, r) => a + r[1], 0) + st.jobPay + st.rawSales - st.marketBuys;

    ${group('Village', [['Standing', s.village.standing + '/100'], ['Position', s.village.council ? 'Councillor since day ' + r.councilSince : s.village.step > 0 ? 'Known to the elder' : 'Newcomer'], ['Elder\u2019s tasks done', r.elderTasks], ['Grain given', r.grainDonated], ['Coin given to the village', r.chestGiven + 'c'], ['Projects funded', r.projectsFunded], ['Disputes settled', r.disputesSettled], ['Merchant orders filled', r.contractsDone], ['Taxes paid to the lord', r.taxesPaid + 'c']])}
    ${group('Life', [['Days in Hearthmoor', r.days], ['Distance walked', (r.walked / 1000).toFixed(2) + ' km'], ['Grain gathered', r.gathered.grain], ['Wood chopped', r.gathered.wood], ['Ore dug', r.gathered.ore]])}
  </div><p class="lead">Lordship, battles and your dynasty will add their own records in later chapters.</p>`;
}
function saveHTML() {
  const ago = lastSave ? Math.round((Date.now() - lastSave) / 1000) : null;
  return `<h3>Save and export</h3><p class="lead">Slot ${slot}. The game saves every 10 seconds, when you leave the page, and when you close a menu.</p>
  <p>${saveOk ? (ago != null ? `Last saved ${ago} seconds ago. The save before that is kept as a backup.` : 'Not saved yet.') : 'This browser is not letting the game save. Export a copy below to keep your progress.'}</p>
  <div class="acts">${B_('Save now', ['ui', 'save'])}</div>
  <h4>Keep a copy</h4><p>Saves live in this browser only. Clearing site data erases them, so export a copy now and then. Paste it into Load game on the title screen to bring it back, even on another device.</p>
  <div class="acts">${B_('Show save code', ['ui', 'export'], 'alt')}${UI.exportText ? B_('Copy code', ['ui', 'copy'], 'alt') : ''}</div>
  ${UI.exportText ? `<textarea id="exportBox" readonly aria-label="Save code">${esc(UI.exportText)}</textarea>` : ''}`;
}
function seg(id, value, opts) { return `<div class="seg" role="group">${opts.map(([v, n]) => `<button type="button" aria-pressed="${value === v}" data-c='${esc(JSON.stringify(['ui', 'set', [id, v]]))}'>${n}</button>`).join('')}</div>`; }
function settingsHTML() {
  const st = meta.settings;
  return `<h3>Settings</h3>
  <div class="setting"><span>Day length</span>${seg('pace', st.pace, [['brisk', 'Brisk'], ['normal', 'Normal'], ['relaxed', 'Relaxed']])}<p>Brisk days last about 3 minutes, normal about 4, relaxed about 6.</p></div>
  <div class="setting"><span>Notes along the top</span>${seg('toasts', st.toasts, [['all', 'Everything'], ['important', 'Important only']])}<p>Important only hides individual sales and small updates.</p></div>
  <div class="setting"><span>Motion</span>${seg('motion', st.motion, [['full', 'Full'], ['reduced', 'Reduced']])}<p>Reduced stops the title camera, page turns and bobbing icons.</p></div>`;
}

/* ----- title screen ----- */
const CREST = `<svg class="crest" viewBox="0 0 512 512" aria-hidden="true"><path d="M136 176 H376 V292 C376 370 318 418 256 444 C194 418 136 370 136 292 Z" fill="#8c2e21" stroke="#a87d22" stroke-width="16" stroke-linejoin="round"/><path d="M196 380 V268 H212 V250 H230 V268 H244 V250 H268 V268 H282 V250 H300 V268 H316 V380 Z" fill="#e2b552"/><path d="M244 380 V340 A12 12 0 0 1 268 340 V380 Z" fill="#8c2e21"/><path d="M150 158 L136 72 L196 116 L256 52 L316 116 L376 72 L362 158 Z" fill="#e2b552" stroke="#7a4f12" stroke-width="8" stroke-linejoin="round"/><rect x="146" y="150" width="220" height="24" rx="6" fill="#e2b552" stroke="#7a4f12" stroke-width="8"/></svg>`;
function slotLine(info) { if (!info) return 'Empty'; return `${esc(info.name)} · Day ${info.day} · ${info.coins}c · ${info.shops} ${info.shops === 1 ? 'shop' : 'shops'}${info.when ? ' · ' + ago(info.when) : ''}`; }
function ago(t) { const m = Math.round((Date.now() - t) / 60000); if (m < 1) return 'just now'; if (m < 60) return m + ' min ago'; const h = Math.round(m / 60); if (h < 24) return h + ' h ago'; return Math.round(h / 24) + ' days ago'; }
function renderTitle() {
  // two leaves: stacked in portrait, an open book in landscape
  const pg = $('titlePage');
  const back = `<button type="button" class="back" data-c='["ui","tview","main"]'>&larr; Back</button>`;
  let left, right;
  if (UI.titleView === 'main') {
    const last = meta.lastSlot && slotInfo(meta.lastSlot);
    left = `${CREST}<h1 class="tname">Hearthmoor</h1><p class="tsub">A chronicle of trade and crowns</p><div class="rule"></div><div class="tfoot">Chapters One and Two<br>A Place in the Village</div>`;
    right = `<div class="tmenu">
      ${last ? `<button type="button" class="tbtn primary" data-c='["ui","continue"]'>Continue<small>${slotLine(last)}</small></button>` : ''}
      <button type="button" class="tbtn ${last ? '' : 'primary'}" data-c='["ui","tview","new"]'>New game<small>Arrive with 5 coins and nothing else</small></button>
      <button type="button" class="tbtn" data-c='["ui","tview","load"]'>Load game<small>Three save slots, or paste a save code</small></button>
      <button type="button" class="tbtn" data-c='["ui","tview","settings"]'>Settings</button></div>`;
  } else if (UI.titleView === 'new') {
    const infos = [1, 2, 3].map(n => slotInfo(n));
    if (UI.newSlot == null) UI.newSlot = (infos.findIndex(x => !x) + 1) || 1;
    left = `${back}<h3>A new life</h3><p>You arrive in Hearthmoor with 5 coins. Find work, learn a trade, and build from there.</p>
      <label for="newName">Your name</label><input type="text" id="newName" maxlength="18" value="${esc(UI.newName)}" autocomplete="off">`;
    right = `<label>Save in</label><div class="tmenu">${infos.map((info, i) => `<button type="button" class="tbtn slotbtn ${UI.newSlot === i + 1 ? 'primary' : ''}" data-c='${JSON.stringify(['ui', 'newSlot', i + 1])}'>Slot ${i + 1}<small>${slotLine(info)}</small></button>`).join('')}</div>
      ${infos[UI.newSlot - 1] ? `<p class="warnline">Slot ${UI.newSlot} holds a game. Starting here replaces it.</p>` : ''}
      <div class="tmenu" style="margin-top:8px"><button type="button" class="tbtn primary" data-c='["ui","begin"]'>Begin</button></div>`;
  } else if (UI.titleView === 'load') {
    left = `${back}<h3>Load game</h3><label for="importBox">Or paste a save code</label><textarea id="importBox" placeholder="Paste a save code here"></textarea>
      <div class="tmenu" style="margin-top:6px"><button type="button" class="tbtn" data-c='["ui","import"]'>Load this code<small>into slot ${UI.newSlot || 1}${slotInfo(UI.newSlot || 1) ? ', replacing it' : ''}</small></button></div>${UI.importMsg ? `<p>${esc(UI.importMsg)}</p>` : ''}`;
    right = `<div class="tmenu">${[1, 2, 3].map(n => { const info = slotInfo(n); return `<div class="slot"><div><b>Slot ${n}</b><span>${slotLine(info)}</span></div>${info ? B_('Load', ['ui', 'load', n]) + (UI.confirm === 'del' + n ? B_('Erase', ['ui', 'erase', n], 'warn') : B_('&times;', ['ui', 'confirm', 'del' + n], 'alt')) : ''}</div>`; }).join('')}</div>
      ${UI.confirm && UI.confirm.startsWith('del') ? `<p class="warnline">Tap Erase to delete slot ${UI.confirm.slice(3)} for good.</p>` : ''}`;
  } else {
    const st = meta.settings;
    left = `${back}<h3>Settings</h3><div class="setting"><span>Day length</span>${seg('pace', st.pace, [['brisk', 'Brisk'], ['normal', 'Normal'], ['relaxed', 'Relaxed']])}<p>About 3, 4 or 6 minutes a day.</p></div>`;
    right = `<div class="setting"><span>Notes along the top</span>${seg('toasts', st.toasts, [['all', 'Everything'], ['important', 'Important only']])}</div>
      <div class="setting"><span>Motion</span>${seg('motion', st.motion, [['full', 'Full'], ['reduced', 'Reduced']])}<p>Reduced stops the title camera, page turns and bobbing icons.</p></div>`;
  }
  pg.innerHTML = `<div class="spread"><div class="leaf">${left}</div><div class="leaf">${right}</div></div>`;
}
function enterGame(game, n) {
  G = game; slot = n; UI.mode = 'play'; UI.overlay = null; UI.sel = null; UI.loc = null; UI.confirm = null; UI.exportText = '';
  meta.lastSlot = n; saveMeta();
  resetMeshes(); focus.set(G.player.x, 0, G.player.z); panHold = 0;
  ['title', 'book', 'pause'].forEach(id => $(id).hidden = true);
  ['hud', 'panel', 'side'].forEach(id => $(id).hidden = false);
  if (!(G.rec.days === 0 && G.t < 6 * 60 + 5)) { G.events.length = 0; toast('Welcome back, ' + G.name + '. Day ' + G.day + ', ' + Sim.clock(G.t) + '.', 'story'); }
  saveNow(); hud(G); renderCard(true);
}
function toTitle() {
  saveNow();
  UI.mode = 'title'; UI.titleView = 'main'; UI.overlay = null; UI.confirm = null;
  ['hud', 'panel', 'side', 'book', 'pause', 'night'].forEach(id => $(id).hidden = true);
  $('toasts').innerHTML = '';
  $('title').hidden = false; renderTitle();
}
function resetMeshes() { for (const [, g] of agentMeshes) dropChar(g); agentMeshes.clear(); for (const [, g] of workerMeshes) dropChar(g); workerMeshes.clear(); }

function uiCmd(k, v) {
  if (k === 'deselect') { UI.sel = null; renderCard(true); return; }
  if (k === 'tab') { UI.tab = v; UI.confirm = null; renderBook(true); return; }
  if (k === 'close') { closeOverlay(); return; }
  if (k === 'book') { openBook(); return; }
  if (k === 'pause') { openPause(); return; }
  if (k === 'pview') { UI.pauseView = v; UI.exportText = ''; renderPause(true); return; }
  if (k === 'tview') { UI.titleView = v; UI.confirm = null; UI.importMsg = ''; renderTitle(); return; }
  if (k === 'confirm') { UI.confirm = v; if (UI.mode === 'title') renderTitle(); else if (UI.overlay === 'book') renderBook(); else renderCard(true); return; }
  if (k === 'wage') { UI.hireWage[v[0]] = clamp(v[1], 1, 40); renderBook(); return; }
  if (k === 'set') { meta.settings[v[0]] = v[1]; saveMeta(); if (UI.mode === 'title') renderTitle(); else renderPause(); return; }
  if (k === 'save') { saveNow(); toast(saveOk ? 'Saved to slot ' + slot + '.' : 'Could not save in this browser. Export a copy instead.', saveOk ? 'good' : 'bad', true); renderPause(); return; }
  if (k === 'export') { UI.exportText = encodeSave(G); renderPause(); return; }
  if (k === 'copy') {
    const box = $('exportBox'), fallback = () => { if (box) { box.focus(); box.select(); } toast('Code selected. Copy it with your keyboard or the share menu.', 'info', true); };
    try { navigator.clipboard.writeText(UI.exportText).then(() => toast('Save code copied.', 'good', true), fallback); } catch (e) { fallback(); }
    return;
  }
  if (k === 'quitTitle') { toTitle(); return; }
  if (k === 'continue') { const n = meta.lastSlot, g = n && readSlot(n); if (g) enterGame(g, n); else { UI.titleView = 'load'; renderTitle(); } return; }
  if (k === 'newSlot') { UI.newName = ($('newName') || {}).value || UI.newName; UI.newSlot = v; renderTitle(); return; }
  if (k === 'begin') {
    const name = (($('newName') || {}).value || '').trim().slice(0, 18) || 'Wren';
    UI.newName = name;
    enterGame(Sim.newGame((Date.now() % 2147483647) | 0, name), UI.newSlot || 1); return;
  }
  if (k === 'load') { const g = readSlot(v); if (g) enterGame(g, v); else { UI.importMsg = 'That slot could not be read.'; renderTitle(); } return; }
  if (k === 'erase') { store.del(KEY(v)); store.del(BAK(v)); store.del(KEY(v) + '.when'); if (meta.lastSlot === v) { meta.lastSlot = null; saveMeta(); } UI.confirm = null; renderTitle(); return; }
  if (k === 'import') {
    const t = ($('importBox') || {}).value || '';
    try { const g = decodeSave(t); enterGame(g, UI.newSlot || 1); }
    catch (e) { UI.importMsg = 'That code did not load: ' + e.message + '. Check that you pasted all of it.'; renderTitle(); }
  }
}
document.addEventListener('input', e => {
  const id = e.target.id || '';
  if (id.startsWith('price-')) {
    const shop = Sim.shopById(G, +e.target.dataset.shop); if (!shop) return;
    Sim.cmd(G, 'setPrice', shop.id, +e.target.value);
    $('pv-' + shop.id).textContent = shop.price + 'c'; $('pw-' + shop.id).textContent = willText(shop);
  }
  if (id === 'newName') UI.newName = e.target.value;
});
document.addEventListener('change', e => { const id = e.target.id || ''; if (id.startsWith('pol-')) act(['policy', +e.target.dataset.shop, 'supplyRuns', e.target.checked]); });
$('bookBtn').onclick = () => openBook();
$('menuBtn').onclick = () => openPause();
$('goal').onclick = () => openBook('goals');
$('zin').onclick = () => zoom = clamp(zoom * 0.85, 0.55, 1.8);
$('zout').onclick = () => zoom = clamp(zoom * 1.18, 0.55, 1.8);
$('center').onclick = () => { panHold = 0; };
$('fast').onclick = () => { UI.speed = UI.speed === 1 ? 2 : 1; $('fast').setAttribute('aria-pressed', UI.speed === 2); };
['book', 'pause'].forEach(id => $(id).addEventListener('click', e => { if (e.target.id === id) closeOverlay(); }));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && UI.mode === 'play') { if (UI.overlay) closeOverlay(); else openPause(); } });

setInterval(() => { if (!document.hidden) saveNow(); }, 10000);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });
window.addEventListener('pagehide', saveNow);
window.addEventListener('beforeunload', saveNow);

/* ----- main loop ----- */
function drainEvents() {
  if (!G || !G.events.length) return;
  const fresh = G.events.slice(); G.events.length = 0;
  const coins = fresh.filter(e => e.kind === 'coin'), rest = fresh.filter(e => e.kind !== 'coin');
  rest.slice(-2).forEach(e => toast(e.text, e.kind));
  if (coins.length) toast(coins.length === 1 ? coins[0].text : `${coins.length} sales just now.`, 'coin');
}
let last = performance.now(), uiTimer = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  const t = now / 1000;
  if (UI.mode === 'play' && !UI.overlay && !document.hidden) { Sim.advance(G, dt * Sim.rate(G) * UI.speed * PACE[meta.settings.pace]); drainEvents(); }
  syncChars(G, t); syncShops(G, t, dt); syncVillage(G);
  syncLight(UI.mode === 'title' ? 18.4 : Sim.hourOf(G));
  syncCamera(G, dt, t);
  uiTimer -= dt;
  if (uiTimer <= 0 && UI.mode === 'play') { uiTimer = 0.2; hud(G); if (!UI.overlay) renderCard(false); }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
function boot(data) {
  // the title screen shows your latest village behind it, or a fresh one
  const fromHot = data && data.game ? (() => { try { return Sim.deserialize(data.game); } catch (e) { return null; } })() : null;
  G = fromHot || (meta.lastSlot && readSlot(meta.lastSlot)) || Sim.newGame(4242);
  G.events.length = 0;
  if (hot && hot.snapshot) hot.snapshot(() => ({ game: UI.mode === 'play' ? Sim.serialize(G) : null, slot }));
  resize();
  if (fromHot && data.slot) enterGame(G, data.slot);
  else renderTitle();
  requestAnimationFrame(t => { last = t; frame(t); });
}
const hot = window.claude && window.claude.hot;
window.__hm = { get G() { return G; }, act, adv: m => Sim.advance(G, m), UI, uiCmd, openBook, openPause, saveNow };
if (hot && hot.ready) hot.ready(boot); else boot(hot && hot.data ? hot.data : {});
})();
</script>
