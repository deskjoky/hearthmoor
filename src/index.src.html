<title>Hearthmoor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed 3D village; parchment HUD strip on top, parchment action card at the bottom,
   and a leather-bound book that opens over everything for ledger and management. Single deliberate look. */
:root {
  color-scheme: light;
  --ink: #2a1f16;
  --ink-soft: #5d4a36;
  --parch: #ead8b2;
  --parch-2: #dcc493;
  --leather: #35251b;
  --seal: #8c2e21;
  --moss: #4a6634;
  --gold: #a87d22;
  --line: rgba(42, 31, 22, .22);
  --f-display: "IM Fell English", "Iowan Old Style", Georgia, serif;
  --f-body: "Alegreya Sans", "Gill Sans", "Trebuchet MS", system-ui, sans-serif;
}
[hidden] { display: none !important; }
html, body { height: 100%; background: #1d2420; color: var(--ink); overflow: hidden; overscroll-behavior: none; }
body { font-family: var(--f-body); font-size: 15px; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
#world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--seal); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* HUD */
.hud { position: fixed; top: 0; left: 0; right: 0; z-index: 5; pointer-events: none;
  padding-top: calc(env(safe-area-inset-top, 0px) + 8px);
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.strip { pointer-events: auto; display: flex; align-items: center; gap: 10px; background: linear-gradient(#efdfbd, var(--parch));
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px 6px 12px; box-shadow: 0 3px 12px rgba(0,0,0,.35); max-width: 720px; margin: 0 auto; }
.clock { font-family: var(--f-display); font-size: 18px; white-space: nowrap; }
.clock small { font-family: var(--f-body); font-size: 12px; color: var(--ink-soft); margin-left: 4px; }
.coins { margin-left: auto; font-weight: 700; font-size: 17px; color: var(--gold); white-space: nowrap; }
.coins::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #f0cf6a, #9c7414); margin-right: 5px; vertical-align: -1px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
.book-btn { border: 0; background: var(--leather); color: var(--parch); border-radius: 4px; padding: 8px 12px; font-family: var(--f-display); font-size: 16px; min-height: 40px; }
.subhud { pointer-events: none; display: flex; flex-wrap: wrap; gap: 6px; max-width: 720px; margin: 6px auto 0; }
.chip { background: rgba(32, 26, 20, .72); color: #f1e3c2; border-radius: 999px; padding: 4px 10px; font-size: 13px; white-space: nowrap; }
.chip b { color: #f5cf73; font-weight: 700; }
.goal { pointer-events: auto; max-width: 720px; margin: 6px auto 0; font-size: 13px; color: #f1e3c2; background: rgba(32,26,20,.72); border-radius: 6px; padding: 5px 10px; }
.goal em { font-family: var(--f-display); font-style: italic; color: #f5cf73; font-size: 14px; }

/* side controls */
.side { position: fixed; z-index: 5; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 240px; display: flex; flex-direction: column; gap: 8px; }
.side button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--parch); box-shadow: 0 2px 8px rgba(0,0,0,.35); font-size: 18px; font-weight: 700; }
.side button[aria-pressed="true"] { background: var(--leather); color: var(--parch); }

/* toasts */
.toasts { position: fixed; z-index: 6; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 112px); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.toast { max-width: 420px; background: var(--parch); border-left: 4px solid var(--ink-soft); border-radius: 4px; padding: 6px 10px; font-size: 14px; box-shadow: 0 3px 10px rgba(0,0,0,.35); animation: tin .25s ease-out; }
.toast.coin { border-color: var(--gold); } .toast.bad { border-color: var(--seal); } .toast.good { border-color: var(--moss); } .toast.story { border-color: var(--leather); font-family: var(--f-display); font-size: 15px; }
.toast.out { opacity: 0; transform: translateY(-6px); transition: .4s; }
@keyframes tin { from { opacity: 0; transform: translateY(-8px); } }
.night { position: fixed; z-index: 4; left: 50%; top: 50%; transform: translate(-50%, -50%); font-family: var(--f-display); font-style: italic; font-size: 22px; color: #e9d9b0; text-shadow: 0 2px 8px #000; pointer-events: none; }

/* action card */
.panel { position: fixed; z-index: 5; left: 0; right: 0; bottom: 0;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.card { pointer-events: auto; max-width: 720px; margin: 0 auto; background: linear-gradient(var(--parch), #e3cea4); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 -2px 18px rgba(0,0,0,.4); padding: 10px 12px 12px; }
.card h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 22px; line-height: 1.1; text-wrap: balance; }
.card .sub { color: var(--ink-soft); font-size: 14px; margin-top: 2px; }
.card .why { font-size: 14px; margin-top: 6px; padding: 6px 8px; background: rgba(255,255,255,.35); border-radius: 4px; }
.card .why b { font-weight: 700; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--parch); border-radius: 5px; padding: 8px 12px; min-height: 42px; font-weight: 500; font-size: 15px; }
.btn.alt { background: transparent; color: var(--ink); }
.btn.warn { background: var(--seal); border-color: var(--seal); }
.btn:disabled { opacity: .45; cursor: default; }
.places { display: flex; gap: 6px; margin-top: 8px; overflow-x: auto; scrollbar-width: none; }
.places::-webkit-scrollbar { display: none; }
.place { flex: none; border: 1px dashed var(--ink-soft); background: transparent; border-radius: 999px; padding: 6px 11px; font-size: 13px; color: var(--ink-soft); min-height: 34px; }
.bar { height: 8px; background: rgba(42,31,22,.15); border-radius: 4px; margin-top: 8px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--gold); border-radius: 4px; }
.mood i { background: var(--moss); } .mood.low i { background: var(--seal); }

/* book */
.book { position: fixed; inset: 0; z-index: 20; background: rgba(12, 9, 7, .72); display: flex; align-items: stretch; justify-content: center;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) max(8px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 10px) max(8px, env(safe-area-inset-left, 0px)); }
.cover { width: 100%; max-width: 720px; background: var(--leather); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,.6), inset 0 0 0 2px #4c3626; min-height: 0; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding: 0 2px; }
.tab { flex: none; border: 0; background: #5a4130; color: #e8d6b0; padding: 8px 10px 10px; border-radius: 6px 6px 0 0; font-family: var(--f-display); font-size: 15px; min-height: 40px; }
.tab[aria-selected="true"] { background: var(--parch); color: var(--ink); }
.close { margin-left: auto; flex: none; border: 0; background: transparent; color: #e8d6b0; font-size: 26px; line-height: 1; padding: 4px 10px; min-height: 40px; min-width: 40px; }
.page { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; background: radial-gradient(ellipse at 50% 0%, #f2e4c6, var(--parch) 60%, var(--parch-2)); border-radius: 0 6px 6px 6px; padding: 16px 18px 24px; user-select: text; -webkit-user-select: text; }
.page.turn { animation: turn .35s ease-out; transform-origin: left center; }
@keyframes turn { from { opacity: .2; transform: perspective(900px) rotateY(-14deg); } }
.page h3 { font-family: var(--f-display); font-weight: 400; font-size: 26px; margin: 0 0 4px; text-wrap: balance; }
.page h4 { font-family: var(--f-display); font-weight: 400; font-size: 19px; margin: 18px 0 6px; border-bottom: 1px solid var(--line); padding-bottom: 3px; }
.page p { line-height: 1.5; margin: 6px 0; max-width: 62ch; }
.lead { color: var(--ink-soft); font-style: italic; font-family: var(--f-display); font-size: 16px; }
.paused { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
table.acct { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 15px; }
table.acct td { padding: 3px 0; border-bottom: 1px dotted var(--line); }
table.acct td:last-child { text-align: right; }
table.acct tr.tot td { border-bottom: 0; border-top: 1.5px solid var(--ink); font-weight: 700; }
.day { margin-top: 14px; padding: 10px 12px; background: rgba(255,255,255,.28); border: 1px solid var(--line); border-radius: 6px; }
.dayhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.dayhead strong { font-family: var(--f-display); font-weight: 400; font-size: 20px; }
.seal { display: inline-flex; align-items: center; justify-content: center; min-width: 58px; height: 30px; padding: 0 9px; border-radius: 15px; color: #f6e8c8; font-weight: 700; font-size: 14px; background: var(--moss); box-shadow: inset 0 0 0 2px rgba(0,0,0,.15); }
.seal.neg { background: var(--seal); }
.notes { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.notes li { padding-left: 14px; position: relative; line-height: 1.45; }
.notes li::before { content: "\2766"; position: absolute; left: -2px; top: 0; color: var(--seal); font-size: 11px; }
.notes .btn { margin-top: 5px; min-height: 36px; padding: 5px 10px; font-size: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.box { background: rgba(255,255,255,.28); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; min-width: 0; }
.box h5 { margin: 0 0 4px; font-family: var(--f-display); font-weight: 400; font-size: 20px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 14px; font-variant-numeric: tabular-nums; }
.kv dt { color: var(--ink-soft); } .kv dd { margin: 0; text-align: right; }
.stepper { display: inline-flex; align-items: center; gap: 6px; }
.stepper button { width: 40px; height: 40px; border-radius: 5px; border: 1px solid var(--ink); background: transparent; font-size: 20px; }
.stepper output { min-width: 56px; text-align: center; font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--seal); height: 32px; }
.goals { list-style: none; padding: 0; margin: 8px 0; display: grid; gap: 8px; }
.goals li { display: flex; gap: 10px; align-items: flex-start; line-height: 1.4; }
.goals .tick { flex: none; width: 22px; height: 22px; border: 1.5px solid var(--ink); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; }
.goals .done .tick { background: var(--moss); border-color: var(--moss); color: #f3e6c8; }
.goals .done span:last-child { color: var(--ink-soft); text-decoration: line-through; text-decoration-color: rgba(42,31,22,.4); }
.goals .now span:last-child { font-weight: 700; }
textarea { width: 100%; min-height: 90px; font: 12px/1.3 ui-monospace, Menlo, monospace; background: #f6ecd6; border: 1px solid var(--line); border-radius: 4px; padding: 8px; color: var(--ink); }
.confirm { margin-top: 8px; padding: 8px 10px; border: 1px solid var(--seal); border-radius: 6px; background: rgba(140,46,33,.08); }
@media (prefers-reduced-motion: reduce) { .page.turn, .toast { animation: none; } }
@media (min-width: 700px) { .card h2 { font-size: 24px; } }
@media (orientation: landscape) and (max-height: 520px) {
  .card { max-width: 440px; margin-left: 0; padding: 8px 10px 10px; }
  .card h2 { font-size: 19px; } .card .sub { font-size: 13px; }
  .btn { min-height: 38px; padding: 6px 10px; font-size: 14px; }
  .goal { display: none; }
}
</style>

<canvas id="world" aria-label="The village of Hearthmoor"></canvas>
<header class="hud" id="hud">
  <div class="strip">
    <div class="clock num" id="clock">Day 1 · 06:00</div>
    <div class="coins num" id="coins">10c</div>
    <button class="book-btn" id="bookBtn" type="button">Ledger</button>
  </div>
  <div class="subhud" id="subhud"></div>
  <div class="goal" id="goal"></div>
</header>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="night" id="night" hidden>Night passes&hellip;</div>
<div class="side">
  <button type="button" id="zin" aria-label="Zoom in">+</button>
  <button type="button" id="zout" aria-label="Zoom out">&minus;</button>
  <button type="button" id="center" aria-label="Center on you">&#9678;</button>
  <button type="button" id="fast" aria-label="Double speed" aria-pressed="false">&#187;</button>
</div>
<section class="panel"><div class="card" id="card"><div id="cardInfo"></div><div id="cardActs"></div></div></section>
<div class="book" id="book" hidden>
  <div class="cover">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="page" id="page"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>/*SIM*/</script>
<script>
(function () {
'use strict';
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ================= saving ================= */
const KEY = 'hearthmoor.save', BAK = 'hearthmoor.save.bak';
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
};
let lastSave = 0, saveOk = true;
function saveNow() {
  if (!G) return;
  const str = Sim.serialize(G);
  const prev = store.get(KEY);
  if (prev && prev !== str) store.set(BAK, prev);
  saveOk = store.set(KEY, str);
  lastSave = Date.now();
}
function loadGame() {
  for (const k of [KEY, BAK]) {
    const str = store.get(k);
    if (!str) continue;
    try { return Sim.deserialize(str); } catch (e) { /* try backup */ }
  }
  return null;
}
const encodeSave = s => btoa(unescape(encodeURIComponent(Sim.serialize(s))));
const decodeSave = t => Sim.deserialize(decodeURIComponent(escape(atob(t.trim()))));

let G = null;
const hot = window.claude && window.claude.hot;
function boot(data) {
  G = (data && data.game) ? Sim.deserialize(data.game) : (loadGame() || Sim.newGame((Date.now() % 2147483647) | 0));
  if (hot && hot.snapshot) hot.snapshot(() => ({ game: Sim.serialize(G) }));
  start();
}

/* ================= three.js world ================= */
const canvas = $('world');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: window.devicePixelRatio < 2, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x9fb1ad, 26, 70);
const camera = new THREE.PerspectiveCamera(38, 1, 0.5, 200);
const hemi = new THREE.HemisphereLight(0xcfe0e6, 0x3d3424, 0.75);
const sun = new THREE.DirectionalLight(0xffe2b0, 0.9);
sun.position.set(-20, 30, 12);
scene.add(hemi, sun);

const mats = {};
const mat = c => mats[c] || (mats[c] = new THREE.MeshLambertMaterial({ color: c }));
function flat(g) { g = g.index ? g.toNonIndexed() : g; g.computeVertexNormals(); return g; }
function mesh(geo, color, x, y, z, parent) { const m = new THREE.Mesh(geo, typeof color === 'object' ? color : mat(color)); m.position.set(x || 0, y || 0, z || 0); (parent || scene).add(m); return m; }
function mergeColored(parts) {
  let total = 0;
  const gs = parts.map(p => { const g = flat(p.geo.clone()); g.applyMatrix4(p.m || new THREE.Matrix4()); g.computeVertexNormals(); total += g.attributes.position.count; return [g, new THREE.Color(p.color)]; });
  const pos = new Float32Array(total * 3), nor = new Float32Array(total * 3), col = new Float32Array(total * 3);
  let o = 0;
  for (const [g, c] of gs) {
    const n = g.attributes.position.count;
    pos.set(g.attributes.position.array, o * 3); nor.set(g.attributes.normal.array, o * 3);
    for (let i = 0; i < n; i++) { col[(o + i) * 3] = c.r; col[(o + i) * 3 + 1] = c.g; col[(o + i) * 3 + 2] = c.b; }
    o += n;
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  out.setAttribute('color', new THREE.BufferAttribute(col, 3));
  return out;
}
const M = (x, y, z, ry, sx, sy, sz) => new THREE.Matrix4().compose(new THREE.Vector3(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(0, ry || 0, 0)), new THREE.Vector3(sx || 1, sy || sx || 1, sz || sx || 1));
let seed = 1337;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const L = Sim.LOCS;

// ground: faceted low-poly terrain, flat in the village, rising into hills under the fog
function groundH(x, z) {
  const r = Math.hypot(x, z);
  const k = Math.min(1, Math.max(0, (r - 34) / 14));
  return k * (2.2 + Math.sin(x * 0.21) * 1.6 + Math.cos(z * 0.17 + x * 0.05) * 1.8) + (r > 30 ? Math.sin(x * 1.3 + z) * 0.08 : 0);
}
(function buildGround() {
  const g = new THREE.PlaneGeometry(120, 120, 48, 48).toNonIndexed();
  g.rotateX(-Math.PI / 2);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, groundH(p.getX(i), p.getZ(i)));
  g.computeVertexNormals();
  const col = new Float32Array(p.count * 3);
  const greens = [new THREE.Color('#4f6236'), new THREE.Color('#566b39'), new THREE.Color('#47592f'), new THREE.Color('#5d6d3c'), new THREE.Color('#6a6a40')];
  for (let i = 0; i < p.count; i += 3) {
    const c = greens[Math.floor(rnd() * greens.length)];
    for (let j = 0; j < 3; j++) { col[(i + j) * 3] = c.r; col[(i + j) * 3 + 1] = c.g; col[(i + j) * 3 + 2] = c.b; }
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  scene.add(new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true })));
})();

// dirt paths
const pathMat = mat('#6f5a3d');
function path(a, b, w) {
  const dx = b.x - a.x, dz = b.z - a.z, len = Math.hypot(dx, dz);
  const m = new THREE.Mesh(new THREE.BoxGeometry(w || 1.6, 0.06, len + (w || 1.6)), pathMat);
  m.position.set((a.x + b.x) / 2, 0.02, (a.z + b.z) / 2);
  m.rotation.y = Math.atan2(dx, dz);
  scene.add(m);
}
const SQ = { x: 3, z: 5 };
path({ x: 0, z: 3 }, SQ, 2.2); path(SQ, { x: 33, z: 3.5 }, 1.8); path(SQ, { x: 11, z: 11 }, 1.6);
path(SQ, { x: -8, z: 6.5 }, 1.4); path({ x: 0, z: 0 }, { x: 12, z: -6 }, 1.4); path({ x: 0, z: 0 }, { x: -14, z: -8 }, 1.4);
path({ x: 0, z: -1 }, { x: 6, z: -3 }, 1.2); path({ x: -2, z: -2 }, { x: -8.5, z: -15.5 }, 1.2);
mesh(new THREE.CylinderGeometry(3.2, 3.2, 0.05, 12), pathMat, SQ.x + 1.5, 0.03, SQ.z + 1);

// pines (instanced) and rocks
const pineGeo = mergeColored([
  { geo: new THREE.CylinderGeometry(0.16, 0.22, 1.2, 5), color: '#4a3424', m: M(0, 0.6, 0) },
  { geo: new THREE.ConeGeometry(1.25, 1.9, 6), color: '#24402a', m: M(0, 1.9, 0) },
  { geo: new THREE.ConeGeometry(0.98, 1.6, 6), color: '#2c4b30', m: M(0, 2.8, 0, 0.5) },
  { geo: new THREE.ConeGeometry(0.66, 1.3, 6), color: '#355636', m: M(0, 3.6, 0, 1) }
]);
const pines = [];
for (let i = 0; i < 70; i++) {
  const a = rnd() * Math.PI * 2, r = Math.sqrt(rnd()) * 8.5;
  const x = L.forest.x + Math.cos(a) * r - 1.5, z = L.forest.z + Math.sin(a) * r - 1;
  if (Math.hypot(x - (L.forest.x + 5), z - (L.forest.z + 4)) < 3.2) continue;
  pines.push([x, z, 0.8 + rnd() * 0.6]);
}
for (let i = 0; i < 260; i++) {
  const a = rnd() * Math.PI * 2, r = 31 + rnd() * 28;
  const x = Math.cos(a) * r, z = Math.sin(a) * r;
  if (x > 20 && Math.abs(z - 3.5) < 5) continue;

function syncBakery(s, t, dt) {
  const T = s.tier, b = s.bakery;
  B.tiers.forEach((g, i) => g.visible = i === T);
  const shown = Math.min(12, Math.ceil(b.bread * 12 / Math.max(12, Sim.TIERS[T].cap)));
  B.loaves.forEach((m, i) => m.visible = i < (b.bread > 0 ? Math.max(1, shown) : 0));
  const sacks = Math.ceil(b.grain / 2), logs = Math.ceil(b.wood * 9 / Sim.TIERS[T].cap);
  B.sacks.forEach((m, i) => m.visible = i < Math.min(8, sacks));
  B.logs.forEach((m, i) => m.visible = i < Math.min(9, b.wood > 0 ? Math.max(1, logs) : 0));
  const baking = b.oven.loaded;
  ovenGlow.intensity = baking ? 1.6 + Math.sin(t * 13) * 0.25 + Math.sin(t * 5.3) * 0.2 : 0;
  mouthMat.emissiveIntensity = baking ? 0.9 + Math.sin(t * 9) * 0.15 : 0;
  // roof fades when you look into the building
  const near = Math.hypot(focus.x, focus.z) < 9;
  B.roofs.forEach(r => { r.material.opacity += ((near ? 0.12 : 1) - r.material.opacity) * Math.min(1, dt * 6); r.material.depthWrite = r.material.opacity > 0.9; });
  const chim = T === 0 ? { x: -2.3, y: 1.4, z: -1.75 } : T === 1 ? { x: -2.3, y: 4.4, z: -2.4 } : { x: -2.3, y: 4.9, z: -2.7 };
  smoke.forEach(m => {
    m.userData.life += dt * 0.35;
    if (m.userData.life > 1) { m.userData.life -= 1; m.userData.on = baking; }
    const l = m.userData.life;
    if (!m.userData.on) { m.visible = false; return; }
    m.visible = true;
    m.position.set(chim.x + Math.sin(l * 6 + t) * 0.3 + l * 1.2, chim.y + l * 3.2, chim.z + l * 0.6);
    m.scale.setScalar(0.5 + l * 1.4); m.material.opacity = 0.5 * (1 - l);
  });
}

  const h = Sim.hourOf(s);
  let k; // 1 = full day, 0 = night
  if (h < 5) k = 0; else if (h < 7) k = (h - 5) / 2; else if (h < 18) k = 1; else if (h < 21) k = 1 - (h - 18) / 3; else k = 0;
  const dusk = Math.max(0, 1 - Math.abs(h - 19) / 1.6) + Math.max(0, 1 - Math.abs(h - 6) / 1.2) * 0.6;
  tmpC.copy(SKY.night).lerp(SKY.day, k).lerp(SKY.dusk, Math.min(0.55, dusk * 0.55));
  scene.fog.color.copy(tmpC); renderer.setClearColor(tmpC);
  hemi.intensity = 0.25 + k * 0.6;
  sun.intensity = 0.1 + k * 0.85;
  sun.color.set(dusk > 0.3 ? '#ffb36b' : '#ffe2b0');
  const ang = ((h - 6) / 15) * Math.PI;
  sun.position.set(Math.cos(ang) * -30, 10 + Math.sin(Math.max(0.1, ang)) * 25, 14);
  windowMat.emissiveIntensity = Math.max(0, 1 - k * 1.4) * 1.1;

    <div class="day"><div class="dayhead"><strong>Day ${s.day}, so far</strong><span class="num">${Sim.clock(s.t)}</span></div>${acctTable(st, true)}<p>${lostLine(st)}</p><p>${hours}</p></div>`;

function erf(x) { const t = 1 / (1 + 0.3275911 * Math.abs(x)); const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x); return x >= 0 ? y : -y; }
function shareWilling(price, mean) { return Math.round(100 * (1 - 0.5 * (1 + erf((price - mean) / (1.4 * Math.SQRT2))))); }
function pageBakery(s) {
  const T = Sim.TIERS[s.tier], next = Sim.TIERS[s.tier + 1];
  const vill = shareWilling(s.price, 6 + T.wtpBonus), trav = shareWilling(s.price, 6.5 + T.wtpBonus);
  const perLoaf = (Sim.BUY.grain * Sim.RECIPE.grain + Sim.BUY.wood * Sim.RECIPE.wood) / T.batch;

    <dt>Bake time</dt><dd>${T.bakeMin} min</dd><dt>Storage and shelf</dt><dd>${T.cap} each</dd>
    <dt>Travelers a day</dt><dd>about ${T.travelers}</dd><dt>Upkeep</dt><dd>${T.upkeep}c a day</dd>

  html += `<h4>Upgrade</h4>`;

    html += `<div class="box"><h5>${next.name}</h5><dl class="kv"><dt>Cost</dt><dd>${next.cost.coin}c and ${next.cost.wood} wood</dd><dt>You have</dt><dd>${s.coins}c and ${wood} wood</dd>
      <dt>Batch</dt><dd>${T.batch} → ${next.batch} loaves</dd><dt>Bake time</dt><dd>${T.bakeMin} → ${next.bakeMin} min</dd><dt>Storage</dt><dd>${T.cap} → ${next.cap}</dd><dt>Travelers</dt><dd>${T.travelers} → ${next.travelers} a day</dd><dt>Upkeep</dt><dd>${T.upkeep} → ${next.upkeep}c a day</dd></dl>
      <div class="acts">${B_('Build the ' + next.name, ['upgrade'], '', !can)}</div>${can ? '' : '<p>Wood you carry and wood in bakery storage both count.</p>'}</div>`;

}
function pageStaff(s) {
  let html = `<h3>Staff</h3><p class="lead">Hire help, set pay, and see what they are doing.</p>`;
  if (s.worker) {
    const w = s.worker, st = s.stats;
    html += `<div class="box"><h5>${esc(w.name)}</h5><dl class="kv"><dt>Skill</dt><dd>${Sim.skillLabel(w.skill)} (works at ${Math.round(w.skill * 100)}% speed)</dd><dt>Asked for</dt><dd>${w.ask}c a day</dd><dt>Mood</dt><dd>${Math.round(w.mood)}/100</dd><dt>Bakery hours today</dt><dd>${Sim.hm(st.workerMin)}</dd><dt>Batches baked today</dt><dd>${st.batchesBy.worker}</dd><dt>Customers served today</dt><dd>${st.servedBy.worker}</dd></dl>
      <div class="bar mood ${w.mood < 30 ? 'low' : ''}"><i style="width:${Math.round(w.mood)}%"></i></div>
      <p><b>Right now:</b> ${esc(w.why || '')}</p>
      <h4>Daily wage</h4><div class="stepper">${`<button type="button" data-c='${JSON.stringify(['setWage', w.wage - 1])}' aria-label="Lower wage">&minus;</button><output class="num">${w.wage}c</output><button type="button" data-c='${JSON.stringify(['setWage', w.wage + 1])}' aria-label="Raise wage">+</button>`}</div>
      <p>${w.wage < w.ask ? `Below what ${esc(w.name)} asked. Mood drops each day you pay less.` : w.wage > w.ask ? 'Above the asking wage. Mood rises faster.' : 'Matches the asking wage. Mood rises steadily.'} Wages are paid at 21:00. Unhappy workers (below 30) work slower, and a miserable worker quits after a warning.</p>
      <p><b>Their day:</b> walk in at 06:00, work 07:00 to 19:00 with lunch at noon, home by 20:00. While working they serve waiting customers first, bake when the shelf runs low, and mind the counter otherwise.</p>
      <div class="acts">${UI.confirm === 'fire' ? `<div class="confirm">Let ${esc(w.name)} go? You can hire someone new straight away. ${B_('Yes, let them go', ['fire'], 'warn')} ${B_('Keep them', ['ui', 'confirm', null], 'alt')}</div>` : B_('Let go&hellip;', ['ui', 'confirm', 'fire'], 'alt')}</div></div>`;
  } else {
    html += `<p>Two villagers want work. Pick one and set a daily wage. Paying below what they ask saves coin but makes them unhappy.</p><div class="grid2">`;
    s.applicants.forEach((a, i) => {

      html += `<div class="box"><h5>${esc(a.name)}</h5><dl class="kv"><dt>Skill</dt><dd>${Sim.skillLabel(a.skill)} (${Math.round(a.skill * 100)}% speed)</dd><dt>Asks for</dt><dd>${a.ask}c a day</dd></dl>
        <div class="stepper" style="margin-top:8px"><button type="button" data-c='${JSON.stringify(['ui', 'wage', [i, wage - 1]])}' aria-label="Lower offer">&minus;</button><output class="num">${wage}c</output><button type="button" data-c='${JSON.stringify(['ui', 'wage', [i, wage + 1]])}' aria-label="Raise offer">+</button></div>
        <div class="acts">${B_(`Hire ${esc(a.name)} at ${wage}c a day`, ['hire', i, wage])}</div></div>`;
    });
    html += `</div><p>Once hired, your worker bakes and serves on their own. That frees you to gather wood for upgrades or trade at the Trading Post. You will still need to keep grain and wood in storage, or tell them to buy it on the Bakery page.</p>`;
  }

}
function pageGoals(s) {
  const firstOpen = Sim.GOALS.findIndex(g => !g.done(s));
  return `<h3>From Scrounger to Master Baker</h3><p class="lead">The first chapter of Hearthmoor.</p><ul class="goals">${Sim.GOALS.map((g, i) => `<li class="${g.done(s) ? 'done' : i === firstOpen ? 'now' : ''}"><span class="tick">${g.done(s) ? '&#10003;' : i + 1}</span><span>${esc(g.text)}</span></li>`).join('')}</ul>
  <h4>How the village works</h4><p>Days run from 06:00 to 21:00, about four minutes of real time. Nights pass quickly. Villagers keep their own routines: work in the fields and woods, lunch at the well at noon, an evening in the square, and bed. Most buy bread once a day. Travelers stop by from the east road, and a better bakery draws more of them.</p>
  <p>The books close at 21:00, when wages and upkeep are paid. You can never go into debt: if coin runs short, what can't be paid is skipped and explained in the ledger.</p>
  <p>Lifetime: ${s.lifetime.sold} loaves sold for ${s.lifetime.revenue}c over ${s.lifetime.days} days.</p>`;
}
function pageSave(s) {

  return `<h3>Saving</h3><p class="lead">Your game saves itself every 10 seconds, whenever you leave the page, and when you close this book.</p>

function uiCmd(k, v) {
  if (k === 'deselect') { UI.sel = null; renderCard(true); return; }

}
function resetView() { UI.sel = null; UI.loc = null; focus.set(G.player.x, 0, G.player.z); G.events.length = 0; lastEventT = -1; for (const [id, g] of agentMeshes) dropChar(g); agentMeshes.clear(); }
document.addEventListener('input', e => {
  if (e.target.id === 'price') { Sim.cmd(G, 'setPrice', +e.target.value); const T = Sim.TIERS[G.tier]; $('pv').textContent = G.price + 'c'; $('pw').textContent = `About ${shareWilling(G.price, 6 + T.wtpBonus)}% of villagers and ${shareWilling(G.price, 6.5 + T.wtpBonus)}% of travelers will pay this.`; }
});
document.addEventListener('change', e => { if (e.target.id === 'pol') act(['policy', 'supplyRuns', e.target.checked]); });

let lastEventT = -1, last = performance.now(), cardTimer = 0;
function drainEvents() {
