<title>Hearthmoor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed 3D village; parchment HUD strip on top, parchment action card at the bottom,
   a leather-bound book for management, a pause menu, and a title screen that opens like a book cover.
   One deliberate look in both light and dark hosts. */
:root {
  color-scheme: light;
  --ink: #2a1f16;
  --ink-soft: #5d4a36;
  --parch: #ead8b2;
  --parch-2: #dcc493;
  --leather: #35251b;
  --leather-2: #4c3626;
  --seal: #8c2e21;
  --moss: #4a6634;
  --gold: #a87d22;
  --gilt: #e2b552;
  --line: rgba(42, 31, 22, .22);
  --f-display: "IM Fell English", "Iowan Old Style", Georgia, serif;
  --f-caps: "IM Fell English SC", "IM Fell English", Georgia, serif;
  --f-body: "Alegreya Sans", "Gill Sans", "Trebuchet MS", system-ui, sans-serif;
}
[hidden] { display: none !important; }
html, body { height: 100%; background: #1d2420; color: var(--ink); overflow: hidden; overscroll-behavior: none; }
body { font-family: var(--f-body); font-size: 15px; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
#world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--seal); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* HUD */
.hud { position: fixed; top: 0; left: 0; right: 0; z-index: 5; pointer-events: none;
  padding-top: calc(env(safe-area-inset-top, 0px) + 8px);
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.strip { pointer-events: auto; display: flex; align-items: center; gap: 8px; background: linear-gradient(#efdfbd, var(--parch));
  border: 1px solid var(--line); border-radius: 6px; padding: 5px 6px; box-shadow: 0 3px 12px rgba(0,0,0,.35); max-width: 720px; margin: 0 auto; }
.icon-btn { border: 0; background: transparent; width: 40px; height: 40px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.icon-btn span, .icon-btn span::before, .icon-btn span::after { display: block; width: 18px; height: 2px; background: var(--ink); border-radius: 1px; position: relative; }
.icon-btn span::before, .icon-btn span::after { content: ""; position: absolute; left: 0; }
.icon-btn span::before { top: -6px; } .icon-btn span::after { top: 6px; }
.clock { font-family: var(--f-display); font-size: 18px; white-space: nowrap; }
.coins { margin-left: auto; font-weight: 700; font-size: 17px; color: var(--gold); white-space: nowrap; }
.coins.debt { color: #e0806e; }
.coins::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #f0cf6a, #9c7414); margin-right: 5px; vertical-align: -1px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
.book-btn { border: 0; background: var(--leather); color: var(--parch); border-radius: 4px; padding: 8px 12px; font-family: var(--f-display); font-size: 16px; min-height: 40px; }
.subhud { pointer-events: none; display: flex; flex-wrap: wrap; gap: 6px; max-width: 720px; margin: 6px auto 0; }
.chip { background: rgba(32, 26, 20, .74); color: #f1e3c2; border-radius: 999px; padding: 4px 10px; font-size: 13px; white-space: nowrap; }
.chip b { color: #f5cf73; font-weight: 700; }
.chip.on { background: rgba(74, 102, 52, .9); }
.goal { pointer-events: auto; max-width: 720px; margin: 6px auto 0; font-size: 13px; color: #f1e3c2; background: rgba(32,26,20,.74); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.goal em { font-family: var(--f-display); font-style: italic; color: #f5cf73; font-size: 14px; }

.speeds { display: flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; flex: none; }
.fast { border: 0; border-left: 1px solid var(--line); background: transparent; min-width: 34px; height: 34px; padding: 0 6px; font-size: 14px; font-weight: 700; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.fast:first-child { border-left: 0; }
.fast[aria-pressed="true"] { background: var(--leather); color: var(--parch); }
/* thumbsticks rest in the lower corners and jump to wherever your thumb lands */
.sticks { display: none; } /* the controls work without anything drawn on screen */
.stick { position: fixed; width: 120px; height: 120px; border-radius: 50%; border: 2px solid rgba(241, 227, 194, .45); background: radial-gradient(circle, rgba(20,14,10,.18), rgba(20,14,10,.38)); bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); opacity: .55; transition: opacity .15s; }
.stick.l { left: calc(max(16px, env(safe-area-inset-left, 0px)) + 18px); }
.stick.r { right: calc(max(16px, env(safe-area-inset-right, 0px)) + 18px); }
.stick.live { opacity: .9; transition: none; }
.stick i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #f3e6c8, #cdb48a); box-shadow: 0 2px 8px rgba(0,0,0,.45); }
.stick span { position: absolute; left: 0; right: 0; bottom: -20px; text-align: center; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: rgba(241,227,194,.75); text-shadow: 0 1px 3px #000; }
.stick.live span { display: none; }
.lookhint { position: fixed; right: calc(max(16px, env(safe-area-inset-right, 0px)) + 22px); bottom: calc(env(safe-area-inset-bottom, 0px) + 30px); display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: rgba(241,227,194,.7); text-shadow: 0 1px 3px #000; transition: opacity .4s; }
.lookhint.used { opacity: 0; }

.toasts { position: fixed; z-index: 6; left: 0; right: 0; top: 130px; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.toast { max-width: 340px; background: var(--parch); border-left: 3px solid var(--ink-soft); border-radius: 4px; padding: 4px 9px; font-size: 13px; line-height: 1.3; box-shadow: 0 3px 10px rgba(0,0,0,.35); animation: tin .25s ease-out; }
.toast.coin { border-color: var(--gold); } .toast.bad { border-color: var(--seal); } .toast.good { border-color: var(--moss); } .toast.story { border-color: var(--leather); font-family: var(--f-display); font-size: 14px; }
.toast.out { opacity: 0; transform: translateY(-6px); transition: .4s; }
@keyframes tin { from { opacity: 0; transform: translateY(-8px); } }
.night { position: fixed; z-index: 4; left: 50%; top: 50%; transform: translate(-50%, -50%); font-family: var(--f-display); font-style: italic; font-size: 22px; color: #e9d9b0; text-shadow: 0 2px 8px #000; pointer-events: none; }

/* action card */
/* the prompt sits between the two sticks and only shows when there is something to do */
.panel { position: fixed; z-index: 5; left: 0; right: 0; bottom: 0;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
  padding-left: calc(max(16px, env(safe-area-inset-left, 0px)) + 160px); padding-right: calc(max(16px, env(safe-area-inset-right, 0px)) + 160px); pointer-events: none; }
.card { pointer-events: auto; max-width: 440px; margin: 0 auto; background: linear-gradient(var(--parch), #e3cea4); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 -2px 18px rgba(0,0,0,.4); padding: 10px 12px 12px; max-height: 46vh; overflow-y: auto; }
.card h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 19px; line-height: 1.1; text-wrap: balance; }
.card .sub { color: var(--ink-soft); font-size: 13px; margin-top: 2px; line-height: 1.3; }
.card .why { font-size: 13px; margin-top: 5px; padding: 5px 7px; line-height: 1.3; background: rgba(255,255,255,.35); border-radius: 4px; }
.card .why b { font-weight: 700; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--parch); border-radius: 5px; padding: 8px 12px; min-height: 42px; font-weight: 500; font-size: 15px; }
.btn.alt { background: transparent; color: var(--ink); }
.btn.warn { background: var(--seal); border-color: var(--seal); }
.btn:disabled { opacity: .45; cursor: default; }
.btn small { display: block; font-size: 12px; opacity: .8; font-weight: 400; }
.places { display: flex; gap: 6px; margin-top: 8px; overflow-x: auto; scrollbar-width: none; }
.places::-webkit-scrollbar { display: none; }
.place { flex: none; border: 1px dashed var(--ink-soft); background: transparent; border-radius: 999px; padding: 6px 11px; font-size: 13px; color: var(--ink-soft); min-height: 34px; }
.bar { height: 8px; background: rgba(42,31,22,.15); border-radius: 4px; margin-top: 8px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--gold); border-radius: 4px; }
.mood i { background: var(--moss); } .mood.low i { background: var(--seal); }

/* book and pause sheets */
.sheet { position: fixed; inset: 0; z-index: 20; background: rgba(12, 9, 7, .72); display: flex; align-items: stretch; justify-content: center;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) max(8px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 10px) max(8px, env(safe-area-inset-left, 0px)); }
.cover { width: 100%; max-width: 720px; background: var(--leather); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,.6), inset 0 0 0 2px var(--leather-2); min-height: 0; }
.bookhead { display: flex; align-items: flex-end; min-width: 0; }
.bookhead .tabs { flex: 1; min-width: 0; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding: 0 2px; align-items: flex-end; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 0; background: #5a4130; color: #e8d6b0; padding: 8px 9px 10px; border-radius: 6px 6px 0 0; font-family: var(--f-display); font-size: 15px; min-height: 40px; }
.tab[aria-selected="true"] { background: var(--parch); color: var(--ink); }
.close { margin-left: auto; flex: none; border: 0; background: transparent; color: #e8d6b0; font-size: 26px; line-height: 1; padding: 4px 10px; min-height: 40px; min-width: 40px; }
.page { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; background: radial-gradient(ellipse at 50% 0%, #f2e4c6, var(--parch) 60%, var(--parch-2)); border-radius: 0 6px 6px 6px; padding: 16px 18px 24px; user-select: text; -webkit-user-select: text; }
.page.round { border-radius: 6px; }
.page.turn { animation: turn .35s ease-out; transform-origin: left center; }
@keyframes turn { from { opacity: .2; transform: perspective(900px) rotateY(-14deg); } }
.page h3 { font-family: var(--f-display); font-weight: 400; font-size: 26px; margin: 0 0 4px; text-wrap: balance; }
.page h4 { font-family: var(--f-display); font-weight: 400; font-size: 19px; margin: 18px 0 6px; border-bottom: 1px solid var(--line); padding-bottom: 3px; }
.page p { line-height: 1.5; margin: 6px 0; max-width: 62ch; }
.lead { color: var(--ink-soft); font-style: italic; font-family: var(--f-display); font-size: 16px; }
.paused { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
table.acct { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 15px; }
table.acct td { padding: 3px 0; border-bottom: 1px dotted var(--line); }
table.acct td:last-child { text-align: right; padding-left: 10px; white-space: nowrap; }
table.acct tr.tot td { border-bottom: 0; border-top: 1.5px solid var(--ink); font-weight: 700; }
table.acct tr.sh td { color: var(--ink-soft); font-size: 14px; }
.day { margin-top: 14px; padding: 10px 12px; background: rgba(255,255,255,.28); border: 1px solid var(--line); border-radius: 6px; }
.dayhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.dayhead strong { font-family: var(--f-display); font-weight: 400; font-size: 20px; }
.seal { display: inline-flex; align-items: center; justify-content: center; min-width: 58px; height: 30px; padding: 0 9px; border-radius: 15px; color: #f6e8c8; font-weight: 700; font-size: 14px; background: var(--moss); box-shadow: inset 0 0 0 2px rgba(0,0,0,.15); white-space: nowrap; }
.seal.neg { background: var(--seal); color: #f6e8c8; }
.notes { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.notes li { padding-left: 14px; position: relative; line-height: 1.45; }
.notes li::before { content: "\2766"; position: absolute; left: -2px; top: 0; color: var(--seal); font-size: 11px; }
.notes .btn { margin-top: 5px; min-height: 36px; padding: 5px 10px; font-size: 14px; }
.shopnote { font-family: var(--f-display); font-size: 16px; margin: 10px 0 2px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
.box { background: rgba(255,255,255,.28); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; min-width: 0; margin-top: 10px; }
.grid2 .box { margin-top: 0; }
.box h5 { margin: 0 0 4px; font-family: var(--f-display); font-weight: 400; font-size: 20px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 14px; font-variant-numeric: tabular-nums; margin: 0; }
.kv dt { color: var(--ink-soft); } .kv dd { margin: 0; text-align: right; }
.kv .later { color: rgba(42,31,22,.42); }
.stepper { display: inline-flex; align-items: center; gap: 6px; }
.stepper button { width: 40px; height: 40px; border-radius: 5px; border: 1px solid var(--ink); background: transparent; font-size: 20px; }
.stepper output { min-width: 56px; text-align: center; font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--seal); height: 32px; }
.goals { list-style: none; padding: 0; margin: 8px 0; display: grid; gap: 8px; }
.goals li { display: flex; gap: 10px; align-items: flex-start; line-height: 1.4; }
.goals .tick { flex: none; width: 22px; height: 22px; border: 1.5px solid var(--ink); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; }
.goals .done .tick { background: var(--moss); border-color: var(--moss); color: #f3e6c8; }
.goals .done span:last-child { color: var(--ink-soft); text-decoration: line-through; text-decoration-color: rgba(42,31,22,.4); }
.goals .now span:last-child { font-weight: 700; }
textarea, input[type=text] { width: 100%; font: 14px/1.3 var(--f-body); background: #f6ecd6; border: 1px solid var(--line); border-radius: 4px; padding: 8px; color: var(--ink); }
textarea { min-height: 90px; font: 12px/1.3 ui-monospace, Menlo, monospace; }
.confirm { margin-top: 8px; padding: 8px 10px; border: 1px solid var(--seal); border-radius: 6px; background: rgba(140,46,33,.08); }
.trades { width: 100%; border-collapse: collapse; font-size: 14px; }
.trades td, .trades th { text-align: left; padding: 5px 4px; border-bottom: 1px dotted var(--line); vertical-align: top; }
.trades th { font-weight: 500; color: var(--ink-soft); font-size: 13px; }
.pill { display: inline-block; border-radius: 999px; padding: 1px 8px; font-size: 12px; background: rgba(42,31,22,.1); white-space: nowrap; }
.pill.yes { background: var(--moss); color: #f3e6c8; }
.seg { display: inline-flex; border: 1px solid var(--ink); border-radius: 6px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 8px 12px; min-height: 40px; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--parch); }
.setting { margin: 14px 0; }
.setting > span { display: block; font-weight: 700; margin-bottom: 6px; }
.setting p { margin: 4px 0 0; color: var(--ink-soft); font-size: 14px; }

/* pause menu: an illuminated two-page spread */
.pspread { display: grid; gap: 14px; }
.pleaf { position: relative; border: 1px solid rgba(140,46,33,.35); box-shadow: inset 0 0 0 4px rgba(234,216,178,.9), inset 0 0 0 5px rgba(168,125,34,.45); border-radius: 4px; padding: 16px 18px; background: radial-gradient(ellipse at 50% 0%, rgba(255,250,235,.55), transparent 70%); }
.corner { position: absolute; width: 18px; height: 18px; border-color: var(--gold); border-style: solid; opacity: .8; }
.corner.tl { left: 6px; top: 6px; border-width: 2px 0 0 2px; } .corner.tr { right: 6px; top: 6px; border-width: 2px 2px 0 0; }
.corner.bl { left: 6px; bottom: 6px; border-width: 0 0 2px 2px; } .corner.br { right: 6px; bottom: 6px; border-width: 0 2px 2px 0; }
.pcrest .crest { width: 54px; height: 54px; margin: 0 auto; }
.ptitle { text-align: center; font-family: var(--f-display); font-size: 30px; line-height: 1; margin-top: 2px; }
.ptitle .drop { font-family: var(--f-caps); color: var(--seal); font-size: 40px; text-shadow: 1px 1px 0 rgba(168,125,34,.5); }
.ppos { text-align: center; font-family: var(--f-display); font-style: italic; color: var(--ink-soft); margin: 2px 0 12px; }
.ptiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 6px; }
.ptile { display: flex; gap: 8px; align-items: center; background: rgba(255,255,255,.3); border: 1px solid var(--line); border-radius: 5px; padding: 5px 8px; min-width: 0; }
.ptile b { display: block; font-size: 14px; } .ptile span { display: block; font-size: 11px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ptile div { min-width: 0; }
.ic { width: 22px; height: 22px; flex: none; stroke: var(--seal); stroke-width: 1.7; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.ic path[d^="M8 5 L19"] { fill: currentColor; }
.pgoal { margin-top: 10px; font-family: var(--f-display); font-size: 15px; line-height: 1.3; padding: 7px 10px; border-left: 3px solid var(--seal); background: rgba(140,46,33,.06); }
.pgoal span { display: block; font-family: var(--f-body); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
.pmenu-h { text-align: center; font-family: var(--f-caps); font-size: 18px; color: var(--ink-soft); margin-bottom: 8px; letter-spacing: .04em; }
.pmenu-h::before, .pmenu-h::after { content: " \2766 "; color: var(--seal); font-size: 12px; }
.pmenu { display: grid; gap: 5px; }
.mi { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 1px solid var(--line); background: rgba(255,255,255,.28); border-radius: 5px; padding: 6px 10px; min-height: 42px; }
.mi b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 17px; line-height: 1.1; } .mi small { display: block; font-size: 11px; color: var(--ink-soft); }
.mi.primary { background: var(--ink); color: var(--parch); border-color: var(--ink); } .mi.primary .ic { stroke: var(--gilt); color: var(--gilt); }
.mi .ic { color: var(--seal); }
@media (orientation: landscape) { .pspread { grid-template-columns: 1fr 1fr; } }
@media (orientation: landscape) and (max-height: 520px) { .pleaf { padding: 10px 14px; } .pcrest .crest { width: 40px; height: 40px; } .ptitle { font-size: 24px; } .ptitle .drop { font-size: 32px; } .ppos { margin-bottom: 8px; } .ptile { padding: 3px 7px; } .mi { min-height: 36px; padding: 3px 9px; } .mi b { font-size: 15px; } .pgoal { font-size: 13px; padding: 5px 8px; margin-top: 7px; } }
.menu-list { display: grid; gap: 8px; margin-top: 12px; }
.menu-list .btn { text-align: left; font-family: var(--f-display); font-size: 19px; font-weight: 400; padding: 10px 14px; min-height: 52px; }
.menu-list .btn small { font-family: var(--f-body); }
.back { border: 0; background: transparent; color: var(--ink-soft); padding: 6px 0; min-height: 36px; font-size: 14px; }
.statgroup { margin-top: 14px; }
/* the work mini-game sits where the prompt card would */
.mini { position: fixed; z-index: 7; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); width: min(400px, calc(100vw - 340px)); min-width: 280px;
  background: linear-gradient(var(--parch), #e3cea4); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 -2px 18px rgba(0,0,0,.45); padding: 8px 12px 10px; }
.mhead { display: flex; align-items: baseline; gap: 10px; } .mhead b { font-family: var(--f-display); font-weight: 400; font-size: 18px; } .mhead span { color: var(--ink-soft); font-size: 12px; margin-left: auto; }
.mx { border: 0; background: none; font-size: 22px; line-height: 1; min-width: 32px; min-height: 32px; color: var(--ink-soft); }
.mtrack { position: relative; height: 30px; margin: 6px 0 4px; border-radius: 15px; overflow: hidden; border: 1px solid rgba(42,31,22,.4); }
.mtrack.bakery { background: linear-gradient(90deg, #5a3a22, #c88a3a 45%, #e8b450 55%, #8a2a14); }
.mtrack.smithy { background: linear-gradient(90deg, #2a2624, #8a2a14 40%, #f0a030 65%, #fff1b0); }
.mtrack.tavern { background: linear-gradient(90deg, #6b4a2e, #8a6438 80%, #6b4a2e); }

/* ================= the land: Hearthmoor rebuilt =================

const SQ = Sim.P.center;
const STREAM = [[70, -260], [60, -170], [56, -110], [53, -80], [50, -60], [48, -44], [50, -24], [49, 0], [51, 20], [48, 44], [53, 70], [50, 110], [44, 180], [52, 260]];

const POND = { x: -18, z: -47, r: 4.2 };

const facing = (x, z, tx, tz) => Math.atan2(tx - x, tz - z);

/* ----- the land loads in 128 m tiles around you, with its own trees and rocks ----- */
const TILE = 128, TILE_RES = 50, TILE_RADIUS = 2;
const tiles = new Map();
let tileVersion = 0;
const GREENS = ['#4f6236', '#536637', '#4e6034', '#58693a', '#5b693c'].map(c => new THREE.Color(c));

  if (Math.abs(x - 470) < 300 && z > -1600 && z < 400 && segDist(x, z, RIVER) < 14) return false;
  for (const id in TOWNS) { const T = TOWNS[id]; if (Math.hypot(x - T.x, z - T.z) < T.r * 1.9) return false; }

    if (Math.abs(x - 470) < 300) wet = Math.min(wet, segDist(x, z, RIVER) - 6);
    if (wet < 4.5) C_TMP.lerp(C_BANK, 0.55);

    if (y > 40) C_TMP.lerp(C_SNOW, Math.min(1, (y - 40) / 10));
