<style>
/* Layout: full-bleed 3D village; parchment HUD strip on top, parchment action card at the bottom,
   a leather-bound book for management, a pause menu, and a title screen that opens like a book cover.
   One deliberate look in both light and dark hosts. */
:root {
  color-scheme: light;
  --ink: #2a1f16;
  --ink-soft: #5d4a36;
  --parch: #ead8b2;
  --parch-2: #dcc493;
  --leather: #35251b;
  --leather-2: #4c3626;
  --seal: #8c2e21;
  --moss: #4a6634;
  --gold: #a87d22;
  --gilt: #e2b552;
  --line: rgba(42, 31, 22, .22);
  --f-display: "IM Fell English", "Iowan Old Style", Georgia, serif;
  --f-caps: "IM Fell English SC", "IM Fell English", Georgia, serif;
  --f-body: "Alegreya Sans", "Gill Sans", "Trebuchet MS", system-ui, sans-serif;
}
[hidden] { display: none !important; }
html, body { height: 100%; background: #1d2420; color: var(--ink); overflow: hidden; overscroll-behavior: none; }
body { font-family: var(--f-body); font-size: 15px; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
#world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--seal); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* HUD */
.hud { position: fixed; top: 0; left: 0; right: 0; z-index: 5; pointer-events: none;
  padding-top: calc(env(safe-area-inset-top, 0px) + 8px);
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.strip { pointer-events: auto; display: flex; align-items: center; gap: 8px; background: linear-gradient(#efdfbd, var(--parch));
  border: 1px solid var(--line); border-radius: 6px; padding: 5px 6px; box-shadow: 0 3px 12px rgba(0,0,0,.35); max-width: 720px; margin: 0 auto; }
.icon-btn { border: 0; background: transparent; width: 40px; height: 40px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.icon-btn span, .icon-btn span::before, .icon-btn span::after { display: block; width: 18px; height: 2px; background: var(--ink); border-radius: 1px; position: relative; }
.icon-btn span::before, .icon-btn span::after { content: ""; position: absolute; left: 0; }
.icon-btn span::before { top: -6px; } .icon-btn span::after { top: 6px; }
.clock { font-family: var(--f-display); font-size: 18px; white-space: nowrap; }
.coins { margin-left: auto; font-weight: 700; font-size: 17px; color: var(--gold); white-space: nowrap; }
.coins.debt { color: #e0806e; }

/* the coin of Alderwyn: the crown on one face, Hearthmoor's oak on the other. It turns over when money comes in */
.coins::before { content: ""; display: inline-block; width: 20px; height: 20px; border-radius: 50%; background: var(--coin-crown) center / contain no-repeat; margin-right: 6px; vertical-align: -4px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.35)); }
.coins.gain::before { animation: coinFlip .8s ease-in-out; }
@keyframes coinFlip { 0% { transform: rotateY(0); background-image: var(--coin-crown); } 49% { background-image: var(--coin-crown); } 50% { transform: rotateY(180deg); background-image: var(--coin-oak); } 99% { background-image: var(--coin-oak); } 100% { transform: rotateY(360deg); background-image: var(--coin-crown); } }
@media (prefers-reduced-motion: reduce) { .coins.gain::before { animation: none; } }
.toast.coin::before { content: ""; display: inline-block; width: 18px; height: 18px; margin-right: 7px; vertical-align: -4px; background: var(--coin-oak) center / contain no-repeat; }
.task-btn { background: #6b5636; margin-right: 6px; } .task-btn span { display: inline-block; min-width: 18px; margin-left: 6px; padding: 0 5px; border-radius: 9px; background: var(--gold, #c9962b); color: #2a1d12; font: 700 12px/18px var(--f-body); }
.task-btn span:empty { display: none; }
.book-btn { border: 0; background: var(--leather); color: var(--parch); border-radius: 4px; padding: 8px 12px; font-family: var(--f-display); font-size: 16px; min-height: 40px; }
.subhud { pointer-events: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; max-width: 720px; margin: 6px auto 0; }
.chip { background: rgba(32, 26, 20, .74); color: #f1e3c2; border-radius: 999px; padding: 4px 10px; font-size: 13px; white-space: nowrap; }
.chip b { color: #f5cf73; font-weight: 700; }
.chip.on { background: rgba(74, 102, 52, .9); }
.chip.rank { font-weight: 600; }
.covrow { display: grid; grid-template-columns: 7.5em 1fr; align-items: center; gap: 8px; font-size: 14px; margin: 3px 0; }
.covrow .bar { height: 8px; }
.linklike { background: none; border: 0; padding: 0; text-decoration: underline; font: inherit; color: inherit; cursor: pointer; }
.case .notes { margin: 6px 0; }
.signrent { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
.signrent > span:first-child { font-weight: 600; }
.chip.rank.r-councillor { box-shadow: inset 0 0 0 1px #c9c6bc; }
.chip.rank.r-elder { background: rgba(52, 78, 48, .9); box-shadow: inset 0 0 0 1px #c9c6bc; }
.chip.rank.r-lord { background: rgba(90, 34, 48, .92); box-shadow: inset 0 0 0 1px #d9aa3a; }
.chip.rank.r-c_trade { background: rgba(34, 64, 106, .92); box-shadow: inset 0 0 0 1px #d9aa3a; }
.chip.rank.r-c_treasury { background: rgba(31, 74, 58, .92); box-shadow: inset 0 0 0 1px #f5cf73; }
.chip.rank.r-c_war { background: rgba(122, 31, 34, .92); box-shadow: inset 0 0 0 1px #c9cdd2; }
.chip.rank.r-c_law { background: rgba(28, 26, 30, .94); box-shadow: inset 0 0 0 1px #f3efe4; }
.chip.rank.r-ruler { background: rgba(142, 31, 34, .94); color: #fff3d6; box-shadow: inset 0 0 0 1px #f5cf73; }
.treewrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 10px; padding-bottom: 6px; background: radial-gradient(ellipse at center, rgba(255,248,226,.6), rgba(0,0,0,0)); border-radius: 8px; }
.tree { display: block; margin: 0 auto; font-family: var(--f-body); }
.tree .tname { font-family: var(--f-display); font-size: 14px; fill: #2a1f16; }
.tree .tsub { font-size: 11px; fill: #5e4a38; } .tree .trel { font-size: 11px; font-style: italic; fill: #8e2b22; }
.tree .tlabel { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; fill: #7a5a32; } .tree .tmark { font-size: 14px; fill: #8e2b22; }
.tree .tnode { cursor: pointer; } .tree .tnode.dead rect { opacity: .85; } .tree .tnode.me rect { fill: #f7e3a6; }
.tree .tnode:hover rect, .tree .tnode:focus rect { stroke-width: 3; } .tree .tnode.sel rect { stroke: #c9962b; } .tree .tplus { fill: #f4e7c8; font: 700 12px var(--f-body); }
.warnbox { border-color: #8e2b22 !important; }

    if (!ctx || ctx.state !== 'running') return;
    const h = G ? Sim.hourOf(G) : 12, night = h >= 20.5 || h < 5.5, t = ctx.currentTime;
    windGain.gain.setTargetAtTime(0.04 + Math.random() * 0.05, t, 1.5);
    windFilter.frequency.setTargetAtTime(300 + Math.random() * 300, t, 2);
    if (UI.mode !== 'play' || UI.overlay === 'map') return;
    if (!night && Math.random() < 0.35) {
      const f = 2200 + Math.random() * 1800, n = 2 + Math.floor(Math.random() * 4);
      for (let i = 0; i < n; i++) {
        const o = ctx.createOscillator(), g = ctx.createGain(), s0 = t + i * (0.09 + Math.random() * 0.05);
        o.frequency.setValueAtTime(f, s0); o.frequency.exponentialRampToValueAtTime(f * (1.2 + Math.random() * 0.4), s0 + 0.06);
        g.gain.setValueAtTime(0, s0); g.gain.linearRampToValueAtTime(0.025, s0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0005, s0 + 0.08);
        o.connect(g); g.connect(amb); o.start(s0); o.stop(s0 + 0.1);
      }
    }
    if (night && Math.random() < 0.7) {
      for (let i = 0; i < 6; i++) {
        const o = ctx.createOscillator(), g = ctx.createGain(), s0 = t + i * 0.045;
        o.frequency.value = 4400; g.gain.setValueAtTime(0, s0); g.gain.linearRampToValueAtTime(0.012, s0 + 0.008); g.gain.linearRampToValueAtTime(0, s0 + 0.03);
        o.connect(g); g.connect(amb); o.start(s0); o.stop(s0 + 0.04);
      }
    }
  }
  function noise(t, dur, type, f, q, g, sweep) {
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const fl = ctx.createBiquadFilter(); fl.type = type; fl.frequency.setValueAtTime(f, t); fl.Q.value = q || 1; if (sweep) fl.frequency.exponentialRampToValueAtTime(sweep, t + dur);
    const gn = ctx.createGain(); gn.gain.setValueAtTime(g, t); gn.gain.exponentialRampToValueAtTime(0.0005, t + dur);
    s.connect(fl); fl.connect(gn); gn.connect(sfx); s.start(t, Math.random()); s.stop(t + dur + 0.02);
  }
  function tone(f, t, dur, g, type) {
    const o = ctx.createOscillator(); o.type = type || 'sine'; o.frequency.value = f;
    const gn = ctx.createGain(); gn.gain.setValueAtTime(g, t); gn.gain.exponentialRampToValueAtTime(0.0005, t + dur);
    o.connect(gn); gn.connect(sfx); o.start(t); o.stop(t + dur + 0.02);
  }
  const FX = {
    click(t) { noise(t, 0.05, 'bandpass', 1800, 2, 0.25); tone(180, t, 0.06, 0.12); },
    page(t) { noise(t, 0.32, 'bandpass', 900, 0.8, 0.22, 3200); },
    scroll(t) { noise(t, 0.7, 'lowpass', 2400, 0.7, 0.18, 500); tone(110, t, 0.3, 0.05); },
    coin(t) { tone(1760, t, 0.25, 0.12); tone(2350, t + 0.05, 0.3, 0.1); },
    good(t) { [74, 78, 81].forEach((m, i) => pluck(hz(m), t + i * 0.07, 0.5, sfx)); },
    great(t) { [74, 78, 81, 86].forEach((m, i) => pluck(hz(m), t + i * 0.06, 0.55, sfx)); },
    miss(t) { tone(110, t, 0.25, 0.25, 'triangle'); noise(t, 0.15, 'lowpass', 400, 1, 0.2); },
    clang(t) { [820, 1270, 2130, 3010].forEach((f, i) => tone(f, t, 0.5 - i * 0.08, 0.09)); noise(t, 0.08, 'highpass', 3000, 1, 0.3); },
    knead(t) { noise(t, 0.12, 'lowpass', 500, 1, 0.35); tone(90, t, 0.1, 0.2); },
    saw(t) { noise(t, 0.18, 'bandpass', 2600, 3, 0.25, 1600); },
    pour(t) { noise(t, 0.4, 'bandpass', 700, 2, 0.15, 1400); },
    sizzle(t) { noise(t, 0.5, 'highpass', 4000, 0.5, 0.12); }
  };
  return {
    start, unlock, vol, status,
    play(name) { if (!ctx || ctx.state !== 'running' || !FX[name]) return; try { FX[name](ctx.currentTime + 0.01); } catch (e) { } },
    suspend() { if (ctx && ctx.state === 'running') ctx.suspend(); if (tag && !tag.paused) tag.pause(); },
    resume() { if (ctx && ctx.state !== 'running' && ctx.state !== 'closed') { try { ctx.resume().catch(() => { }); } catch (e) { } } }
  };
})();
// an iPhone only lets sound start from a finished tap (touchend or click), never from the moment a finger lands
['touchend', 'pointerup', 'click', 'keydown'].forEach(ev => window.addEventListener(ev, () => Snd.unlock(), { capture: true, passive: true }));
document.addEventListener('click', e => { if (e.target.closest && e.target.closest('button, .pin, [data-c]')) Snd.play('click'); }, { capture: true });
document.addEventListener('visibilitychange', () => { if (document.hidden) Snd.suspend(); else Snd.resume(); });

  bakery: { name: 'Bake the bread', verb: 'Pull it out', hint: 'Pull the loaf out when the needle is inside the bright band. Dead centre is perfect.', kind: 'time', sound: 'knead', bar: 'Heat of the oven', done: 'loaves', one: 'loaf', ok: 'Golden crust', bad: 'Burnt' },
  smithy: { name: 'Strike the iron', verb: 'Strike', hint: 'Strike when the needle is inside the bright band. Dead centre is perfect.', kind: 'time', sound: 'clang', bar: 'Heat of the iron', done: 'tools', one: 'tool', ok: 'Clean strike', bad: 'Cold iron' },
  tavern: { name: 'Pour the ale', verb: 'Hold to pour', hint: 'Hold to pour and let go when the ale reaches the line. Too much and it spills.', kind: 'pour', sound: 'pour', bar: 'Mug', done: 'mugs', one: 'mug', ok: 'A perfect pint', bad: 'Spilled' },
  joinery: { name: 'Saw the plank', verb: 'Saw', hint: 'Saw when the needle is on your mark, inside the bright band.', kind: 'time', sound: 'saw', bar: 'Blade', done: 'cuts', one: 'cut', ok: 'Straight cut', bad: 'Crooked' }
};
const mini = { on: false };
function openMini() {
  const e = Sim.empById(G.job.emp), M = MINI[e.trade];
  Object.assign(mini, { on: true, trade: e.trade, M, pos: 0, dir: 1, speed: 0.55, zone: newZone(), level: 0, holding: false, streak: 0, perfects: 0, made: 0, hits: 0, msg: M.hint, flash: '' });
  $('mini').hidden = false; $('panel').hidden = true; renderMini(true);
}
function closeMini() { mini.on = false; $('mini').hidden = true; renderCard(true); }
function newZone() { const w = 0.16 + Math.random() * 0.06; const a = 0.15 + Math.random() * (0.7 - w); return [a, a + w]; }
function renderMini(full) {
  const M = mini.M;
  if (full) {
    $('mini').innerHTML = `<div class="mhead"><b>${M.name}</b><span id="mscore" class="num"></span><button type="button" class="mx" data-c='["ui","miniClose"]' aria-label="Stop">&times;</button></div>
      <div class="mtrack ${mini.trade}"><div class="mzone" id="mzone"></div><div class="mline" id="mline"></div><div class="mneedle" id="mneedle"></div><span class="mlabel">${M.bar}</span></div>
      <p class="mmsg" id="mmsg"></p>
      <button type="button" class="btn mgo" id="mgo">${M.verb}</button>`;
    const go = $('mgo');
    if (M.kind === 'pour') {
      const down = ev => { ev.preventDefault(); mini.holding = true; mini.level = 0; Snd.play('pour'); };
      const up = ev => { ev.preventDefault(); if (mini.holding) { mini.holding = false; judge(); } };
      go.addEventListener('pointerdown', down); go.addEventListener('pointerup', up); go.addEventListener('pointerleave', up); go.addEventListener('pointercancel', up);
    } else go.addEventListener('pointerdown', ev => { ev.preventDefault(); judge(); });
  }
  const pos = M.kind === 'pour' ? mini.level : mini.pos;
  if (M.kind === 'pour') $('mneedle').style.width = (Math.min(1.05, pos) * 100) + '%'; else $('mneedle').style.left = (Math.min(1.05, pos) * 100) + '%';
  const z = M.kind === 'pour' ? [0.82, 0.95] : mini.zone;
  $('mzone').style.left = (z[0] * 100) + '%'; $('mzone').style.width = ((z[1] - z[0]) * 100) + '%';
  $('mline').style.left = (M.kind === 'pour' ? 100 : -10) + '%';
  $('mmsg').textContent = mini.msg;
  $('mscore').textContent = `${mini.made} ${mini.made === 1 ? M.one : M.done} · tips ${G.job ? (G.job.tips || 0) : 0}/8c`;
}
function stepMini(dt) {
  if (!mini.on) return;
  if (!G.job || !Sim.inShift(G) || !Sim.playerAtWork(G)) { closeMini(); toast('You stepped away from your work.', 'info', true); return; }
  if (mini.M.kind === 'pour') { if (mini.holding) { mini.level += dt * 0.42; if (mini.level > 1.04) { mini.holding = false; judge(); } } }
  else { mini.pos += mini.dir * mini.speed * dt; if (mini.pos > 1) { mini.pos = 1; mini.dir = -1; } if (mini.pos < 0) { mini.pos = 0; mini.dir = 1; } }
  renderMini(false);
}
function judge() {
  const M = mini.M;
  let q;
  if (M.kind === 'pour') { const l = mini.level; q = l > 1 ? 0 : l >= 0.86 && l <= 0.92 ? 2 : l >= 0.82 && l <= 0.95 ? 1 : 0; mini.level = 0; }
  else { const [a, b] = mini.zone, mid = (a + b) / 2, half = (b - a) / 2, off = Math.abs(mini.pos - mid); q = off <= half * 0.35 ? 2 : off <= half ? 1 : 0; }
  Snd.play(M.sound);
  if (q) {
    mini.hits++; mini.streak++; if (q === 2) mini.perfects++;
    mini.msg = (q === 2 ? 'Perfect! ' : '') + M.ok + '.' + (mini.streak > 2 ? ' ' + mini.streak + ' in a row.' : '');
    if (mini.hits % 4 === 0) {
      const tip = mini.perfects >= 3 ? 2 : 1; mini.perfects = 0; mini.made++;
      const r = Sim.cmd(G, 'shiftTip', tip);
      Snd.play(tip > 1 ? 'great' : 'good');
      mini.msg = r.ok && !r.msg ? `${Sim.empById(G.job.emp).boss} is pleased: +${tip}c tip.` : (r.msg || 'Good work.');
      drainEvents();
    }
    mini.speed = Math.min(1.4, mini.speed + 0.04);
  } else { Snd.play('miss'); mini.streak = 0; mini.msg = M.bad + '. Try again.'; mini.speed = Math.max(0.5, mini.speed - 0.06); }
  mini.zone = newZone();
  renderMini(false);
}

/* ----- patch notes and the update check ----- */
const BUILD = '/*BUILD*/';
const NOTES = [
  { v: '0.53', date: '6 November', title: 'Your name, and your enemies', items: [
    'Your name. Everything you do to people is remembered, and it adds up to how good or cruel you are, and how far your name is known. People greet you by it, work for you by it, and buy from you by it. See the new Renown page.',
    'People remember. Everyone you hire, pay well, evict, sack, overcharge or convict remembers it, and so does their family. Tap anyone to see what they hold against you, or thank you for.',
    'Run a business the simple way: three dials for each one. Prices are cheap, fair or greedy, and pay is low, fair or generous. Hire the best in one tap. Rent on every house you own is low, fair or high. The detailed management is still there under Manage.',
    'Wages and rent pull against each other. Pay below what is fair in a town and workers walk out. Charge a worker more rent than their wage can cover and they pack up and leave town, and you lose a tenant and a worker. Treat people badly enough and nobody will work for you.',
    'Loyal staff work harder, and a good name brings more customers. Greed pays faster, and makes enemies.',
    'Enemies. Wrong someone enough and they become your rival, then your enemy, then your nemesis, and at worst a blood feud. Rivals bad-mouth you and start price wars. Enemies smash your property, lure away your staff and pay thugs to beat you. Nemeses set fires and hire killers, and a blood feud can poison your family. You can have several at once, in Valdoria too: a merchant whose trade you took, a courtier jealous of the Queen\u2019s favour, a mother whose son died in your war.',
    'They are real people. Run into one in the street, or track them down: ask around town, set an informant on them, and follow the marker. Face them and choose: make amends, make peace, pay them off, threaten them, expose them with proof, or settle it with steel. As a lord or ruler you can have them arrested or banished. In the big towns you can hire a blade.',
    'Duels. A fight is a quick duel: strike when the needle is in the bright band, and parry when they swing. Win, and you choose whether they live. Lose to a hired killer in a blood feud, and you die, and your heir carries on.',
    'A grudge outlives the one who held it: kill someone, and their children grow up wanting your blood.',
    'The throne room. As ruler, petitioners come before you: a family whose roof fell in, a quarrel over a field with a bribe on the table, a mother begging mercy for her son, a fever in a town. Each choice is kind or cold, with a real cost either way. Hold court from the Realm page.',
    'Own the town. Buy every business in a town and you become its master: a statue in the square, more fame, and the guilds against you. Pay below fair and they strike.'
  ] },
  { v: '0.52', date: '6 November', title: 'Wars and risings keep their word', items: [
    'Free trade won in a war is free from the day of the peace, and nothing changes the duty while it lasts. Before, the old duty stayed in force until the weekly update, and then crept back.',
    'When the war is going badly (\u221240 or worse), the Queen will not take gold for peace: she makes it only on her own terms, the aim she went to war for. The king gives in on her terms too when he makes peace for you.',
    'A truce binds the crown as well as the Queen. You can still break it and declare war, but it is an explicit choice, and it costs you with the court, every noble, the towns and the Queen.',
    'After a rising, a council seat you give one ally is no longer taken from them for the next. Every seat already given is safe, and when none is left you give land instead.',
    'A charter won by a rising seats you on the council by the council\u2019s rules: one seat to a person, and not during the wait after you resign. If you already sit on the council, your seat is confirmed instead.'
  ] },
  { v: '0.51', date: '6 November', title: 'What wars are for, Stormrest, and rebellion', items: [
    'Every war now has an aim. When you declare war as ruler, you choose it: take Stormrest Isle, win free trade at Dawnport, or make Valdoria pay. The Queen names hers: Stormrest, tribute from Eastwatch, or holding Alderwyn\u2019s tariff down.',
    'Wars can be won outright. Once the war stands at 50, a campaign (150c from the treasury) can force a surrender, and the winner\u2019s aim is imposed and lasts: the isle changes hands, tribute is paid day by day, or trade terms hold for 60 days. The Queen campaigns too when the war sinks to \u221250. Losing outright costs the crown standing with the court and the towns. War now costs 25c a day, so a winning war is affordable.',
    'Stormrest Isle is a free harbour that both crowns claim. Whoever holds it takes its harbour dues and makes the crossing safer for its own ships in war. The islanders remember how they are treated: heavy dues sour them, a new harbour wall wins them round, and if their mood falls too low they throw the garrison out.',
    'Rebellion. A lord, or an exile, can plot against the King of Alderwyn, for the crown or for a charter (lower taxes, fair courts, a council seat). Win lords and councillors in secret, by promises you will owe or by fear that may turn to betrayal; buy arms. Every approach risks discovery: once the king knows, rise within two days or be exiled for treason.',
    'Risen, it is civil war: your men against the king\u2019s levies and the lords still loyal. Pay your men or they desert. When the war is yours, march on Crownmere. The king may offer a charter and a pardon to end it.',
    'Win the crown and the realm is yours to govern: keep your promises of land and seats within twenty days, or the man you cheated raises men against you; and decide what becomes of the old king\u2019s lords, amnesty or a purge. Lose, and it is exile, with the road back still open.'
  ] },
  { v: '0.50', date: '6 November', title: 'War between the crowns', items: [
    'Alderwyn and Valdoria can now go to war. When relations sink very low and nothing binds the crowns, Queen Ximena may declare it, after warning you that her galleys are gathering. As ruler, you can declare it yourself when relations are below 30. A royal marriage or an alliance keeps the peace; so does a trade pact, unless you tear it up.',
    'In war: no passage ships sail between the crowns (except the last ships home in the first three days); Dawnport is closed to Alderwyn goods; Alderwyn subjects still in Valdoria after three days are fined and shipped home; what you own in Valdoria is seized; Valdorian galleys raid Eastwatch; and the treasury pays 40c a day.',
    'Your own ship can still sail, at a risk: Valdorian galleys take about three ships in ten on the crossing, and one that reaches Dawnport is impounded until the peace, unless you hold the Queen\u2019s royal warrant.',
    'The war has a score, shown on the Realm page. Alderwyn\u2019s levies against Valdoria\u2019s army of 160 push it day by day, and a Marshal on the council helps. A long war wears on the towns and the court.',
    'Peace comes on terms that follow the war: the side that is winning is paid, from 250c to 700c. The ruler makes peace from the Realm page once the war is five days old; otherwise the king makes it in his own time, and after a stalemate the Queen offers it. After the peace, what was seized is returned, and there is no new war for 45 days.'
  ] },
  { v: '0.49', date: '6 November', title: 'Stage VIII begins: Valdor and the Queen', items: [
    'Valdor, the royal capital of Valdoria, is open. Take the Queen\u2019s Road east from Thornwick through the forest, or the coach from any Valdorian town. About 900 people live there, with fifteen businesses: goldsmiths, the Royal Silk Works, the Royal Armoury, taverns and bakeries. The Calle Mayor runs from the west gate to the Plaza de la Reina, with the cathedral to the north and the Alcázar on its terrace to the east.',
    'Queen Ximena II is a person now, and holds court at the Alcázar. She receives the ruler of Alderwyn, holders of the Consul\u2019s charter, and anyone with a name of 25 in Valdoria. Ask for an audience, present a gift, and, as a chartered merchant she thinks well of, ask for a royal warrant: Valdorian contracts pay a quarter more, and your name grows each week.',
    'Her regard for you is her own. Gifts, honest trade, Valdorian contracts, treaties and a royal marriage raise it; smuggling at Dawnport and broken treaties lower it. When you rule Alderwyn, relations between the crowns drift each week towards how she feels about you, and a ruler she favours can ask her to lower the duty.',
    'Valdoria keeps its own courts: the Consul\u2019s magistrate in Dawnport and the Queen\u2019s Alcalde in Valdor. They hear the towns\u2019 cases by Valdorian law, sterner than Alderwyn\u2019s, and no one from Alderwyn has a say in them, not even its crown. You can watch them from the Justice page.',
    'Cutpurses work Valdoria\u2019s crowded markets. If you see who took your coin, bring the charge before the Valdorian court and it may make them repay you.',
    'Bandits now haunt Valdoria\u2019s roads, worst in Thornwick\u2019s forest, and can waylay your coach. The Holy Brotherhood rides against them; once you have a name of 15, ride with it from the Castellan\u2019s Keep in Stonewatch for half a day and a few coins.',
    'Fixed: in Goldmeadow, Thornwick and Stonewatch, hungry folk looked for day work that only exists in Oakbridge.'
  ] },
  { v: '0.48', date: '6 November', title: 'Loose ends from the review', items: [
    'Your ship\u2019s hold remembers where each load was bought. Only goods brought from another port earn a name in Valdoria; iron or wool bought on Dawnport\u2019s own quay and sold straight back earns nothing, whatever the duty.',
    'Each court keeps its own list of unfinished sentences. A fine or days of work go on being paid and served however many cases are decided after them.',
    'A conviction that was overturned on appeal in an older save has what was left of its fine and work cancelled the moment the save is loaded.'
  ] },
  { v: '0.47', date: '6 November', title: 'Justice that does what it says', items: [
    'A pardon or a warning now frees an accused you had arrested. Before, they stayed in the cells after the hearing, still listed as held on suspicion, and filled the cells.',
    'Fines go to the chest of the court that set them: Greenhaven\u2019s fines to Greenhaven, Oakbridge\u2019s to Oakbridge. Before, every fine went to Hearthmoor\u2019s chest.',
    'Unpaid fines are collected in every town, a little at a time or worked off, not only in Hearthmoor.',
    'Overturning a conviction on appeal cancels what is left of its fine and its days of work, and takes it off the person\u2019s record.',
    'Your name in Valdoria now grows only from honest trade: goods brought from Alderwyn and landed at Dawnport with the duty paid, up to 3 a day. Buying wine on the quay and selling it straight back no longer raises it.',
    'Sleep until morning: from noon onwards, your hut or home offers to let you sleep until half an hour before your shift (or 05:30).',
    'Town maps open framed on the whole town, so every place is on screen, including Dawnport\u2019s Consul\u2019s Palace and coach house. You can zoom out a little further.',
    'Selling cargo now tells you what it fetched, the duty paid and your profit, instead of showing \u201c[object Object]\u201d.',
    'A Valdorian royal who marries keeps their own name. (Infanta Leonor became \u201cInfanta\u201d plus your family name.)',
    'Fixed: \u201cYou step inside undefined\u201d when entering a building; \u201c1 loaves\u201d in the minigames; the Realm page still promising relations would never fall below 45 after a royal marriage.',
    'If your browser cannot start 3D graphics, the game now says so instead of showing a blank page.'
  ] },
  { v: '0.46', date: '5 November', title: 'Fair bets, and work in Valdoria', items: [
    'Smuggling is a gamble you can weigh: the customs men are waiting about 15% of the time at Dawnport by day (25% when the crowns are at odds), 12% at Eastwatch, 5% less at night, and only 4% with a customs clerk paid 40c to look away for ten days (he may be caught and name you). The risk shows on the button.',
    'A royal marriage keeps the crowns close while it lasts (relations rise each week), but no longer protects them for ever: if the royal spouse is cast off or gone, the bond breaks and Valdoria remembers. Convicting a royal in an Alderwyn court angers the Queen.',
    'Work in Valdoria: Goldmeadow, Thornwick, Stonewatch and Dawnport post supply contracts (timber and ore for Goldmeadow, bread for the woodcutters and the garrison, Thornwick timber for the Queen’s ships). They pay coin and make your name in Valdoria. Each of Valdoria’s towns now has a market where you can buy and sell grain, wood and ore.',
    'Sea markets are deeper and recover faster, so a ship can make a steady living rather than emptying a market in one trip.',
    'Load a save from a file: the Load screen takes a .txt save code or a .json save, and imports go into an empty slot when there is one. The title screen shows the build number.',
    'Someone you are courting is spoken for: while your courtship is under way, other villagers no longer marry them out from under you.',
  ] },
  { v: '0.45', date: '5 November', title: 'All of Valdoria, and the coin of the realm', items: [
    'The coin of Alderwyn: the crown on one face and Hearthmoor’s oak on the other. It turns slowly on the title screen, sits beside your purse on the top bar, and flips over whenever money comes in.',
    'Three more Valdorian towns, each with its own people, businesses, market, watch and head. Goldmeadow (about 85), on the plains south-east of Dawnport: wheat fields, horse paddocks and a windmill, under a Reeve. Thornwick (about 65), a timber town at the forest’s edge to the east, with a saw pit and charcoal clamps, under a Warden. Stonewatch (about 210), the walled fortress guarding the northern pass, with its garrison, armourers, quarry and the Castellan’s keep.',
    'Roads run from Dawnport to each of them, and coaches run between Valdoria’s towns from their coach houses. No road or coach crosses the sea: for that you need a ship. Coach houses everywhere now offer every town in their own kingdom.',
    'Treaties. As ruler of Alderwyn you can offer Valdoria a trade pact (relations of 55, and your tariff at 1.1× or below): the duty at Dawnport falls to 5%. Keep it twenty days and, with relations of 70, make it an alliance: no duty at all, and the port is never closed. Raise your tariff and the Queen tears the treaty up.',
    'Royal marriages. The Queen’s son and daughter, Infante Rodrigo and Infanta Leonor, are of an age to marry. With relations of 60 and 300c for the wedding, marry one yourself or to a grown child of yours. The houses are joined, and relations never fall below 45 again.',
    'Your ship now rides at its berth in whichever port you last sailed it to. Arcades line two sides of Dawnport’s Plaza Mayor.',
  ] },
  { v: '0.44', date: '5 November', title: 'A ship of your own, and the Queen of Valdoria', items: [
    'Buy a merchant cog at Eastwatch’s Passage Office for 800c: 80 loads of cargo, and it sails when you say, by day or night. Crew and mooring cost 3c a day, and 6c a voyage. In a winter storm it waits unless you tell it to sail anyway, and then the sea may take a third of the cargo.',
    'Sea trade. Each kingdom makes what the other wants: salt and wine are cheap in Dawnport and dear in Eastwatch; wool and iron the other way round. Prices move as you buy and sell and recover over the following days, so one ship cannot empty a market. The port card shows what ten loads cost to buy and fetch to sell.',
    'Customs. Alderwyn goods sold at Dawnport pay the Queen’s duty (20% to start); Valdorian goods sold at Eastwatch pay Alderwyn’s tariff to the crown. Goods you carry ashore as a passenger pay too. You can land cargo quietly to skip the duty, but the customs men are often waiting: they seize it and fine you.',
    'Your name in Valdoria grows with honest trade. At 40, the Consul in his palace will sell you a merchant’s charter (200c) that halves the duty on everything you land.',
    'Queen Ximena II rules Valdoria for her own people. Each week she answers Alderwyn’s tariffs with her own duty; when relations sour she closes Dawnport to Alderwyn’s goods for ten days; and hail in the vineyards, a great salt harvest or her new warships change what Dawnport will pay. The Realm page shows her, the duty, relations with Alderwyn and your name there. As ruler, your tariff sets the tone.',
  ] },
  { v: '0.43', date: '5 November', title: 'Across the Sundering Sea', items: [
    'Stage VII begins. Ships now sail from the Passage Office on Eastwatch’s quay across the Sundering Sea to Dawnport in Valdoria, calling at Stormrest Isle on the way: 40c to Dawnport, 18c to Stormrest, 24c from Stormrest on (10c more with a horse). Ships sail from seven in the morning to five in the afternoon; in winter about one day in five is too stormy, and the harbourmaster can tell you the next few days.',
    'Stormrest Isle: a bare rock halfway across, with a harbour wall, an inn and a lighthouse.',
    'Dawnport, Valdoria’s great port: about 450 people with Valdorian names, sandstone houses under red tiles, the Harbour Plaza and the Plaza Mayor with its fountain and orange trees, salt pans along the shore, vineyards on the slope, the Customs House on the quay and the Consul’s palace on the rise. Nineteen businesses, its own market and prices, its own watch, and a Consul chosen by its merchants.',
    'Valdoria is a foreign land: its people have no say in Alderwyn’s support for you, and the Lord Treasurer’s audits stop at the sea. Its queen, its laws and its dealings with Alderwyn come in the next part of the stage, with Goldmeadow, Thornwick and Stonewatch.',
  ] },
  { v: '0.42', date: '5 November', title: 'Petitions to the crown', items: [
    'As ruler, now and then something comes that only the crown can answer: a town gone hungry asks for grain from the treasury; a lord frees a man your judges sent to his gaol and says your court has no business in his lands; the guilds ask for lower tariffs through a hard season. Each choice costs something either way. Answer on the Realm page (they also appear in Tasks); left six days, a petition counts as refused and the silence is noticed. The same kind will not come twice within fifteen days.',
    'Nobles answer to the crown’s court: when a commoner accuses one, the case is brought to you in Crownmere, whatever your delegation setting.',
    'Markets recover from a shortage: when a town runs badly short of something, the price draws traders from the other towns, faster the worse it gets.',
    'Managers buy more carefully: when supplies are dear they order only what the next batch or two needs, instead of draining the market. A managed bakery no longer pushes Hearthmoor’s grain to its highest price all winter.',
  ] },
  { v: '0.41', date: '5 November', title: 'Fair warning', items: [
    'People now age a year every season (15 days) by default, so a child grows up in about 240 days and you can play your heirs. The slow calendar ageing (a year every 60 days) is still in Settings. When an heir is grown, you can hand everything over and retire from the Family page.',
    'Winter is seen coming. The clock and the pause screen say how many days until the next season; the Ledger and the Shops page have a season box: what this season and the next will do, the last fifteen days of prices at the Trading Post, and what your shops have in storage. A manager can lay in a reserve in autumn and winter, but only while supplies are at or below their usual price, and within a daily limit.',
    'Fear no longer silences everyone. It quiets people in public (by up to 70%), but frightened people may whisper what they know to your rivals at court instead. Hush money buys about twenty days of silence, not forever; then they may come back, for half as much again.',
    'Mercy needs a true reason. Choose hardship, first offence, repayment, cooperation or making peace, and only reasons that fit the case are offered. Or pardon openly as a favour. The town weighs the reason against the harm and the person’s record, and every hearing shows how many times they have been found guilty before.',
    'Captured bandits get a hearing: if the Marshal has not sentenced them in three days, the royal judges send them to the dungeon (or the road gangs if the treasury is short). Hanging now quiets the roads of the region they were taken in, not the whole realm, and the court only approves where those roads were truly dangerous.',
    'Managers have a character. Candidates come with a word from those who know them (right more often than not), and anyone convicted of fraud is named as such. You can audit a manager’s books for 15c every five days; an audit finds most skimming and opens a case.',
    'A house’s price follows the rent it has actually brought in over about two weeks, so a rent raised this morning adds nothing.',
    'From a playtest: when Hearthmoor’s chest runs low, the Elder stands a watchman down instead of leaving the whole watch unpaid until it quits. The story’s tasks name whoever holds the office now. Snow lies on the ground in winter, while buildings keep their colour.',
  ] },
  { v: '0.40', date: '5 November', title: 'Seasons, and justice in proportion', items: [
    'A calendar: five-day months, twelve months to a year, from Thawmonth to Snowmelt. The clock shows the date; the pause screen shows the season. People now age a year every sixty days by default (Settings can still make it quicker or stop it).',
    'Four seasons. The harvest comes in autumn and grain is cheap; in winter the fields are bare, wood dear as every hearth burns it, the mines slow, fewer travellers come, and thieves are bolder. Summer brings traders and good spirits. Prices rise and fall with the year. Winter turns the land grey and brings snow; autumn turns it gold.',
    'Someone arrested must be heard by the next day, or let go. Sentences show what they cost in a life: with the calendar, a day in a cell is about six days of the prisoner’s life. The longest sentences only appear when the evidence is strong and the harm is serious.',
    'Mercy is lawful: find someone guilty and pardon them openly, with a reason. The town judges whether the reason was fair. Two days of work for the town is a new penalty: no cell, and the town gets the value.',
    'Confiscation is proportional: the law can take only up to twice what the crime was worth plus the court’s largest fine. Taking more is still possible, as an abuse, and the worse the seizure the heavier it weighs.',
    'Rumour starts an inquiry; it does not prove one. An inquiry needs someone who saw it and is willing to say so. Victims talk most; those who profited stay quiet; fear and loyalty shut mouths. How bad an abuse is depends on what it did and how much it took.',
    'A house’s price follows the rent it can really earn, not the rent you ask: raising the rent does not make a house worth more.',
    'The royal council: one seat at a time, and no longer a road for life. Resign a seat to change roads (ten days’ wait). The Marshal’s seat now needs safe roads in your lands, and Lord Justice needs a record of fair verdicts and no abuse found out.',
    'Delegation: as a lord or the crown, choose which cases come to you (serious and sensitive, only sensitive, or none) and bring any case to yourself. A ruler of every court sees only a handful; the captains and royal judges hear the rest.',
    'New crimes. Smuggling at the ports when tariffs are high (seize the cargo for the town, or keep it, which is remembered; a watchman on the take is dismissed). Poaching in the King’s forest under Forest Law, often by the hungry, sometimes paid for by a richer man you can charge. Fraud: a dishonest manager may skim your takings; the books show it, the court hears it, and a convicted manager is let go. Sometimes the shortfall has an honest explanation.',
    'Hoarding is now a case: the Master of Trade’s inquiry opens one, and you can fine the hoarder or have them put the stock back on sale. Hoards are more likely at harvest.',
    'Captured bandits: hang them, press them into the garrisons (some desert), keep them in the dungeon for twenty days (1c a day each), set them to mend the roads, or pardon them on oath (some go back to robbing).',
  ] },
  { v: '0.39', date: '5 November', title: 'Courts of the realm', items: [
    'Every town has a court: a guard captain who answers to its lord, and a gaol in a building it already has. Greenhaven\u2019s cell under the Moot Hall (2), Stane Keep (4), Oakbridge Keep (5), Eastwatch Castle (6), and the King\u2019s Prison at Crownmere Castle (14). Each has its own cases, prisoners and record.',
    'As a lord you hear the serious cases in your own region (big thefts, violence, corruption) and the captain deals with the rest. You can fine up to 100c and order up to ten days; the crown in Crownmere up to 200c and twenty days. You appoint the captain, set how big the guard is (paid from the town chest), give to the chest, and build or mend the gaol. An office in one place gives no orders in another.',
    'Property can be taken as a penalty: forfeit to the town and sold into its chest, which is lawful; or taken for yourself, which works, frightens every owner in town, and is a theft that can reach the crown.',
    'The council offices have work of their own. The Lord Treasurer audits the town chests for mayors with a hand in them. The Master of Trade looks into merchants hoarding grain, wood or ore. The Marshal sends soldiers (paid by the treasury, apart from the watch) to sweep bandits off the roads and tries the ones they bring back. The Lord Justice frees anyone held without lawful cause, investigates crooked officials, overturns convictions and pardons.',
    'The crown can dismiss a councillor and name another, take a lordship from its lord, and pardon anyone in any court.',
    'Your ledger now shows income from your lands and your share as a merchant\u2019s partner, so every coin has a line.'
  ] },
  { v: '0.38', date: '5 November', title: 'Law and order', items: [
    'Every town keeps a watch sized to its people: about one for every forty, never fewer than two, and the capital a few more. Hearthmoor starts with 2, Greenhaven 2, Ironcrest 5, Oakbridge 6, Eastwatch 12 and Crownmere 33, and each grows or shrinks with its town.',
    'Hearthmoor has a village watch: named villagers paid from the village chest, who walk their rounds of the market, the houses, the east road or the watch house. As Elder you take people on (their kit is bought from the smith), set their duty and pay, and dismiss them. Unpaid guards lose heart and, after six days, leave.',
    'A watch house behind the Village Hall with two cells (up to four), bunks for three guards (up to five), and a condition that wears; rotten cells let prisoners slip out. Improvements and repairs come from the village chest.',
    'Thefts, assaults and corruption now happen for real reasons (hunger, empty purses, bad tempers, a hand in the chest) and are reported against named people. The accused is not always the culprit: some are mistaken, some are lies. Patrols make crime less likely, not impossible.',
    'Cases have evidence and witnesses. The watch investigates; you can arrest (if a cell is free), release, and hear the case: dismiss, or find guilty with a warning, repayment, a fine and up to three days in the cells (about nine months of their life). A held suspect must be heard within four days or go free. Unpaid fines are paid off a little at a time or worked off.',
    'You can be fair, or not. Take a bribe, lean on a witness, convict on nothing, let a guilty friend go, keep a fine for yourself, or have the watch hold someone on your word. These work, but people who know may talk, ask for money to keep quiet, or bring it to the council, which can open an inquiry, fine you or remove you. An honest guard may refuse an unlawful order.',
    'Prisoners cannot work: a jailed worker leaves your shop short, a jailed owner\u2019s business suffers, and their family feel it. Wrongful convictions leave grudges. The Lord Justice and the crown can overturn convictions (with compensation) and pardon.',
    'You can hand routine cases, or all of them, to the council. Cases waiting for you, private offers and demands appear in Tasks. A new Justice page shows the watch, the watch house, open cases, prisoners and what people are saying.'
  ] },
  { v: '0.37', date: '5 November', title: 'Honest books', items: [
    'A lordship costs more for a bigger place: Hearthmoor 300c, Greenhaven 350c, Ironcrest 500c, Oakbridge 600c, Eastwatch 800c.',
    'The royal council is three roads, and you walk only one. Coin: Master of Trade (own 3 businesses, deliver 3 supply contracts), then Lord Treasurer (be worth 2,500c, never touch the treasury). Arms: Marshal (300c of patrols, clear a road of bandits). Law: Lord Justice (have been Elder, keep 2 promises). Once you take a seat, the other roads are shut.',
    'Each council office has its own dress: the Master of Trade in blue with a fat purse, the Lord Treasurer in green and gold with the treasury key, the Marshal in a breastplate and plumed helm with a sword, the Lord Justice in a black robe with white bands and the white rod.',
    'Hands now sell only to villagers who have not bought that day, and each one weighs the street price as any customer would and pays from their own purse. When everyone has what they need, there is nothing to sell: more hands, or a higher price, no longer means guaranteed takings.',
    'The ledger names every coin: houses and businesses bought, building work, gifts to the crown, food for your household and stabling each get their own line. Anything it cannot name shows as Unrecorded (and fails the game\u2019s own tests).',
    'Goods you deliver for a contract go onto that town\u2019s market and ease its shortage, and towns hit by a shortage are the likeliest to post a contract for the good they lack.'
  ] },
  { v: '0.36', date: '5 November', title: 'Good years and bad', items: [
    'Bigger shops take more staff. A stall has one worker and no manager; a timber building has room for a hand and a manager; a stone one for two hands. Hands help at the bench and the counter and sell round the town, the first the most. Too many hands, or hands with an empty shelf, cost more than they bring in: the ledger tells you which.',
    'Markets now stay short or glutted for a week or two. Now and then a blight, a flood, a flooded mine or a bumper year shakes one town\u2019s grain, wood or ore, and you hear about it, so hauling goods there pays.',
    'Businesses no longer all thrive. A sharp owner sells more than a dull one, and any place can hit a bad spell for a few weeks. One that keeps losing money closes, and before long someone (one of its old hands, or a newcomer from Ashford) reopens it.',
    'Hearthmoor no longer slowly empties: when there is a roof free, a worker or a young family arrives from Ashford.',
    'Where a building stands sets its price. Houses and businesses cost more in richer towns (Crownmere about twice Hearthmoor) and more in the heart of town than on its edge. Signs and cards say which part of town a place is in.',
    'A business you buy in Hearthmoor now shows your own card when you walk up: staff, manager, what it sold and earned yesterday, and Manage. Shops you do not own have a Buy button beside Ask for work.',
    'The Businesses list at the top, and the Shops page, show what each place earned yesterday, and what bought businesses sold. A business you lease out shows the rent it pays you each day instead.',
    'Leases now have a term: 14, 30 or 60 days (a longer lease is a coin cheaper a day). Neither you nor the tenant can break it early unless the rent falls 2 days behind. It renews when the term is up unless you untick Renew. While it is leased, the tenant runs it: you cannot hire, fire, set wages, hire a manager or sell it.'
  ] },
  { v: '0.35', date: '5 November', title: 'Signs and seals', items: [
    'Every house you can buy has a FOR SALE sign by its door. Walk up to it to see who owns it, who lives there, the rent and its condition, and buy it on the spot.',
    'Once it is yours the sign says YOURS (or HOME). Use it to move in, set the rent, evict a tenant, improve or repair the house, or put it up for sale.',
    'Your houses show what you have done to them: flower boxes, a lantern by the door and a banner as you improve them, boards across the door when nobody lives there, and rubble when they need repair. Your tenants greet you when you pass.',
    'Your title sits at the start of the row at the top, and your clothes change as you rise: a purse for a merchant, a chain for a councillor, robe and staff for the Elder, cloak and plumed cap for a lord, crown and ermine for the ruler.',
    'Managers are now about keeping a place running while you are away: a little more custom, a quicker worker, supplies a tenth cheaper overnight, a happy worker and a replacement if one quits. In tests a shop with a manager earned about 6c a day more than one without, after the wage.',
    'The ledger now adds up to the coin: managers\u2019 wages and orders, and town fees for businesses elsewhere, have their own lines, and anything else shows as Other.',
    'Buying or selling a load of goods is priced one unit at a time, so a big sale lowers the price as you go.',
    'Over many years, townsfolk spend their savings and full town chests get spent, so coin no longer piles up for ever.'
  ] },
  { v: '0.34', date: '5 November', title: 'Making it matter', items: [
    'One fair economy. Every business, yours or not, now sells into the same demand: a town\u2019s grown people and its travellers, shared between every seller of that trade by how many hands each has. Ingredients cost what the town\u2019s market charges that day, and bigger towns cost more to trade in but have more custom to win. Your Hearthmoor shops now share the village\u2019s custom with Gerd, Hollin, Ysolde and Ash.',
    'Grain, timber and iron ore have their own stock and price in every town. Greenhaven grows grain cheaply, Ironcrest digs iron, and the cities pay more for both. You can buy and sell at every town\u2019s market, and the Trading Post shows what each town pays, so carrying goods between towns can pay.',
    'Contracts: the lords and towns ask for goods delivered, repairs paid for and roads cleared of bandits. Take up to two at a time from the Realm page. Lords also ask for your word that their roads will stay safe for a week; keep it, and they remember.',
    'Power is earned by deeds. Gifts and feasts still help, but each one in a fortnight counts for half the last. A lordship now needs a deed done in that region. A council seat needs two allies and a name for good government. The crown needs three allies and a promise kept.',
    'Three people of influence: Julian Marchant, buying up bakeries for a monopoly on bread; Gareth Stane, lord of Ironcrest, fighting for his son\u2019s right to inherit; and Ambrose Fell, the Lord Justice, pressing for the Fair Courts. Back them or oppose them; each changes what you can do.',
    'Taking money from the treasury as ruler can be found out: you must repay it with a fine, the lords think less of you, and if you cannot pay, the council removes you.',
    'Exile is a chapter of its own: win back three sworn allies, raise a war chest, win over the towns and expose the new ruler\u2019s failings. Waiting alone no longer brings you back.',
    'A lord holds one region at a time. You can move into its seat, which takes your family\u2019s name: Varrow Manor becomes your manor, Stane Keep your keep. The ruler lives in Crownmere castle.',
    'Choose a first and a family name for your character. And choose how you begin: from nothing, as a merchant with a Bread Stand, as the Elder of Hearthmoor, as lord of Greenhaven, or as ruler of Alderwyn.',
    'Manage at one of your shops or businesses now opens just that place: its prices, stock, upgrades, staff and manager. Show all businesses goes back to the full list.',
    'Your shop counters at the top are now one Businesses button. Tap it for a short list with Go and Manage on each. The Shops page is sorted into a tab for each town, with the ones you could buy folded away underneath.',
    'A Tasks button at the top shows everything you have been asked to do: the elder\u2019s errands, orders, contracts, promises, your shifts and your managers\u2019 decisions, each with a button to head there. The number on it counts what is waiting.',
    'Find people: on anyone\u2019s page in the Ledger, tap "Find them" for a gold light over them and a mark on the minimap. If they are in another town, the minimap points the way.',
    'If you die and carry on as a young child, a regent runs the family\u2019s affairs until they come of age at 16. Your village council seat now falls vacant at a death, and can be won back at a moot.'
  ] },
  { v: '0.33', date: '4 November', title: 'All of Alderwyn, and its crown', items: [
    'Two new towns. Ironcrest, about 200 people on a mountain shelf above Crownmere: mines driven into the crags, smelters, charcoal burners and Stane Keep. Eastwatch, about 480 people in a walled port on the sea: quays, warehouses, ships at the piers, a shipyard, a lighthouse and the Warden\u2019s castle. Roads run up to Ironcrest from Crownmere and east to Eastwatch from Oakbridge, over new bridges on the Alder.',
    'The realm has a King, a Prince, six regional lords and a royal council (Lord Treasurer, Master of Trade, Marshal and Lord Justice). A new Realm page in the Ledger shows them all, and your standing with each.',
    'Rise at court: gifts to the crown and attending court in Crownmere castle win favour. With favour of 55 and 400c you can ask the King for a failing lord\u2019s lands; with 65, a lord can take a council seat. Lords set patrols, garrisons, road mending and taxes in their lands, and collect the taxes.',
    'Your support has four parts: the lords, the guilds, the court and the towns. Gifts to the lords, feasts for the guilds and feasts in a town all raise it. With a lordship, a council seat, support of 65 and an old King whose own standing has fallen below 45, you can claim the crown.',
    'As ruler you set taxes, tariffs and the size of the army, proclaim four laws, and keep the treasury out of debt. Rule badly and a rival claimant raises an army; lose and you go into exile, stripped of lands and seats, with half your coin seized. After a month you can win the realm back.',
    'Bandits gather on the roads of every region. Left alone they raid towns, robbing chests, shops and people; on the road they can waylay you, worst at night and on foot. Patrols, garrisons, watchmen and the army keep them down, and anyone can pay for patrols.',
    'Lordships and the crown pass to a grown child of your blood with the court\u2019s recognition; council seats are given, not inherited.',
    'Homes and property: improve any home you own in three steps (homely, comfortable, fine), keep houses in repair, put houses and businesses up for sale and take or turn down buyers\u2019 offers, and let a business to someone who runs it and pays you rent each day. Property values rise and fall with each town\u2019s fortunes.',
    'Walk into Crownmere castle\u2019s great hall, with the King on his high seat, and the halls of Stane Keep and Eastwatch Castle.',
    'From far off, each town is a shape on the horizon, and Crownmere castle stands above the roofs as you approach. Ironcrest and Eastwatch fly the realm\u2019s green and white.'
  ] },
  { v: '0.32', date: '4 November', title: 'Homes and interiors', items: [
    'Move into any house you own: open the Property page and tap "Move in" on an empty house. Your husband or wife and your children come with you, even to another town, and it shows on the map and minimap as your home.',
    'Your old hut stays yours. Its card lets you move back in whenever you like.',
    'Walk inside: stand at your home, your hut, or any shop, inn or workshop and tap "Go inside". Walk about as usual; the walls nearest you fade away so you can see in, and you leave by walking out of the door or tapping "Step outside".',
    'Every trade has its own room. A forge with a glowing hearth and anvil, an inn with a bar, barrels, tables and a fire, a bakehouse with its domed oven, a butcher\u2019s counter under hanging hams, looms, potter\u2019s wheels, tanning vats, workbenches, a mill with its great stones, and more.',
    'Homes have a hearth, a table and benches, beds, chests and shelves; townhouses have a staircase. At night your family are in their beds; by day whoever is home is about the house.',
    'The people who work in a place are at their benches and ovens when you walk in, and visitors stand or sit about. Tap anyone inside to see who they are.'
  ] },
  { v: '0.31', date: '4 November', title: 'Every trade its own building', items: [
    'Shops in Oakbridge, Greenhaven and Crownmere no longer share one design. You can tell what goes on inside from the street.',
    'Smithies are low stone forges with a great chimney and an open shed where the anvil and glowing hearth stand. Taverns are big inns with a jettied upper floor, dormers, benches and ale out front.',
    'Bakeries are whitewashed with a domed bread oven bulging from the side and loaves on the hatch. Butchers have a striped awning with hams hanging over the counter.',
    'Goldsmiths, apothecaries, chandlers and tailors are tall, narrow townhouses with a bay window of wares. Weavers have a row of tall windows and dyed cloth drying outside; potters have a bottle kiln; tanners a yard of vats and stretched hides.',
    'Joiners, wheelwrights, coopers, carters and boatwrights work from timber workshops with their great doors open on a yard of wheels, barrels, carts or an upturned hull. Masons have a stone lodge, blocks and a crane.',
    'Houses come in many more shapes: jettied timber townhouses, three-storey stone houses, houses with a gable over the street, longhouses with a dormer, and stone and thatched cottages, with shutters and window boxes on some.'
  ] },
  { v: '0.30', date: '4 November', title: 'Quieter place cards', items: [
    'Walking past a place no longer opens its big card. A small tab with its name shows at the bottom instead: tap it to open the card, and tap \u25be to fold it away again.',
    'Places you chose to go to, your own job while on shift, and your own shops and businesses still open fully, since you need their buttons.',
    'If you liked the old way, Settings has "Place cards: open as you arrive".'
  ] },
  { v: '0.29', date: '4 November', title: 'A minimap', items: [
    'A small round map now sits in the top-right corner: the streets, buildings, walls and water around you, with north at the top. The arrow is you, pointing the way the camera looks.',
    'Your hut, your houses and your businesses are marked in gold. Below it is the name of the town you are in, or "On the road".',
    'Tap the minimap to open the full map. You can hide it in Settings.'
  ] },
  { v: '0.28', date: '4 November', title: 'Crownmere, the capital', items: [
    'The roads to the capital are open: north from Oakbridge, and north-east from Greenhaven. Crownmere stands on the shore of Crown Lake, beneath the mountains.',
    'About 1,150 people live in its seven wards: Castle Hill, the Court Quarter of the great houses, the Great Market, the Guild Ward, the Lakeside quays, the crowded Old Town, and the South Ward inside the King\u2019s Gate.',
    'Over fifty shops, taverns and workshops, any of which you can buy. The Lord Mayor and the guild masters govern the city from the Guildhall, with its own chest, fees and votes.',
    'The royal castle stands on its hill above the lake, visible across the city. The court, the king\u2019s offices and the crown come in the next parts of this stage.',
    'Coaches run to Crownmere from every stage post, and the capital has its own.',
    'In a big city, only the people near you are drawn; everyone else goes on living, unseen, so the phone stays smooth.',
    'Every family has a surname. A married woman takes her husband\u2019s name, and the name she was born with is kept, so trees show "n\u00e9e Fenn" and you can follow her back to her own family.',
    'The world no longer begins today: two or three generations of the dead now stand behind the living, so grandparents, great-grandparents and old cousins appear in every tree.',
    'Family trees open out as you explore: tap anyone and their parents, husband or wife, brothers and sisters and children join the tree, without losing the people already shown. Tap again for Centre on them, Their life, or Fold their family away.',
    'On the world map, tap any open town and choose "Town map" to look round its streets from afar. Tapping a place there offers the journey or the coach.'
  ] },
  { v: '0.27', date: '4 November', title: 'Family trees', items: [
    'Every person now has a family tree, drawn on parchment: grandparents and parents above, husband or wife and brothers and sisters beside, children and grandchildren below. The dead are marked with a cross.',
    'Open your own tree from the Family page, or anyone\u2019s from their card or their page in the book. Tap anyone in a tree to centre it on them and follow a family back through the generations.',
    'Every box says how that person is related to whoever the tree is centred on: father, half-sister, second cousin once removed, mother-in-law, uncle by marriage and so on. The heading says how they are related to you.',
    'Tap "How are two people related?" and then anyone in the tree to compare the two.'
  ] },
  { v: '0.26', date: '4 November', title: 'Your own family', items: [
    'You now grow older too, starting at twenty. A new Family page in the book shows your age, your husband or wife, your children, and who would carry on after you.',
    'Court someone: tap them, spend time together once a day, or bring a gift. When they are fond enough, ask them to marry you (the feast costs 20c). They move in with you.',
    'Hope for children, as many as you like, or not for now. Your children live with you, and you feed them.',
    'You can separate. It costs a quarter of your coin, their good opinion, and some of the village\u2019s respect. The children stay with you.',
    'Name your heir and see what they would inherit. Money and property pass to them; the Elder\u2019s chair falls vacant for the moot; a lordship passes only to a grown child of your blood; your standing carries over only in part.',
    'When you die, carry on as your heir, or retire early and hand everything over. With nobody to carry on, begin again as a newcomer in the same world, which remembers everything that came before.'
  ] },
  { v: '0.25', date: '4 November', title: 'A whole life', items: [
    'Time now passes for everyone. People age a year every four days of play, with birthdays spread through the year so a generation never grows old all at once.',
    'Young people court and marry (a wife takes her husband\u2019s name), set up house together, and have children spread over the years. Children grow, come of age at sixteen, find work and leave home.',
    'The old retire, and in time they die. What they leave passes on: coin to a husband or wife, or shared among the children; houses and businesses to the next of kin. A business with nobody to take it on closes until someone reopens it.',
    'Offices fall vacant and are filled their own way: the moot chooses a new Elder, a town votes in a new mayor or reeve, and a lordship passes to a grown child with the crown\u2019s recognition.',
    'Each person\u2019s page shows their husband or wife, parents and children. The People page remembers those who have died.',
