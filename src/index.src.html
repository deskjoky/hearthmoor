<title>Hearthmoor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed 3D village; parchment HUD strip on top, parchment action card at the bottom,
   a leather-bound book for management, a pause menu, and a title screen that opens like a book cover.
   One deliberate look in both light and dark hosts. */
:root {
  color-scheme: light;
  --ink: #2a1f16;
  --ink-soft: #5d4a36;
  --parch: #ead8b2;
  --parch-2: #dcc493;
  --leather: #35251b;
  --leather-2: #4c3626;
  --seal: #8c2e21;
  --moss: #4a6634;
  --gold: #a87d22;
  --gilt: #e2b552;
  --line: rgba(42, 31, 22, .22);
  --f-display: "IM Fell English", "Iowan Old Style", Georgia, serif;
  --f-caps: "IM Fell English SC", "IM Fell English", Georgia, serif;
  --f-body: "Alegreya Sans", "Gill Sans", "Trebuchet MS", system-ui, sans-serif;
}
[hidden] { display: none !important; }
html, body { height: 100%; background: #1d2420; color: var(--ink); overflow: hidden; overscroll-behavior: none; }
body { font-family: var(--f-body); font-size: 15px; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
#world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--seal); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* HUD */
.hud { position: fixed; top: 0; left: 0; right: 0; z-index: 5; pointer-events: none;
  padding-top: calc(env(safe-area-inset-top, 0px) + 8px);
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.strip { pointer-events: auto; display: flex; align-items: center; gap: 8px; background: linear-gradient(#efdfbd, var(--parch));
  border: 1px solid var(--line); border-radius: 6px; padding: 5px 6px; box-shadow: 0 3px 12px rgba(0,0,0,.35); max-width: 720px; margin: 0 auto; }
.icon-btn { border: 0; background: transparent; width: 40px; height: 40px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.icon-btn span, .icon-btn span::before, .icon-btn span::after { display: block; width: 18px; height: 2px; background: var(--ink); border-radius: 1px; position: relative; }
.icon-btn span::before, .icon-btn span::after { content: ""; position: absolute; left: 0; }
.icon-btn span::before { top: -6px; } .icon-btn span::after { top: 6px; }
.clock { font-family: var(--f-display); font-size: 18px; white-space: nowrap; }
.coins { margin-left: auto; font-weight: 700; font-size: 17px; color: var(--gold); white-space: nowrap; }
.coins.debt { color: #e0806e; }
.coins::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #f0cf6a, #9c7414); margin-right: 5px; vertical-align: -1px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
.task-btn { background: #6b5636; margin-right: 6px; } .task-btn span { display: inline-block; min-width: 18px; margin-left: 6px; padding: 0 5px; border-radius: 9px; background: var(--gold, #c9962b); color: #2a1d12; font: 700 12px/18px var(--f-body); }
.task-btn span:empty { display: none; }
.book-btn { border: 0; background: var(--leather); color: var(--parch); border-radius: 4px; padding: 8px 12px; font-family: var(--f-display); font-size: 16px; min-height: 40px; }
.subhud { pointer-events: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; max-width: 720px; margin: 6px auto 0; }
.chip { background: rgba(32, 26, 20, .74); color: #f1e3c2; border-radius: 999px; padding: 4px 10px; font-size: 13px; white-space: nowrap; }
.chip b { color: #f5cf73; font-weight: 700; }
.chip.on { background: rgba(74, 102, 52, .9); }
.treewrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 10px; padding-bottom: 6px; background: radial-gradient(ellipse at center, rgba(255,248,226,.6), rgba(0,0,0,0)); border-radius: 8px; }
.tree { display: block; margin: 0 auto; font-family: var(--f-body); }
.tree .tname { font-family: var(--f-display); font-size: 14px; fill: #2a1f16; }
.tree .tsub { font-size: 11px; fill: #5e4a38; } .tree .trel { font-size: 11px; font-style: italic; fill: #8e2b22; }
.tree .tlabel { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; fill: #7a5a32; } .tree .tmark { font-size: 14px; fill: #8e2b22; }
.tree .tnode { cursor: pointer; } .tree .tnode.dead rect { opacity: .85; } .tree .tnode.me rect { fill: #f7e3a6; }
.tree .tnode:hover rect, .tree .tnode:focus rect { stroke-width: 3; } .tree .tnode.sel rect { stroke: #c9962b; } .tree .tplus { fill: #f4e7c8; font: 700 12px var(--f-body); }
.warnbox { border-color: #8e2b22 !important; }
.bizmenu { pointer-events: auto; max-width: 380px; margin: 6px auto 0; background: rgba(32, 26, 20, .92); color: #f1e3c2; border: 1px solid rgba(226, 181, 82, .6); border-radius: 10px; padding: 6px; max-height: 52vh; overflow-y: auto; display: grid; gap: 4px; }
.bizrow { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 7px; background: rgba(255, 255, 255, .05); }
.bizrow .bi { flex: 1; min-width: 0; font-size: 13px; line-height: 1.3; }
.bizrow .bi b { color: #f5cf73; font-weight: 700; }
.bizrow .bi .nm { display: block; font-size: 14px; color: #f1e3c2; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bizrow button { flex: none; border: 1px solid rgba(226, 181, 82, .7); background: transparent; color: #f1e3c2; border-radius: 6px; padding: 6px 10px; min-height: 36px; font-size: 13px; cursor: pointer; }
.bizrow button.go { background: rgba(226, 181, 82, .18); }
.chip.btn { pointer-events: auto; cursor: pointer; border: 1px solid rgba(226, 181, 82, .7); min-height: 0; padding: 3px 10px; font-size: 13px; font-weight: 400; border-radius: 999px; background: rgba(32, 26, 20, .74); color: #f1e3c2; line-height: 1.35; }
.goal { pointer-events: auto; max-width: 720px; margin: 6px auto 0; font-size: 13px; color: #f1e3c2; background: rgba(32,26,20,.74); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.goal em { font-family: var(--f-display); font-style: italic; color: #f5cf73; font-size: 14px; }

.speeds { display: flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; flex: none; }
.fast { border: 0; border-left: 1px solid var(--line); background: transparent; min-width: 34px; height: 34px; padding: 0 6px; font-size: 14px; font-weight: 700; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.fast:first-child { border-left: 0; }
.fast[aria-pressed="true"] { background: var(--leather); color: var(--parch); }
/* thumbsticks rest in the lower corners and jump to wherever your thumb lands */
.minimap { position: fixed; z-index: 5; top: calc(env(safe-area-inset-top, 0px) + 66px); right: max(12px, calc(env(safe-area-inset-right, 0px) + 6px)); width: 116px; padding: 0; border: 0; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.minimap canvas { width: 116px; height: 116px; border-radius: 50%; border: 3px solid #e8d6ae; box-shadow: 0 0 0 1px #5b4630, 0 3px 10px rgba(0,0,0,.45); background: #7d8f55; display: block; }
.minimap span { font: 400 13px var(--f-display); color: #f1e3c2; background: rgba(32,26,20,.74); border-radius: 5px; padding: 1px 8px; white-space: nowrap; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
.dialog { position: fixed; z-index: 7; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); width: min(560px, calc(100% - 32px)); background: linear-gradient(var(--parch), #e3cea4); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 4px 22px rgba(0,0,0,.5); padding: 12px 14px 10px; }
.dialog p { margin: 0 0 8px; font: 400 17px/1.45 var(--f-display); color: var(--ink); }
.dialog .dacts { display: flex; justify-content: flex-end; align-items: center; gap: 8px; } .dialog .dacts span { margin-right: auto; font-size: 12px; color: var(--ink-soft); }
.sticks { display: none; } /* the controls work without anything drawn on screen */
.stick { position: fixed; width: 120px; height: 120px; border-radius: 50%; border: 2px solid rgba(241, 227, 194, .45); background: radial-gradient(circle, rgba(20,14,10,.18), rgba(20,14,10,.38)); bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); opacity: .55; transition: opacity .15s; }
.stick.l { left: calc(max(16px, env(safe-area-inset-left, 0px)) + 18px); }
.stick.r { right: calc(max(16px, env(safe-area-inset-right, 0px)) + 18px); }
.stick.live { opacity: .9; transition: none; }
.stick i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #f3e6c8, #cdb48a); box-shadow: 0 2px 8px rgba(0,0,0,.45); }
.stick span { position: absolute; left: 0; right: 0; bottom: -20px; text-align: center; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: rgba(241,227,194,.75); text-shadow: 0 1px 3px #000; }
.stick.live span { display: none; }
.lookhint { position: fixed; right: calc(max(16px, env(safe-area-inset-right, 0px)) + 22px); bottom: calc(env(safe-area-inset-bottom, 0px) + 30px); display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: rgba(241,227,194,.7); text-shadow: 0 1px 3px #000; transition: opacity .4s; }
.lookhint.used { opacity: 0; }

.toasts { position: fixed; z-index: 6; left: 0; right: 0; top: 130px; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.toast { max-width: 340px; background: var(--parch); border-left: 3px solid var(--ink-soft); border-radius: 4px; padding: 4px 9px; font-size: 13px; line-height: 1.3; box-shadow: 0 3px 10px rgba(0,0,0,.35); animation: tin .25s ease-out; }
.toast.coin { border-color: var(--gold); } .toast.bad { border-color: var(--seal); } .toast.good { border-color: var(--moss); } .toast.story { border-color: var(--leather); font-family: var(--f-display); font-size: 14px; }
.toast.out { opacity: 0; transform: translateY(-6px); transition: .4s; }
@keyframes tin { from { opacity: 0; transform: translateY(-8px); } }
.night { position: fixed; z-index: 4; left: 50%; top: 50%; transform: translate(-50%, -50%); font-family: var(--f-display); font-style: italic; font-size: 22px; color: #e9d9b0; text-shadow: 0 2px 8px #000; pointer-events: none; }

/* action card */
/* the prompt sits between the two sticks and only shows when there is something to do */
.panel { position: fixed; z-index: 5; left: 0; right: 0; bottom: 0;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
  padding-left: calc(max(16px, env(safe-area-inset-left, 0px)) + 160px); padding-right: calc(max(16px, env(safe-area-inset-right, 0px)) + 160px); pointer-events: none; }
.card { pointer-events: auto; max-width: 440px; margin: 0 auto; background: linear-gradient(var(--parch), #e3cea4); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 -2px 18px rgba(0,0,0,.4); padding: 10px 12px 12px; max-height: 46vh; overflow-y: auto; }
.card.tab { max-width: 300px; padding: 0; background: rgba(32,26,20,.78); border-color: rgba(232,214,174,.5); box-shadow: 0 2px 10px rgba(0,0,0,.35); }
.cardtab { display: flex; align-items: baseline; justify-content: center; gap: 8px; width: 100%; border: 0; background: none; color: #f1e3c2; font: 400 16px var(--f-display); padding: 7px 14px; cursor: pointer; }
.cardtab small { font: 400 11px var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: rgba(241,227,194,.7); }
.cardfold { float: right; border: 1px solid var(--line); background: rgba(255,255,255,.35); border-radius: 6px; width: 30px; height: 26px; margin: 0 0 4px 8px; font-size: 14px; color: var(--ink-soft); cursor: pointer; }
.card h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 19px; line-height: 1.1; text-wrap: balance; }
.card .sub { color: var(--ink-soft); font-size: 13px; margin-top: 2px; line-height: 1.3; }
.card .why { font-size: 13px; margin-top: 5px; padding: 5px 7px; line-height: 1.3; background: rgba(255,255,255,.35); border-radius: 4px; }
.card .why b { font-weight: 700; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--parch); border-radius: 5px; padding: 8px 12px; min-height: 42px; font-weight: 500; font-size: 15px; }
.btn.alt { background: transparent; color: var(--ink); }
.btn.warn { background: var(--seal); border-color: var(--seal); }
.btn:disabled { opacity: .45; cursor: default; }
.btn small { display: block; font-size: 12px; opacity: .8; font-weight: 400; }
.places { display: flex; gap: 6px; margin-top: 8px; overflow-x: auto; scrollbar-width: none; }
.places::-webkit-scrollbar { display: none; }
.place { flex: none; border: 1px dashed var(--ink-soft); background: transparent; border-radius: 999px; padding: 6px 11px; font-size: 13px; color: var(--ink-soft); min-height: 34px; }
.bar { height: 8px; background: rgba(42,31,22,.15); border-radius: 4px; margin-top: 8px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--gold); border-radius: 4px; }
.mood i { background: var(--moss); } .mood.low i { background: var(--seal); }

/* book and pause sheets */
.sheet { position: fixed; inset: 0; z-index: 20; background: rgba(12, 9, 7, .72); display: flex; align-items: stretch; justify-content: center;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) max(8px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 10px) max(8px, env(safe-area-inset-left, 0px)); }
.cover { width: 100%; max-width: 720px; background: var(--leather); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,.6), inset 0 0 0 2px var(--leather-2); min-height: 0; }
.bookhead { display: flex; align-items: flex-end; min-width: 0; }
.bookhead .tabs { flex: 1; min-width: 0; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; padding: 0 2px; align-items: flex-end; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; border: 0; background: #5a4130; color: #e8d6b0; padding: 8px 9px 10px; border-radius: 6px 6px 0 0; font-family: var(--f-display); font-size: 15px; min-height: 40px; }
.tab[aria-selected="true"] { background: var(--parch); color: var(--ink); }
.close { margin-left: auto; flex: none; border: 0; background: transparent; color: #e8d6b0; font-size: 26px; line-height: 1; padding: 4px 10px; min-height: 40px; min-width: 40px; }
.page { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; background: radial-gradient(ellipse at 50% 0%, #f2e4c6, var(--parch) 60%, var(--parch-2)); border-radius: 0 6px 6px 6px; padding: 16px 18px 24px; user-select: text; -webkit-user-select: text; }
.page.round { border-radius: 6px; }
.page.turn { animation: turn .35s ease-out; transform-origin: left center; }
@keyframes turn { from { opacity: .2; transform: perspective(900px) rotateY(-14deg); } }
.page h3 { font-family: var(--f-display); font-weight: 400; font-size: 26px; margin: 0 0 4px; text-wrap: balance; }
.page h4 { font-family: var(--f-display); font-weight: 400; font-size: 19px; margin: 18px 0 6px; border-bottom: 1px solid var(--line); padding-bottom: 3px; }
.page p { line-height: 1.5; margin: 6px 0; max-width: 62ch; }
.lead { color: var(--ink-soft); font-style: italic; font-family: var(--f-display); font-size: 16px; }
.paused { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
table.acct { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 15px; }
table.acct td { padding: 3px 0; border-bottom: 1px dotted var(--line); }
table.acct td:last-child { text-align: right; padding-left: 10px; white-space: nowrap; }
table.acct tr.tot td { border-bottom: 0; border-top: 1.5px solid var(--ink); font-weight: 700; }
table.acct tr.sh td { color: var(--ink-soft); font-size: 14px; }
.day { margin-top: 14px; padding: 10px 12px; background: rgba(255,255,255,.28); border: 1px solid var(--line); border-radius: 6px; }
.dayhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.dayhead strong { font-family: var(--f-display); font-weight: 400; font-size: 20px; }
.seal { display: inline-flex; align-items: center; justify-content: center; min-width: 58px; height: 30px; padding: 0 9px; border-radius: 15px; color: #f6e8c8; font-weight: 700; font-size: 14px; background: var(--moss); box-shadow: inset 0 0 0 2px rgba(0,0,0,.15); white-space: nowrap; }
.seal.neg { background: var(--seal); color: #f6e8c8; }
.notes { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.notes li { padding-left: 14px; position: relative; line-height: 1.45; }
.notes li::before { content: "\2766"; position: absolute; left: -2px; top: 0; color: var(--seal); font-size: 11px; }
.notes .btn { margin-top: 5px; min-height: 36px; padding: 5px 10px; font-size: 14px; }
.shopnote { font-family: var(--f-display); font-size: 16px; margin: 10px 0 2px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
.box { background: rgba(255,255,255,.28); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; min-width: 0; margin-top: 10px; }
.grid2 .box { margin-top: 0; }
.box h5 { margin: 0 0 4px; font-family: var(--f-display); font-weight: 400; font-size: 20px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 14px; font-variant-numeric: tabular-nums; margin: 0; }
.kvbar { display: grid; grid-template-columns: 90px 1fr 32px; gap: 10px; align-items: center; margin: 4px 0; font-size: 14px; } .kvbar .bar { margin: 0; } .kvbar b { text-align: right; }
.kv dt { color: var(--ink-soft); } .kv dd { margin: 0; text-align: right; }
.kv .later { color: rgba(42,31,22,.42); }
.stepper { display: inline-flex; align-items: center; gap: 6px; }
.stepper button { width: 40px; height: 40px; border-radius: 5px; border: 1px solid var(--ink); background: transparent; font-size: 20px; }
.stepper output { min-width: 56px; text-align: center; font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--seal); height: 32px; }
.goals { list-style: none; padding: 0; margin: 8px 0; display: grid; gap: 8px; }
.goals li { display: flex; gap: 10px; align-items: flex-start; line-height: 1.4; }
.goals .tick { flex: none; width: 22px; height: 22px; border: 1.5px solid var(--ink); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; }
.goals .done .tick { background: var(--moss); border-color: var(--moss); color: #f3e6c8; }
.goals .done span:last-child { color: var(--ink-soft); text-decoration: line-through; text-decoration-color: rgba(42,31,22,.4); }
.goals .now span:last-child { font-weight: 700; }
textarea, input[type=text] { width: 100%; font: 14px/1.3 var(--f-body); background: #f6ecd6; border: 1px solid var(--line); border-radius: 4px; padding: 8px; color: var(--ink); }
textarea { min-height: 90px; font: 12px/1.3 ui-monospace, Menlo, monospace; }
.confirm { margin-top: 8px; padding: 8px 10px; border: 1px solid var(--seal); border-radius: 6px; background: rgba(140,46,33,.08); }
.trades { width: 100%; border-collapse: collapse; font-size: 14px; }
.trades td, .trades th { text-align: left; padding: 5px 4px; border-bottom: 1px dotted var(--line); vertical-align: top; }
.trades th { font-weight: 500; color: var(--ink-soft); font-size: 13px; }
.pill { display: inline-block; border-radius: 999px; padding: 1px 8px; font-size: 12px; background: rgba(42,31,22,.1); white-space: nowrap; }
.pill.yes { background: var(--moss); color: #f3e6c8; }
.seg { display: inline-flex; border: 1px solid var(--ink); border-radius: 6px; overflow: hidden; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 8px 12px; min-height: 40px; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--parch); }
.seg.towns { display: flex; margin-bottom: 10px; }
.seg.towns button { flex: 1 1 auto; }
.forsale { margin-top: 12px; }
.forsale summary { cursor: pointer; font-weight: 600; padding: 8px 0; min-height: 40px; }
.setting { margin: 14px 0; }
.setting > span { display: block; font-weight: 700; margin-bottom: 6px; }
.setting p { margin: 4px 0 0; color: var(--ink-soft); font-size: 14px; }

/* pause menu: an illuminated two-page spread */
.pspread { display: grid; gap: 14px; }

const mini = { on: false };
function openMini() {
  const e = Sim.empById(G.job.emp), M = MINI[e.trade];
  Object.assign(mini, { on: true, trade: e.trade, M, pos: 0, dir: 1, speed: 0.55, zone: newZone(), level: 0, holding: false, streak: 0, perfects: 0, made: 0, hits: 0, msg: M.hint, flash: '' });
  $('mini').hidden = false; $('panel').hidden = true; renderMini(true);
}
function closeMini() { mini.on = false; $('mini').hidden = true; renderCard(true); }
function newZone() { const w = 0.16 + Math.random() * 0.06; const a = 0.15 + Math.random() * (0.7 - w); return [a, a + w]; }
function renderMini(full) {
  const M = mini.M;
  if (full) {
    $('mini').innerHTML = `<div class="mhead"><b>${M.name}</b><span id="mscore" class="num"></span><button type="button" class="mx" data-c='["ui","miniClose"]' aria-label="Stop">&times;</button></div>
      <div class="mtrack ${mini.trade}"><div class="mzone" id="mzone"></div><div class="mline" id="mline"></div><div class="mneedle" id="mneedle"></div><span class="mlabel">${M.bar}</span></div>
      <p class="mmsg" id="mmsg"></p>
      <button type="button" class="btn mgo" id="mgo">${M.verb}</button>`;
    const go = $('mgo');
    if (M.kind === 'pour') {
      const down = ev => { ev.preventDefault(); mini.holding = true; mini.level = 0; Snd.play('pour'); };
      const up = ev => { ev.preventDefault(); if (mini.holding) { mini.holding = false; judge(); } };
      go.addEventListener('pointerdown', down); go.addEventListener('pointerup', up); go.addEventListener('pointerleave', up); go.addEventListener('pointercancel', up);
    } else go.addEventListener('pointerdown', ev => { ev.preventDefault(); judge(); });
  }
  const pos = M.kind === 'pour' ? mini.level : mini.pos;
  if (M.kind === 'pour') $('mneedle').style.width = (Math.min(1.05, pos) * 100) + '%'; else $('mneedle').style.left = (Math.min(1.05, pos) * 100) + '%';
  const z = M.kind === 'pour' ? [0.82, 0.95] : mini.zone;
  $('mzone').style.left = (z[0] * 100) + '%'; $('mzone').style.width = ((z[1] - z[0]) * 100) + '%';
  $('mline').style.left = (M.kind === 'pour' ? 100 : -10) + '%';
  $('mmsg').textContent = mini.msg;
  $('mscore').textContent = `${mini.made} ${M.done} · tips ${G.job ? (G.job.tips || 0) : 0}/8c`;
}
function stepMini(dt) {
  if (!mini.on) return;
  if (!G.job || !Sim.inShift(G) || !Sim.playerAtWork(G)) { closeMini(); toast('You stepped away from your work.', 'info', true); return; }
  if (mini.M.kind === 'pour') { if (mini.holding) { mini.level += dt * 0.42; if (mini.level > 1.04) { mini.holding = false; judge(); } } }
  else { mini.pos += mini.dir * mini.speed * dt; if (mini.pos > 1) { mini.pos = 1; mini.dir = -1; } if (mini.pos < 0) { mini.pos = 0; mini.dir = 1; } }
  renderMini(false);
}
function judge() {
  const M = mini.M;
  let q;
  if (M.kind === 'pour') { const l = mini.level; q = l > 1 ? 0 : l >= 0.86 && l <= 0.92 ? 2 : l >= 0.82 && l <= 0.95 ? 1 : 0; mini.level = 0; }
  else { const [a, b] = mini.zone, mid = (a + b) / 2, half = (b - a) / 2, off = Math.abs(mini.pos - mid); q = off <= half * 0.35 ? 2 : off <= half ? 1 : 0; }
  Snd.play(M.sound);
  if (q) {
    mini.hits++; mini.streak++; if (q === 2) mini.perfects++;
    mini.msg = (q === 2 ? 'Perfect! ' : '') + M.ok + '.' + (mini.streak > 2 ? ' ' + mini.streak + ' in a row.' : '');
    if (mini.hits % 4 === 0) {
      const tip = mini.perfects >= 3 ? 2 : 1; mini.perfects = 0; mini.made++;
      const r = Sim.cmd(G, 'shiftTip', tip);
      Snd.play(tip > 1 ? 'great' : 'good');
      mini.msg = r.ok && !r.msg ? `${Sim.empById(G.job.emp).boss} is pleased: +${tip}c tip.` : (r.msg || 'Good work.');
      drainEvents();
    }
    mini.speed = Math.min(1.4, mini.speed + 0.04);
  } else { Snd.play('miss'); mini.streak = 0; mini.msg = M.bad + '. Try again.'; mini.speed = Math.max(0.5, mini.speed - 0.06); }
  mini.zone = newZone();
  renderMini(false);
}

/* ----- patch notes and the update check ----- */
const BUILD = '/*BUILD*/';
const NOTES = [
  { v: '0.34', date: '5 November', title: 'Making it matter', items: [
    'One fair economy. Every business, yours or not, now sells into the same demand: a town\u2019s grown people and its travellers, shared between every seller of that trade by how many hands each has. Ingredients cost what the town\u2019s market charges that day, and bigger towns cost more to trade in but have more custom to win. Your Hearthmoor shops now share the village\u2019s custom with Gerd, Hollin, Ysolde and Ash.',
    'Grain, timber and iron ore have their own stock and price in every town. Greenhaven grows grain cheaply, Ironcrest digs iron, and the cities pay more for both. You can buy and sell at every town\u2019s market, and the Trading Post shows what each town pays, so carrying goods between towns can pay.',
    'Contracts: the lords and towns ask for goods delivered, repairs paid for and roads cleared of bandits. Take up to two at a time from the Realm page. Lords also ask for your word that their roads will stay safe for a week; keep it, and they remember.',
    'Power is earned by deeds. Gifts and feasts still help, but each one in a fortnight counts for half the last. A lordship now needs a deed done in that region. A council seat needs two allies and a name for good government. The crown needs three allies and a promise kept.',
    'Three people of influence: Julian Marchant, buying up bakeries for a monopoly on bread; Gareth Stane, lord of Ironcrest, fighting for his son\u2019s right to inherit; and Ambrose Fell, the Lord Justice, pressing for the Fair Courts. Back them or oppose them; each changes what you can do.',
    'Taking money from the treasury as ruler can be found out: you must repay it with a fine, the lords think less of you, and if you cannot pay, the council removes you.',
    'Exile is a chapter of its own: win back three sworn allies, raise a war chest, win over the towns and expose the new ruler\u2019s failings. Waiting alone no longer brings you back.',
    'A lord holds one region at a time. You can move into its seat, which takes your family\u2019s name: Varrow Manor becomes your manor, Stane Keep your keep. The ruler lives in Crownmere castle.',
    'Choose a first and a family name for your character. And choose how you begin: from nothing, as a merchant with a Bread Stand, as the Elder of Hearthmoor, as lord of Greenhaven, or as ruler of Alderwyn.',
    'Manage at one of your shops or businesses now opens just that place: its prices, stock, upgrades, staff and manager. Show all businesses goes back to the full list.',
    'Managers earn their wage. In a shop they bring in regulars and travellers (about a third more customers), work alongside your worker (up to half again as fast), order supplies overnight at a tenth off and keep your worker happy; in a town business they count as an extra hand and get supplies a tenth cheaper. Only careless managers make mistakes now.',
    'Your shop counters at the top are now one Businesses button. Tap it for a short list with Go and Manage on each. The Shops page is sorted into a tab for each town, with the ones you could buy folded away underneath.',
    'A Tasks button at the top shows everything you have been asked to do: the elder\u2019s errands, orders, contracts, promises, your shifts and your managers\u2019 decisions, each with a button to head there. The number on it counts what is waiting.',
    'Find people: on anyone\u2019s page in the Ledger, tap "Find them" for a gold light over them and a mark on the minimap. If they are in another town, the minimap points the way.',
    'If you die and carry on as a young child, a regent runs the family\u2019s affairs until they come of age at 16. Your village council seat now falls vacant at a death, and can be won back at a moot.'
  ] },
  { v: '0.33', date: '4 November', title: 'All of Alderwyn, and its crown', items: [
    'Two new towns. Ironcrest, about 200 people on a mountain shelf above Crownmere: mines driven into the crags, smelters, charcoal burners and Stane Keep. Eastwatch, about 480 people in a walled port on the sea: quays, warehouses, ships at the piers, a shipyard, a lighthouse and the Warden\u2019s castle. Roads run up to Ironcrest from Crownmere and east to Eastwatch from Oakbridge, over new bridges on the Alder.',
    'The realm has a King, a Prince, six regional lords and a royal council (Lord Treasurer, Master of Trade, Marshal and Lord Justice). A new Realm page in the Ledger shows them all, and your standing with each.',
    'Rise at court: gifts to the crown and attending court in Crownmere castle win favour. With favour of 55 and 400c you can ask the King for a failing lord\u2019s lands; with 65, a lord can take a council seat. Lords set patrols, garrisons, road mending and taxes in their lands, and collect the taxes.',
    'Your support has four parts: the lords, the guilds, the court and the towns. Gifts to the lords, feasts for the guilds and feasts in a town all raise it. With a lordship, a council seat, support of 65 and an old King whose own standing has fallen below 45, you can claim the crown.',
    'As ruler you set taxes, tariffs and the size of the army, proclaim four laws, and keep the treasury out of debt. Rule badly and a rival claimant raises an army; lose and you go into exile, stripped of lands and seats, with half your coin seized. After a month you can win the realm back.',
    'Bandits gather on the roads of every region. Left alone they raid towns, robbing chests, shops and people; on the road they can waylay you, worst at night and on foot. Patrols, garrisons, watchmen and the army keep them down, and anyone can pay for patrols.',
    'Lordships and the crown pass to a grown child of your blood with the court\u2019s recognition; council seats are given, not inherited.',
    'Homes and property: improve any home you own in three steps (homely, comfortable, fine), keep houses in repair, put houses and businesses up for sale and take or turn down buyers\u2019 offers, and let a business to someone who runs it and pays you rent each day. Property values rise and fall with each town\u2019s fortunes.',
    'Walk into Crownmere castle\u2019s great hall, with the King on his high seat, and the halls of Stane Keep and Eastwatch Castle.',
    'From far off, each town is a shape on the horizon, and Crownmere castle stands above the roofs as you approach. Ironcrest and Eastwatch fly the realm\u2019s green and white.'
  ] },
  { v: '0.32', date: '4 November', title: 'Homes and interiors', items: [
    'Move into any house you own: open the Property page and tap "Move in" on an empty house. Your husband or wife and your children come with you, even to another town, and it shows on the map and minimap as your home.',
    'Your old hut stays yours. Its card lets you move back in whenever you like.',
    'Walk inside: stand at your home, your hut, or any shop, inn or workshop and tap "Go inside". Walk about as usual; the walls nearest you fade away so you can see in, and you leave by walking out of the door or tapping "Step outside".',
    'Every trade has its own room. A forge with a glowing hearth and anvil, an inn with a bar, barrels, tables and a fire, a bakehouse with its domed oven, a butcher\u2019s counter under hanging hams, looms, potter\u2019s wheels, tanning vats, workbenches, a mill with its great stones, and more.',
    'Homes have a hearth, a table and benches, beds, chests and shelves; townhouses have a staircase. At night your family are in their beds; by day whoever is home is about the house.',
    'The people who work in a place are at their benches and ovens when you walk in, and visitors stand or sit about. Tap anyone inside to see who they are.'
  ] },
  { v: '0.31', date: '4 November', title: 'Every trade its own building', items: [
    'Shops in Oakbridge, Greenhaven and Crownmere no longer share one design. You can tell what goes on inside from the street.',
    'Smithies are low stone forges with a great chimney and an open shed where the anvil and glowing hearth stand. Taverns are big inns with a jettied upper floor, dormers, benches and ale out front.',
    'Bakeries are whitewashed with a domed bread oven bulging from the side and loaves on the hatch. Butchers have a striped awning with hams hanging over the counter.',
    'Goldsmiths, apothecaries, chandlers and tailors are tall, narrow townhouses with a bay window of wares. Weavers have a row of tall windows and dyed cloth drying outside; potters have a bottle kiln; tanners a yard of vats and stretched hides.',
    'Joiners, wheelwrights, coopers, carters and boatwrights work from timber workshops with their great doors open on a yard of wheels, barrels, carts or an upturned hull. Masons have a stone lodge, blocks and a crane.',
    'Houses come in many more shapes: jettied timber townhouses, three-storey stone houses, houses with a gable over the street, longhouses with a dormer, and stone and thatched cottages, with shutters and window boxes on some.'
  ] },
  { v: '0.30', date: '4 November', title: 'Quieter place cards', items: [
    'Walking past a place no longer opens its big card. A small tab with its name shows at the bottom instead: tap it to open the card, and tap \u25be to fold it away again.',
    'Places you chose to go to, your own job while on shift, and your own shops and businesses still open fully, since you need their buttons.',
    'If you liked the old way, Settings has "Place cards: open as you arrive".'
  ] },
  { v: '0.29', date: '4 November', title: 'A minimap', items: [
    'A small round map now sits in the top-right corner: the streets, buildings, walls and water around you, with north at the top. The arrow is you, pointing the way the camera looks.',
    'Your hut, your houses and your businesses are marked in gold. Below it is the name of the town you are in, or "On the road".',
    'Tap the minimap to open the full map. You can hide it in Settings.'
  ] },
  { v: '0.28', date: '4 November', title: 'Crownmere, the capital', items: [
    'The roads to the capital are open: north from Oakbridge, and north-east from Greenhaven. Crownmere stands on the shore of Crown Lake, beneath the mountains.',
    'About 1,150 people live in its seven wards: Castle Hill, the Court Quarter of the great houses, the Great Market, the Guild Ward, the Lakeside quays, the crowded Old Town, and the South Ward inside the King\u2019s Gate.',
    'Over fifty shops, taverns and workshops, any of which you can buy. The Lord Mayor and the guild masters govern the city from the Guildhall, with its own chest, fees and votes.',
    'The royal castle stands on its hill above the lake, visible across the city. The court, the king\u2019s offices and the crown come in the next parts of this stage.',
    'Coaches run to Crownmere from every stage post, and the capital has its own.',
    'In a big city, only the people near you are drawn; everyone else goes on living, unseen, so the phone stays smooth.',
    'Every family has a surname. A married woman takes her husband\u2019s name, and the name she was born with is kept, so trees show "n\u00e9e Fenn" and you can follow her back to her own family.',
    'The world no longer begins today: two or three generations of the dead now stand behind the living, so grandparents, great-grandparents and old cousins appear in every tree.',
    'Family trees open out as you explore: tap anyone and their parents, husband or wife, brothers and sisters and children join the tree, without losing the people already shown. Tap again for Centre on them, Their life, or Fold their family away.',
    'On the world map, tap any open town and choose "Town map" to look round its streets from afar. Tapping a place there offers the journey or the coach.'
  ] },
  { v: '0.27', date: '4 November', title: 'Family trees', items: [
    'Every person now has a family tree, drawn on parchment: grandparents and parents above, husband or wife and brothers and sisters beside, children and grandchildren below. The dead are marked with a cross.',
    'Open your own tree from the Family page, or anyone\u2019s from their card or their page in the book. Tap anyone in a tree to centre it on them and follow a family back through the generations.',
    'Every box says how that person is related to whoever the tree is centred on: father, half-sister, second cousin once removed, mother-in-law, uncle by marriage and so on. The heading says how they are related to you.',
    'Tap "How are two people related?" and then anyone in the tree to compare the two.'
  ] },
  { v: '0.26', date: '4 November', title: 'Your own family', items: [
    'You now grow older too, starting at twenty. A new Family page in the book shows your age, your husband or wife, your children, and who would carry on after you.',
    'Court someone: tap them, spend time together once a day, or bring a gift. When they are fond enough, ask them to marry you (the feast costs 20c). They move in with you.',
    'Hope for children, as many as you like, or not for now. Your children live with you, and you feed them.',
    'You can separate. It costs a quarter of your coin, their good opinion, and some of the village\u2019s respect. The children stay with you.',
    'Name your heir and see what they would inherit. Money and property pass to them; the Elder\u2019s chair falls vacant for the moot; a lordship passes only to a grown child of your blood; your standing carries over only in part.',
    'When you die, carry on as your heir, or retire early and hand everything over. With nobody to carry on, begin again as a newcomer in the same world, which remembers everything that came before.'
  ] },
  { v: '0.25', date: '4 November', title: 'A whole life', items: [
    'Time now passes for everyone. People age a year every four days of play, with birthdays spread through the year so a generation never grows old all at once.',
    'Young people court and marry (a wife takes her husband\u2019s name), set up house together, and have children spread over the years. Children grow, come of age at sixteen, find work and leave home.',
    'The old retire, and in time they die. What they leave passes on: coin to a husband or wife, or shared among the children; houses and businesses to the next of kin. A business with nobody to take it on closes until someone reopens it.',
    'Offices fall vacant and are filled their own way: the moot chooses a new Elder, a town votes in a new mayor or reeve, and a lordship passes to a grown child with the crown\u2019s recognition.',
    'Each person\u2019s page shows their husband or wife, parents and children. The People page remembers those who have died.',
    'Choose the pace of ageing in Settings: slow, normal, fast, or off. Your own character\u2019s life comes in the next update.'
  ] },
  { v: '0.24', date: '4 November', title: 'The Elder\u2019s powers', items: [
    'As Elder you now decide what becomes of the open land south of the village: three new cottages for incoming families, or a common pasture that pays field hands more and brings grazing fees.',
    'Set the budget for the village works. Spend too little and the well, the lanterns or the paving fall into disrepair and people grumble; spend more and they think well of you. Mending costs half the price of building.',
    'Appoint a Granary Keeper (lean weeks become rare) and a Village Watchman (more travelers stop at every shop), each paid 3c a day from the chest.',
    'An Elder who isn\u2019t you uses the same powers: they open the land, appoint officers and keep the works going in their own way.',
    'All of it lives under Elder\u2019s business on the Village page, and at the Village Hall.'
  ] },
  { v: '0.23', date: '4 November', title: 'Managers', items: [
    'Hire a manager for any shop or business you own, from the people of the town it stands in. See them on the Staff page.',
    'Managers keep a worker on, pay fair wages, take on staff, order supplies and set prices to what sells, all within a daily budget you choose.',
    'Small repairs are paid from the budget. Bigger ones come to you in the ledger as a decision: mend it, or let it wait while takings suffer.',
    'Every evening each manager reports how the day went. Their reports are at the top of the ledger.',
    'A sharp manager costs more; a careless one is cheap and now and then loses you a few coins.'
  ] },
  { v: '0.22', date: '4 November', title: 'Coaches and horses', items: [
    'Each town has a stage post: a coaching office with a coach and horses waiting. Coaches run to the other towns from six in the morning until seven at night, for a few coins.',
    'Buy a horse at any stage post for 140c. Riding is more than twice as fast as walking. Mount and get down from the button at the top of the screen; stabling costs 1c a night.',
    'Open the world map and tap a town to walk or ride there along the roads, or head to the stage post for a coach. Travel takes as long as the road is long.',
    'Travel times on the map now match how fast you really walk.'
  ] },
  { v: '0.21', date: '4 November', title: 'The north road and Greenhaven', items: [
    'The north road is open. It leaves the east road at the signpost by the waystation and climbs north-west to Greenhaven.',
    'Greenhaven is a farming town of about eighty on the river Green: cottages round a village green with a maypole and a well, the Plough inn, a bakehouse, a dairy, a forge, Fleece & Loom, a butcher and a wheelwright.',
    'The Great Mill turns its wheel in the river, and the Ashcombes keep Ashcombe Hall behind its garden wall across the Green Bridge. The Hall is a business like any other: buy it if you can afford it.',
    'Hedged fields of wheat, barley and beans surround the town, with sheep and cattle in their pastures and an orchard by the lanes. Townsfolk work the fields, mind the flocks and lay the hedges.',
    'Greenhaven has its own reeve and council, chosen from the townsfolk by standing, with a town chest and votes like Oakbridge\u2019s. Visit the moot hall to see them.',
    'Hungry families now send someone out to find day work, and the mayor and reeve feed the children first.',
    'The map, the People and Property pages, and the world map all know about Greenhaven.'
  ] },
  { v: '0.20', date: '4 November', title: 'Men and women', items: [
    'Women now wear long dresses to the ground, with long hair, braids, buns or a white coif. Men wear belted tunics with hose and shoes, short or cropped hair, and many have beards.',
    'Everyone has their own hair and hair colour, and the old go grey.',
    'Married couples in Oakbridge are now always a man and a woman.',
    'Fixed townsfolk walking in place on the docks and at the washing steps: they no longer get caught between the path and the water\u2019s edge.',
    'Fixed families crowding onto one spot at their front door and shuffling there. Each now stands in their own place.',
    'Fixed many townsfolk showing up in plain white clothes instead of their own colours.'
  ] },
  { v: '0.19', date: '4 November', title: 'A larger Oakbridge', items: [
    'Oakbridge is rebuilt at twice the size: wider streets, room between every building, and a market square 44 metres across with a fountain and eight stalls.',
    'The walls now follow the lie of the land instead of a perfect circle, with towers at every bend and a proper gatehouse where the road from Hearthmoor arrives.',
    'The Oak Bridge sits at street level and you can walk across it. Townsfolk use it too, instead of wading the river.',
    'A timber wharf runs along the quay, with boats floating on the water beside it. The river now lies a little below its banks.',
    'Townsfolk spread out: they gather in the market square, the hall square, the guild yard, on the quay and on Tanners\u2019 Green, and many simply go home in the evening.',
    'Trees and kitchen gardens fill the open ground inside the walls. Your Oakbridge business and home keep their families; homes move to their new places.'
  ] },
  { v: '0.18', date: '4 November', title: 'The gates of Oakbridge open', items: [
    'Oakbridge is open: a walled market city of about 240 people on the river Alder, with its own families, homes and jobs.',
    'Four districts: the Market Square inside the south gate, with a fountain and stalls; the Guild Quarter; the Riverside quay with its boats; and the East Bank with the town hall and the keep.',
    'Twenty-two businesses, each run by its own family, with rivals in the same trade competing for customers. You can buy any of them.',
    'Oakbridge has its own government: a mayor and council of guild masters, a town chest, a market fee, and weekly votes that can remove the mayor. See it all at the town hall.',
    'The town walls now run unbroken all the way round, crossing the river on arches. Walls and buildings are solid.',
    'The map shows whichever town you are in, and the People and Property pages let you switch between Hearthmoor and Oakbridge.',
    'Farms along the road now grow real crops, wheat, cabbages, beans and barley, and the field that sat on the road has moved off it.'
  ] },
  { v: '0.17', date: '3 November', title: 'The road east', items: [
    'The world no longer ends at the edge of the village. The land loads around you as you walk, with woods, meadows, rocks and wildflowers.',
    'Follow the road east over the stream bridge, past farms and a drovers\u2019 waystation, by the ruined tower of Old Barrow Keep, to the walls of Oakbridge on the river Alder.',
    'Oakbridge\u2019s gates are shut for now. They open in the next part of Stage II.',
    'The northern mountains now stand on the far horizon, where the world map puts them.'
  ] },
  { v: '0.16', date: '3 November', title: 'Right of way', items: [
    'Villagers now step aside to let you through. Walk into a crowd and people move out of your path, instead of you being stuck.'
  ] },
  { v: '0.15', date: '3 November', title: 'Your own face, and smoother crowds', items: [
    'A character creator when you start a new game: body, skin, hair style and colour, and clothes.',
    'You wear a backpack, and anything you carry goes into it. Your arms swing as you walk, carrying or not.',
    'Villagers step aside to their right when someone is in the way, so two people meeting head-on slip past each other instead of getting stuck.',
    'If someone is already standing where a villager is heading, they stop close by instead of shoving forever, and crowds gather around the edge.'
  ] },
  { v: '0.14', date: '3 November', title: 'The world map, and solid crowds', items: [
    'The map now has a World tab: an illustrated chart of Alderwyn and Valdoria across the Sundering Sea. Tap any town to read about it and when its road opens.',
    'People are solid. Villagers, workers and you can no longer walk through each other.',
    'Crowds spread out: at the well, in the square and at the notice board, everyone finds their own spot, a little different each day, and faces the people they are with.',
    'Your arms now swing as you walk, like everyone else\u2019s.',
    'Evenings: villagers set off for home one by one from about 20:00 and walk back at a natural pace. The night only speeds up once everyone is indoors.',
    'Customers at the lots south of the square now queue in front of your counter, not behind it.'
  ] },
  { v: '0.13', date: '3 November', title: 'Hearthmoor, rebuilt', items: [
    'A new, larger Hearthmoor: winding lanes around a central square, a stream with a bridge on the road east to Oakbridge, and the Pine Woods to the west.',
    'Tamsin\u2019s Mill turns on a millrace that runs from the stream along the foot of the manor\u2019s rise. Varrow Manor sits on that rise behind its garden wall.',
    'A barn and farmyard with hens and cows, the Village Hall facing the square, three lots south of the square, and open land staked out for the village to grow into.',
    'Families: husbands, wives and children share homes, and children play in the square. Thirty people live here now.',
    'Speed buttons beside the clock: 1\u00d7, 2\u00d7, 4\u00d7 and 8\u00d7. On shift you can also work the rest of the shift and skip to the end.',
    'Your save moves into the new village, with your money, businesses, houses and everyone\u2019s stories.'
  ] },
  { v: '0.12', date: '3 November', title: 'Longer days, and room to grow', items: [
    'Days now last about 18 minutes, so there is time to work, shop and walk the roads. Settings can make them 12 or 24 minutes.',
    'Wages, hunger, rent and work all follow the same clock. Villagers walk at a natural pace, and gathering is quicker.',
    'Saves now live in the browser\u2019s database, with room for the much larger world that is coming. Your old saves move over on their own.',
    'Under the hood: the village handles crowds of hundreds without slowing down, ready for the towns and cities ahead.'
  ] },
